isis: hastening allies, delaying blows, unwinding small disasters. Everything costs time you must already have saved.","abilities":[{"name":"Pocketed Hour","desc":"Store an unspent hour; release it later to act freely while the field holds its breath."},{"name":"Foregone Echo","desc":"Replay your previous spell exactly; the echo costs no mana but ages you one visible day."},{"name":"Clockwise Mercy","desc":"Turn an ally's last three seconds backward, closing the wound that now has not happened yet."},{"name":"Loitering Instant","desc":"Stretch a single instant across a zone until arrows hang midair and oaths take minutes to finish."}],"progressionSteps":["Reach level 25 and build a clock that keeps your pulse instead of the sun's.","Sit vigil over a candle burning backward, and record the hour at which it was lit.","Mend the shattered minute a dying Hourwright leaves you; waste nothing, not even the regret.","Give one year of your life to the guild's escrow, and do not ask what it is for."]},{"id":"wizard.t3d","name":"Geometer","tier":3,"level":25,"parent":"wizard.t2b","role":"Zone manipulator — displacement and folded terrain","lore":"Geometers measure the angles the world hopes nobody checks. Where they work, corridors shorten for friends and lengthen for creditors. The rank is conferred with a brass compass whose needle points to the bearer's true position — a courtesy, since after the third fold, few Geometers are entirely certain of it.","playstyle":"Redraw the battlefield's floor plan mid-fight: fold charges into walls, open doors in distance, keep melee permanently arriving. Position is your entire vocabulary.","abilities":[{"name":"Foldstep","desc":"Crease the floor and step over the crease, crossing thirty paces in one; the fold lingers for allies."},{"name":"Impossible Corridor","desc":"Bend an enemy's charge through a corner that was never there, delivering them neatly into your trap."},{"name":"Proof by Collapse","desc":"Demonstrate that a room's angles cannot all be true; the contradiction crushes everything inside it."},{"name":"Squared Circle","desc":"Inscribe a ring no straight line may cross; projectiles arrive politely at its edge and stop."}],"progressionSteps":["Reach level 25 and walk a straight line that brings you home from the far side of the city.","Fold a locked room until its inside faces outward, and take nothing from it.","Survey a battlefield the night before, and leave one angle wrong on the enemy's map.","Accept the brass compass, and forgive it in advance for what it will stop knowing."]},{"id":"wizard.t4a","name":"Ashen Rhetor","tier":4,"level":40,"parent":"wizard.t3a","role":"Artillery caster — sustained multi-target ruin","lore":"The Rhetors of Ash are an order of nine, rarely eleven. Cities hire them to end wars with a single address; the address is fire, delivered in paragraphs. Treaties name them as weapons, not signatories. When a Rhetor rises to speak, veteran armies discover pressing business elsewhere.","playstyle":"Channel long, escalating orations of flame. Each uninterrupted sentence widens the burn; interruption is your only true counter, so guard your speaking time jealously.","abilities":[{"name":"Burning Thesis","desc":"Open an argument as a channeled beam of fire that grows wider each second you remain unrefuted."},{"name":"Ash Sermon","desc":"Deliver a falling homily over the field; ash accumulates, smothering enemy healing and igniting on the third stanza."},{"name":"Closing Argument","desc":"End the discussion: every enemy below one-quarter health within earshot is summarized in flame."},{"name":"Firebreak Diction","desc":"Clip your own consonants to raise a ring of burnt ground no fire — theirs or yours — may cross."}],"progressionSteps":["Reach level 40 and address a city that hates you for one hour; leave it standing because you chose to.","Recite the Ninety Names of Fire from memory while your lectern burns beneath your notes.","Argue an old volcano back to sleep, or into eruption, as the order requires that year.","Submit your thesis in ash on stone pages, and defend it against nine Rhetors speaking at once."]},{"id":"wizard.t4b","name":"Winter Grammarian","tier":4,"level":40,"parent":"wizard.t3b","role":"Fortress controller — mass denial and permanence","lore":"Winter Grammarians parse motion out of sentences and armies alike. Where one stands, campaigns end in the declarative. Border kingdoms keep their names in sealed treaties, invoked only when a war must simply stop. Their corrections are permanent; thawing a Grammarian's work is heresy against grammar itself.","playstyle":"Impose stillness at scale: freezes that hold, walls that outlive sieges, ground rewritten to winter. Slow, inevitable, immovable — you win by making the fight unaffordable.","abilities":[{"name":"Full Stop","desc":"End every moving thing's sentence in a wide radius; the period is ice and lasts eight seconds."},{"name":"Declension of Frost","desc":"Conjugate an enemy through the cases of cold — chilled, slowed, brittle, held — one case per second."},{"name":"Winter's Syntax","desc":"Rewrite the ground's tense to past-perfect winter; the field becomes ice that remembers being a glacier."},{"name":"Unmoved Clause","desc":"Declare yourself grammatically fixed, immune to displacement and damage while you finish the current paragraph."}],"progressionSteps":["Reach level 40 and hold a mountain pass closed for a full season using nothing that melts.","Correct a river in spring flood, and leave it a road.","Parse a cavalry charge into the passive voice before the third hoofbeat.","Write one sentence in frost upon the order's black gate; if it survives summer, so does your candidacy."]},{"id":"wizard.t4c","name":"Chronarch","tier":4,"level":40,"parent":"wizard.t3c","role":"Tempo dominator — stolen turns and stasis","lore":"A Chronarch keeps court over hours the way kings keep court over counties. Debtors bring them seconds; supplicants leave younger or older, per the judgment. Armies fear their arithmetic, for battles near a Chronarch are settled before they occur, in a ledger nobody else may audit.","playstyle":"Tax enemy time and disburse it to allies. Rule engagements through stolen turns, commuted deaths, and courts of stasis. Bookkeeping wins the fight before swords do.","abilities":[{"name":"Tithe of Seconds","desc":"Levy one second per second from every enemy in your court; your allies spend the surplus."},{"name":"Regnal Hour","desc":"Declare the hour yours; allies act twice within it, and interruptions are treason, punished with stasis."},{"name":"Sentence Commuted","desc":"Overturn a death within six seconds of its verdict; the sentence transfers, reduced, to the killer."},{"name":"Adjournment","desc":"Suspend the entire engagement for five seconds; only you may file motions during recess."}],"progressionSteps":["Reach level 40 and audit your own life to the minute; unmake one hour and pay its full price.","Preside over a duel already fought, and deliver a different verdict.","Collect the year you escrowed as an Hourwright, with interest the guild cannot count.","Sit the Meridian Throne through one midnight; if dawn consents to arrive, the hour is yours to keep."]},{"id":"wizard.t4d","name":"Axiom-Breaker","tier":4,"level":40,"parent":"wizard.t3d","role":"Rule-bender — negation and mass displacement","lore":"Axiom-Breakers are banned in forty cities and consulted, quietly, by all forty. They disprove what battles depend on: that distance protects, that walls have insides, that ground is down. Each carries a list of postulates already broken; custom demands it be read aloud before accepting a surrender.","playstyle":"Attack assumptions, not bodies. Negate signature abilities, relocate formations, invert cover. Your damage is modest; the enemy plan dying of contradictions is the win condition.","abilities":[{"name":"Counterexample","desc":"Cite the one case where an enemy's ability fails; it fails now, and cannot be argued for twelve seconds."},{"name":"Disproof of Distance","desc":"Demonstrate that far is a superstition, exchanging the positions of two formations mid-maneuver."},{"name":"Parallel Postulate","desc":"Exist briefly along two parallel lines; both of you cast, and only one accepts the consequences."},{"name":"Broken Compass","desc":"Refute direction within a zone; enemy movement is redistributed by a geometry they never studied."}],"progressionSteps":["Reach level 40 and disprove one law of nature before witnesses; survive nature's rebuttal.","Escape a cell the order built to hold you, without opening it and without leaving it.","Publish your broken postulate in the deep archive, and duel the first three scholars who object.","Return the brass compass to the room where you received it, though that room no longer adjoins anything."]},{"id":"wizard.t5a","name":"Voice of Ruin","tier":5,"level":60,"parent":"wizard.t4a","role":"Cataclysm caster — battlefield-scale annihilation","lore":"Histories record three Voices of Ruin, and dispute the third. When a Voice speaks plainly, cartographers start over. The Third Siege of Vhal ended in one sentence — subject and verb, no survivors on the wrong side of the grammar. Nations do not fight Voices; they reschedule.","playstyle":"Every cast is an event: long invocations, continental cooldowns, absolute outcomes. Played less like artillery and more like a treaty clause with a pulse.","abilities":[{"name":"Ninth Vowel","desc":"Pronounce the vowel throats were shaped to prevent; everything in the sentence's path is unwritten to ash."},{"name":"The Last Sentence","desc":"Speak a target's ending, subject and verb; resistance becomes a matter of punctuation, not survival."},{"name":"Silence After","desc":"Following any ruin you utter, a hush falls in which no enemy magic can be pronounced."},{"name":"Weather of Embers","desc":"Change the region's weather to fire for one minute; it falls as rain that has forgotten water."}],"progressionSteps":["Reach level 60 and speak, in a place already lost, one word the world was built never to hear.","Unmake a mountain's name by unmaking the mountain, and leave the cartographers to argue.","Stand before the surviving Rhetors and say nothing; be confirmed by their silence.","Teach one apprentice a single safe word, so the histories may claim you showed restraint."]},{"id":"wizard.t5b","name":"Stillword","tier":5,"level":60,"parent":"wizard.t4b","role":"Absolute controller — stillness made terrain","lore":"A Stillword is what remains when a Winter Grammarian stops needing sentences. The Hundred-Banner War ended when one arrived and declined it. Regions around a Stillword adopt their stillness: rivers slow, feuds pause mid-generation, avalanches wait. Historians write of them in the present tense, indefinitely.","playstyle":"Impose an area of absolute quiet in which nothing hostile finishes: casts, charges, or wars. You barely act; the field simply forgets how to.","abilities":[{"name":"The Long Pause","desc":"Halt every hostile action across the field for ten seconds; nothing ages, bleeds, or falls."},{"name":"Unthawed Verdict","desc":"Freeze one enemy outside all seasons; the ice is permanent until you, personally, reconsider."},{"name":"Quiet That Holds","desc":"An aura in which projectiles slow to a courtesy and spells must wait their turn to exist."},{"name":"Winter, Considered","desc":"Invite the first winter to revisit; the field becomes its memory, and only you may move at speed."}],"progressionSteps":["Reach level 60 and sit one entire winter, unmoving, on the glacier you once read; let it finish your sentences.","Be declared dead, and correct no one.","Halt an avalanche mid-fall with your attention alone, then set it down gently, stone by stone.","Speak your final word aloud; everything after is punctuation."]},{"id":"wizard.t5c","name":"The Unhoured","tier":5,"level":60,"parent":"wizard.t4c","role":"Time controller — causality spent like coin","lore":"The Unhoured have stepped outside the clock entirely; calendars no longer agree on when they were born, and some now say never. They attend moments rather than inhabit them. Chronarchs rule hours; the Unhoured are owed by them. History treats each one as a rumor it cannot date.","playstyle":"Spend causality directly: act inside others' moments, revoke events, arrive before your reasons do. The cost is continuity — yours, mostly, and paid without receipts.","abilities":[{"name":"Meanwhile","desc":"Act during any other creature's action, as often as your unspent past allows."},{"name":"Never","desc":"Revoke one event from the last minute; the world keeps the scar but not the wound."},{"name":"Grandfather Clause","desc":"Damage that would kill you is referred backward to an ancestral moment that declines to allow it."},{"name":"The Uncounted Hour","desc":"Step into the hour clocks skip; return whenever you like, from any direction, rested."}],"progressionSteps":["Reach level 60 and attend your own birth; introduce yourself to no one.","Misplace a year deliberately, and refuse every offered chance to recover it.","Preside over the Meridian Throne's final session, which occurred before the throne was built.","Let every calendar forget you, and forgive the friends who follow suit."]},{"id":"wizard.t5d","name":"Worldscribe","tier":5,"level":60,"parent":"wizard.t4d","role":"Reality editor — rewrites the rules wholesale","lore":"The Undertext has authors, and once a century one of them is living. A Worldscribe carries the pen the first draft was written with — or claims to, and the claim has never survived testing by anyone who tested it. Where they annotate, geography complies. The deep archive shelves their biographies under reference.","playstyle":"Edit the engagement's source: terrain, rules, outcomes. Slow, deliberate revisions with total authority. You do not fight armies; you deprecate them.","abilities":[{"name":"Second Edition","desc":"Issue a correction to the last six seconds; the field reloads to your amended version."},{"name":"Deep Revision","desc":"Rewrite a region's terrain wholesale — mountains struck through, rivers inserted — effective immediately and retroactively."},{"name":"Authorial Intrusion","desc":"Step directly into any scene the Undertext is currently running, regardless of distance or wards."},{"name":"Binding Copy","desc":"Declare one rule of your choosing canonical for an hour; reality enforces it without appeal."}],"progressionSteps":["Reach level 60 and find the margin where the world's first author wrote; leave your reply.","Carve one rune upon the world's spine, where all the folds meet, and sign it.","Unwrite your own broken postulates and stand in the world as it was; then choose, freely, to break them again.","Outlive your biography in the deep archive by editing it, once, in your own hand."]}]},{"id":"sorcerer","name":"Sorcerer","archetype":"Arcane","icon":"🐲","tagline":"The blood decides; the sorcerer merely aims.","description":"No tutor chose them and no book explains them. Sorcery arrived with the blood — in a fever, a struck bell, a house fire nobody could account for. Every Sorcerer spends their first years surviving their own gift: grounding it, starving it, apologizing for it. The great ones stop apologizing. They learn that a flaw, aimed well, is indistinguishable from a weapon.","nodes":[{"id":"sorcerer.t1","name":"Sorcerer","tier":1,"level":1,"parent":null,"role":"Ranged caster — volatile raw burst","lore":"Every village has a story: the child who wept sparks, the granary that burned on naming-day. Sorcerers begin as accidents that lived. Hedge-wives dose them, priests test them, war-camps eventually buy them. Most spend their first years learning not to kill anyone by accident, and the rest of their lives learning to do it on purpose.","playstyle":"Volatile ranged caster. Spend raw power fast, ride surges as they come, and manage a gift that grows stronger the closer it drifts toward slipping.","abilities":[{"name":"Bloodspark","desc":"Hurl a bolt of raw sorcery drawn straight from the vein; damage rises with every surge suffered this battle."},{"name":"Gutter the Flame","desc":"Clamp your gift shut for one breath, purging a curse or magical binding from yourself as the power dies down."},{"name":"Grounding Rite","desc":"Kneel and bleed excess power into earth or iron, trading your next action for stability."},{"name":"Surge Fault","desc":"Passive — your spells sometimes echo a heartbeat later at half strength, whether or not you wanted them to."}],"progressionSteps":["Survive the night your gift first wakes — the burned bed, the frightened kin, the silence after.","Find one person who does not flinch from you, and learn to cast with them in the room.","Ground a surge into cold earth without fainting, three times, witnessed by no one who might use you.","Name your power aloud. Not curse, not blessing — yours."]},{"id":"sorcerer.t2a","name":"Wyrmblooded","tier":2,"level":10,"parent":"sorcerer.t1","role":"Midrange caster — sustained fire pressure","lore":"The dreams come first — one mountain, always seen from above. Then heat in the spit, gold weighed too long in the palm, the first scales at the nape. Wyrmblooded sorcerers are courted by armies and watched carefully by everyone else, because whatever ancestor stirs in them was never entirely human, and it is not finished waking.","playstyle":"Sustained fire pressure from midrange. Build heat with every cast, wear it as armor, and grow harder to kill the longer the fight burns.","abilities":[{"name":"First Ember","desc":"Exhale a gout of ancestral fire; targets left burning take deepened damage from your next spell."},{"name":"Underscale","desc":"Scales surface beneath the skin when you are struck, granting stacking armor that lasts while your heat holds."},{"name":"Ancestor's Pulse","desc":"Once per battle the older heart beats for yours, refusing a killing blow and igniting you fully."},{"name":"Hoard-Sense","desc":"Passive — you feel gold, gems, and hidden bodies through stone, the way the ancestor once did."}],"progressionSteps":["Reach level 10 and dream the same mountain three nights running, then wake with heat in your mouth.","Trace the old rumor in your family line to a grave, a hoard, or a lie — and forgive none of it.","Let the first scales come. Do not cut them out.","Breathe fire once, deliberately, at something you chose to burn."]},{"id":"sorcerer.t2b","name":"Stormveined","tier":2,"level":10,"parent":"sorcerer.t1","role":"Ranged caster — high-variance burst","lore":"Their moods read on barometers. Stormveined sorcerers crackle — hair lifting before they anger, candle flames leaning toward them, dice behaving strangely at their tables. Captains want them in the charge and keep them far from the powder stores. Their power is not disciplined; it is negotiated with, hourly, and it respects nothing but nerve.","playstyle":"High-variance burst caster. Court wild surges instead of suppressing them, cash lucky outcomes into damage, and gamble position on lightning-fast repositioning.","abilities":[{"name":"Levin Snap","desc":"Loose a jolting arc that rolls its damage twice and keeps the higher, then jumps to a second target."},{"name":"Sideways Luck","desc":"Passive — each wild surge you suffer banks a charm; spend charms to reroll any outcome near you once."},{"name":"Hackle Field","desc":"Static sheathes you; melee attackers are jolted, slowed, and briefly certain they smelled rain."},{"name":"Ride the Fault","desc":"Break apart into a crack of lightning and reform anywhere in sight, arriving before your thunder does."}],"progressionSteps":["Reach level 10 and stand in open weather through a storm you did not summon, until it notices you.","Lose control once in public. Pay for it. Remember the exact color of the moment before.","Wager something irreplaceable on a coin toss and let the magic call it in the air.","Learn the smell of a surge coming — copper and rain — and stop flinching."]},{"id":"sorcerer.t3a","name":"Cinderthroat","tier":3,"level":25,"parent":"sorcerer.t2a","role":"Cone caster — burning area denial","lore":"In some, the wyrm settles in the lungs. Cinderthroats speak in ruined voices and glow faintly at the collarbone when angry. Siege companies rent them by the gate; villages that hear one coughing evacuate without instruction. They are the reason certain fortresses keep doors of solid stone and generals of unusual politeness.","playstyle":"Positional cone caster. Manage banked breath and scorch stacks, cut battlefields into burning lanes, and hold ground no one can afford to cross.","abilities":[{"name":"Rendering Breath","desc":"A slow, widening cone of furnace-heat that melts armor value away before it ever touches flesh."},{"name":"Second Lung","desc":"Bank one breath of fire; release it instantly later, even while silenced, grappled, or drowning."},{"name":"Cauter Line","desc":"Draw a burning seam across the ground that persists, splitting the field into yours and theirs."},{"name":"Glasswake","desc":"Your fire fuses soil into glass; enemies crossing your scorched ground walk slowly, on knives."}],"progressionSteps":["Reach level 25 and swallow a live coal from a dragon-touched fire, and keep it down.","Hold one breath through a burning building's collapse, then walk out and speak clearly.","Reduce a fortified gate to slag while its defenders watch, and refuse the payment offered after.","Learn which of your words scorch, and stop wasting them."]},{"id":"sorcerer.t3b","name":"Scalewrought","tier":3,"level":25,"parent":"sorcerer.t2a","role":"Frontline battle-caster — attrition tank","lore":"These are the ones who stopped fighting the molt. Plate spreads over ribs and forearms; gauntlets become unnecessary, then impossible. Scalewrought walk the front rank of battles that expected no caster within reach, shrugging arrows and casting through wounds. What unsettles people is not the scale. It is how calm they have become since accepting it.","playstyle":"Frontline battle-caster. Absorb hits to bank heat, cast at claw's length, and outlast enemies who mistook you for the soft target.","abilities":[{"name":"Plated Hour","desc":"Scale closes over you entirely for a span; damage taken banks as heat your claws may spend."},{"name":"Wyrmgrip","desc":"Seize a foe in one taloned hand; spells cast into a held enemy cannot miss or be resisted."},{"name":"Molt Burst","desc":"Shed a layer of scale explosively, shredding everything adjacent and tearing every binding off you."},{"name":"Slow Furnace","desc":"Passive — you regenerate while standing in fire. Any fire. Anyone's."}],"progressionSteps":["Reach level 25 and endure a full molt awake, keeping count of every scale that comes.","Take a blade meant for someone else and let them watch it fail against you.","Sleep once, unarmored, among people who fear you, and wake having harmed no one.","Stop apologizing for your hands."]},{"id":"sorcerer.t3c","name":"Levinbrand","tier":3,"level":25,"parent":"sorcerer.t2b","role":"Mobile skirmisher — chain lightning strikes","lore":"The Stormveined who chose the lightning over the luck. Levinbrands cross provinces between dusk and dinner and end duels before their thunder arrives. Border forts log their passage as weather rather than visitors. The speed, they will tell you, was always free; it is the standing still that has to be trained.","playstyle":"Hyper-mobile skirmisher-caster. Blink through enemy lines as living lightning, chain arcs off armored targets, and bank charges from everything you evade.","abilities":[{"name":"Stepwise Lightning","desc":"Become the bolt along a chosen line, striking everything on it and arriving before your own sound."},{"name":"Chained Verdict","desc":"An arc that leaps from target to target, favoring whoever carries the most metal."},{"name":"Afterimage Charge","desc":"The place you just stood detonates in static one heartbeat after you leave it."},{"name":"Capacitor Heart","desc":"Passive — every attack you evade banks a charge; spend charges to cast instantly, without pause or breath."}],"progressionSteps":["Reach level 25 and outrun your own thunder on open ground, before a sworn skeptic.","Take one strike from the sky standing up, and keep whatever it leaves in your bones.","Cross an active battlefield touching the ground three times or fewer.","Practice stillness one hour a day. The speed is free; the stopping will cost you."]},{"id":"sorcerer.t3d","name":"Chancewright","tier":3,"level":25,"parent":"sorcerer.t2b","role":"Support disruptor — probability control","lore":"The Stormveined who followed the luck instead of the bolt. Chancewrights are banned from honest card-rooms by portrait and welcomed into war-tents by generals who want the enemy's plans stood next to. Around them, accidents stop being accidents and become negotiations — negotiations the Chancewright has usually opened already.","playstyle":"Probability manipulator and disruptor. Load outcomes for allies, sour them for enemies, and stake your own blood when the odds need forcing.","abilities":[{"name":"Loaded Hour","desc":"For a span, every random outcome nearby rolls twice; allies keep the better result, enemies the worse."},{"name":"Fumble Clause","desc":"Curse one certainty — the strap breaks, the footing slips, the sure spell sours."},{"name":"House Edge","desc":"Passive — every enemy miss near you banks a token; spend three to declare one outcome outright."},{"name":"Wager of Flesh","desc":"Stake your own blood on a spell: it casts twice if it lands, costs double if it fails."}],"progressionSteps":["Reach level 25 and win a rigged game without touching the rig — bend only the luck around it.","Lose everything once, deliberately, and note exactly where the laws of chance felt strained.","Cross an active battlefield unarmed; collect other people's arrows in your coat and none in you.","Flip one coin a thousand times and record the day it starts refusing to land."]},{"id":"sorcerer.t4a","name":"Voice of the Furnace","tier":4,"level":40,"parent":"sorcerer.t3a","role":"Siege caster — field-scale annihilation","lore":"Rare enough that cities negotiate before one arrives. A Voice speaks and mortar runs; their breath is surveyed in acres afterward. Several kingdoms keep registries of the living ones, and at least two pay a standing annual fee for the simple assurance of absence. Their footprints stay warm for days.","playstyle":"Siege-scale annihilation. Long wind-ups into field-erasing exhalations; reshape terrain, devour enemy fire, and make the far half of any battle uninhabitable.","abilities":[{"name":"Sermon of Ash","desc":"A sustained exhalation that widens as it travels, converting the far end of a battlefield to cinders."},{"name":"Firebreak","desc":"Inhale an incoming fire spell whole and keep it, adding its strength to your next breath."},{"name":"Kilnheart","desc":"Your core burns openly; nearby allied weapons take on a working edge of flame."},{"name":"The Long Vowel","desc":"Hold one burning note; while it sounds, no flame on the field obeys anyone but you."}],"progressionSteps":["Reach level 40 and unmake a siege alone — the walls, the engines, and the appetite for another.","Refuse a king's contract to burn a city, then survive whatever he sends to insist.","Write your name into a cliff face with a single word.","Find a young Cinderthroat and teach them for nothing. The fire keeps its own accounts."]},{"id":"sorcerer.t4b","name":"The Molted","tier":4,"level":40,"parent":"sorcerer.t3b","role":"Transformed juggernaut — formation breaker","lore":"The final human skin comes off whole, and the order keeps them — pale, folded, labeled — in a cold hall under the mountain. What walks out afterward still speaks, still keeps oaths, still remembers birthdays. Veterans would rather face anything else on a wall, because the Molted come on through everything.","playstyle":"Unstoppable frontline engine. Wade through massed fire, convert punishment into strength, and dismantle formations at claw's length while spellwork seals the exits.","abilities":[{"name":"Second Shape","desc":"Assume the between-form fully — talon, tail, and wingframe — trading spell range for irresistible reach."},{"name":"Adamant Molt","desc":"Each battle's first molt leaves a standing husk that fights on beside you for a time."},{"name":"Furnace Blood","desc":"Your blood ignites as it leaves you; whoever wounds you in melee shares the burn."},{"name":"Graven Scale","desc":"Inscribe one oath upon your plate; while you keep it, that scale cannot be pierced."}],"progressionSteps":["Reach level 40 and shed the last human skin whole, then fold it yourself, without help.","Breach a shield-wall using nothing you learned from books.","Carry your shed skin to the cold hall beneath the mountain and shelve it beside the others.","Keep one human habit on purpose. The order recommends birthdays."]},{"id":"sorcerer.t4c","name":"Eye of the Tempest","tier":4,"level":40,"parent":"sorcerer.t3c","role":"Zone controller — mobile storm fortress","lore":"Elite enough that admiralties track them like weather systems, because they are one. An Eye walks inside a moving calm perhaps ten paces wide; everything beyond it is rim, and the rim is catastrophe. Ports have surrendered to nothing more than the sight of one standing dry in the harbor rain.","playstyle":"Mobile fortress of weather. Anchor a traveling storm around your own calm, punish every approach, and dictate where the battle is allowed to stand.","abilities":[{"name":"Standing Vortex","desc":"Anchor a hurricane to your heel; its walls travel with you and its calm belongs to you alone."},{"name":"Barometric Drop","desc":"Collapse the air over a zone — flyers fall, ears burst, and every flame dies at once."},{"name":"Nine Bolts Waiting","desc":"Hold sky-charges aloft; they fall, in order, on the next nine things to cross your rim."},{"name":"Lull","desc":"Silence the entire storm for three heartbeats, so everyone can consider what you are choosing not to do."}],"progressionSteps":["Reach level 40 and walk a hurricane across open sea, then park it, whole, where you chose.","Winter alone on a peak that lightning loves, and come down carrying its patience.","End a battle with no bolt landing — the threat, held steady, sufficing.","Refuse the shrine the coast builds you. Insist on being weather, not god."]},{"id":"sorcerer.t4d","name":"Hazard Saint","tier":4,"level":40,"parent":"sorcerer.t3d","role":"Fate warper — ally miracles, enemy ruin","lore":"Mercenary companies carry their tokens; insurers refuse whole districts where one sleeps. They are called saints because prayers to luck get answered in their vicinity — promptly, precisely, and at a price the parish only tallies later. Disasters do not avoid a Hazard Saint's debtors. They reroute.","playstyle":"Field-warping support. Consecrate ground where plans decay, underwrite allies' impossible attempts, and take catastrophes onto yourself to break them into inconveniences.","abilities":[{"name":"Canon of Errors","desc":"Consecrate ground where nothing proceeds as planned; enemy orders arrive garbled and reinforcements arrive lost."},{"name":"Miracle Ledger","desc":"Record an ally's impossible attempt; once per day, one recorded entry simply succeeds."},{"name":"Martyr's Odds","desc":"Take a catastrophe aimed elsewhere onto yourself, then shatter it into a hundred harmless inconveniences."},{"name":"Sainted Coin","desc":"Flip: heads, your next spell is free and doubled; tails, your enemy's is. You may not look first."}],"progressionSteps":["Reach level 40 and survive your own execution through a chain of accidents no court can call intent.","Settle every debt you owe to chance. A saint borrows for others now.","Be prayed to once, in earnest, and answer without letting them see the price.","Bless a hopeless charge and walk at the front of it, unarmored."]},{"id":"sorcerer.t5a","name":"Worldpyre","tier":5,"level":60,"parent":"sorcerer.t4a","role":"Apocalyptic artillery — terrain erasure","lore":"Histories count them in single digits and disagree about those. Where a Worldpyre fought, the maps simply note glass. Scholars argue their breath is the first fire — the one the eldest wyrms carried before there were things to burn. When a Worldpyre dies, witnesses report, the pyre lights itself.","playstyle":"Apocalyptic zone erasure. Slow, inexorable, terrain-rewriting devastation. Your presence renegotiates where armies are willing to exist, and every engagement becomes a question of evacuation routes.","abilities":[{"name":"The First Fire","desc":"Breathe the flame the eldest wyrms remember; it does not spread — it replaces."},{"name":"Glass Meridian","desc":"Draw a horizon-long line of vitrified earth that no army will cross for a generation."},{"name":"Ashfall Covenant","desc":"For one day, everything within sight burns only with your permission."},{"name":"Pyre Eternal","desc":"Passive — should you fall, your last breath lights a fire that dies only when your body reaches home."}],"progressionSteps":["Reach level 60 and breathe against a true dragon's fire until one of you looks away first.","Stand in a caldera as it wakes and breathe the eruption back down its own throat.","Spare a city you were paid, provoked, and entitled to burn — and be believed when you explain.","Burn the name your family gave the ancestor. Give the fire yours instead."]},{"id":"sorcerer.t5b","name":"The Ancestor","tier":5,"level":60,"parent":"sorcerer.t4b","role":"Draconic avatar — battlefield-ending presence","lore":"The molt completes, and the truth arrives with it: the wyrm was never behind them in the bloodline. It was ahead, waiting. What surfaces wears centuries comfortably and answers to no childhood name. Chroniclers dispute whether the sorcerer survives the becoming or merely furnishes it; the Ancestor declines to clarify.","playstyle":"Draconic avatar. Flight, claimed ground, and a presence that ends most fights before they begin — devastating in the few that begin anyway.","abilities":[{"name":"Full Surfacing","desc":"The last human proportions give way — wings, span, and a shadow armies recognize from stories."},{"name":"Weight of Ages","desc":"Your presence presses down like accumulated centuries; lesser wills kneel, flee, or empty their hands."},{"name":"Hoardbind","desc":"Claim ground and everything upon it; enemies on your claim move as through deep water."},{"name":"Long Memory","desc":"Wounds dealt to you are remembered against the giver's whole line, and the debt collects interest."}],"progressionSteps":["Reach level 60 and finish the molt that has no other side.","Fly to the mountain from the dreams and find your own claw-marks already old there.","Hear your childhood name spoken and feel nothing in you turn toward it.","Outlive the last person who knew you human, and grieve them properly.","Begin a bloodline. Somewhere far down it, someone will dream a mountain."]},{"id":"sorcerer.t5c","name":"Standing Storm","tier":5,"level":60,"parent":"sorcerer.t4c","role":"Storm incarnate — regional devastation","lore":"Sailors insist there is weather that thinks, and the almanacs have begun agreeing. A Standing Storm appears twice in good histories — once as a person, once as a recorded meteorological event, and the dates align. Whether a body still walks at the center is a question the rain declines to answer.","playstyle":"Storm incarnate. Disperse into weather and reform at will, govern the skies over whole regions, and fight as a front rather than a figure.","abilities":[{"name":"Weatherfront Body","desc":"Disperse into the storm itself; blades part rain, and the rain answers back with lightning."},{"name":"Season of Wrath","desc":"Declare the weather over a region for days; the sky honors your grief or your mercy exactly."},{"name":"The First Thunder","desc":"One peal in which every plan requiring sound, sight, or steady nerve fails simultaneously."},{"name":"Rainfall Census","desc":"Passive — you feel everything your rain touches; nothing moves under your sky unnumbered."}],"progressionSteps":["Reach level 60 and let the storm carry you, dissolved, a hundred miles — then reassemble unafraid.","Contest a weather-god above its own temple and settle for the draw.","Be entered twice in the same history: once as a name, once as a storm, dates matching.","Choose, once, over a place that wronged you, to rain gently."]},{"id":"sorcerer.t5d","name":"The Unfated","tier":5,"level":60,"parent":"sorcerer.t4d","role":"Reality editor — outcome dictation","lore":"Oracles skip them mid-prophecy without noticing the gap. Their pages arrive blank in books that were finished centuries ago. Historians find records of the Unfated erased not by any hand but by probability quietly withdrawing its cooperation. Whether they still choose things, or simply are what happens, remains — fittingly — undetermined.","playstyle":"Outcome dictation. Unhappen events, declare endings in advance, and fight as a target no divination, prediction, or aimed fate can find.","abilities":[{"name":"Torn Page","desc":"Your future cannot be read, targeted, or foretold; divinations cast at you return only weather."},{"name":"The Unhappened","desc":"Once per battle, one event that just occurred, did not."},{"name":"Dictated Ending","desc":"Declare how a duel ends before it begins; the world spends the fight arranging it."},{"name":"Probability Zero","desc":"Step briefly through an outcome no dice could reach — unharmed, elsewhere, already acting."}],"progressionSteps":["Reach level 60 and visit the oracle who has never been wrong. Watch her look through you. Apologize.","Unhappen one great grief, and learn precisely why you will never do it again.","Keep one thing certain — small, secret, yours — as an anchor, or drift.","Stand inside a history as it erases you, and smile at the space."]}]},{"id":"warlock","name":"Warlock","archetype":"Arcane","icon":"👁️","tagline":"Power on credit. The interest compounds nightly.","description":"Every Warlock owns a signature they cannot take back. Some signed for knowledge, some for revenge, one or two for love; all signed. Power arrives on schedule — the price is deferred, compounding, and collected in currencies no one thinks to guard. A Warlock's art is spending borrowed fire faster than the interest accrues, and reading every word before speaking any.","nodes":[{"id":"warlock.t1","name":"Warlock","tier":1,"level":1,"parent":null,"role":"Ranged caster — sustained pact damage","lore":"Warlocks are found, not trained. A scholar who read one margin too deep. A farmer who took the fourth road at a three-way crossing. Each carries a pact instead of a pedigree, and power that answers promptly — because prompt service is how a lender keeps a client borrowing. Guilds mistrust them. Lenders never do.","playstyle":"Sustained pact-bolts fueled by a debt meter that recharges when you take risks; spend health, position, or buffs as collateral for bursts of borrowed power.","abilities":[{"name":"Umbral Levy","desc":"Fires a bolt of borrowed shadow that deals sustained damage and refunds a sliver of your debt meter on kill."},{"name":"Witness Mark","desc":"Brands a target as observed by your patron, increasing your damage against it and revealing it through walls."},{"name":"Borrowed Fire","desc":"Spend health as collateral to double your next spell's damage; the health returns only if the spell kills."},{"name":"Read the Terms","desc":"Study an enemy for one turn to learn a resistance and gain a shield scaled to what you learned."}],"progressionSteps":["Want something more than you fear the price — enough that the wanting can be heard.","Find the offer: a book that answers back, a crossroads with a fourth road, a dream that leaves ink on your hands.","Sign. With blood, with a name, with the year you would have died happy — but sign.","Cast your first borrowed spell, and feel the interest begin."]},{"id":"warlock.t2a","name":"Brimstone Advocate","tier":2,"level":10,"parent":"warlock.t1","role":"Mid-range controller — burning debuffs and bindings","lore":"Advocates argue with hell in hell's own grammar. They study clause-law in chapterhouses whose libraries smoke faintly, and treat their pact as a live case rather than a settled debt. Devils find them insufferable and, worse, admissible. Their spellbook reads like a brief, and their fires arrive with citations attached.","playstyle":"Mid-range control through burning contract sigils; brand enemies with terms, punish them for breaching, and cash accumulated clauses into sudden hellfire verdicts.","abilities":[{"name":"Writ of Immolation","desc":"Serves a burning document upon a target; the flames intensify each turn the target acts against you."},{"name":"Breach of Terms","desc":"Reaction: when a marked enemy leaves melee or breaks a binding, it detonates for hellfire damage."},{"name":"Retainer","desc":"A minor fiend on retainer interposes itself before the next three attacks that would strike you."},{"name":"Fine Print","desc":"Inscribes an invisible clause on the ground; enemies who cross it are rooted and ignited for three turns."}],"progressionSteps":["Reach level 10 and read your own contract cover to cover, aloud, without weeping at what you find on page nine.","Study clause-law in a chapterhouse of the damned; pass the bar of Dis by burning your examiner's argument, not the examiner.","Win one amendment to your pact before an infernal notary. Lose a small thing you loved as the filing fee.","Brand the sigil of your patron's court onto your casting hand. It is a summons, and you are the paper."]},{"id":"warlock.t2b","name":"Hollow Listener","tier":2,"level":10,"parent":"warlock.t1","role":"Ranged attrition caster — mind erosion","lore":"Listeners turned from hell's tidy ledgers toward the silence between stars, where the terms are never written down. Their patrons pay attention — the payment and the price in a single word. Villages know a Listener by small absences: forgotten anniversaries, misplaced faces. Older Listeners keep journals so they will believe themselves tomorrow.","playstyle":"Attrition caster; stack whisper debuffs that erode enemy accuracy and resolve, phase-step through danger, and trade your own memories for emergency power.","abilities":[{"name":"Erosive Truth","desc":"Whispers a fact the target cannot unknow, reducing its accuracy and resolve each time it repeats an action."},{"name":"Askance","desc":"Step sideways through a direction that is not there, evading the next attack and reappearing behind its source."},{"name":"Litany of the Rim","desc":"Channels the patron's attention onto an area, dealing growing psychic damage to everything that remains and remembers."},{"name":"Tuition","desc":"Sacrifice one prepared buff to instantly refresh your longest cooldown; something small about you is different afterward."}],"progressionSteps":["Reach level 10 and spend nine nights beneath the starless patch in the constellation the charts refuse to name.","Hear the whisper. Do not answer for the first three nights; the eager ones are eaten.","Answer on the fourth. Surrender a memory of your choosing — choose badly, and it chooses next time.","Return to town and note which of your friends no longer recall your face. That is the tuition."]},{"id":"warlock.t3a","name":"Clausebinder","tier":3,"level":25,"parent":"warlock.t2a","role":"Summoner-controller — fiend theft and binding","lore":"Every devil is a signatory somewhere, and Clausebinders collect signatures. They hunt original contracts through hell's archives and mortal auction-blocks alike, then bind fiends with their own arrogant fine print. The pit calls the practice heresy; the pit's own lawyers, quietly, call it precedent. A leashed devil is a Clausebinder's letter of introduction.","playstyle":"Summoner-controller; steal enemy summons with countersigned contracts, leash a bound fiend as a persistent companion, and chain foes in place with custody law.","abilities":[{"name":"Countersign","desc":"Overwrites the summoning contract of an enemy minion, turning it to your service for the encounter."},{"name":"Chain of Custody","desc":"Manacles of clause-iron root up to three enemies; bound fiends take double damage from all sources."},{"name":"Indenture","desc":"Permanently binds one subdued fiend as a companion; it hates you lawfully and fights accordingly well."},{"name":"Perjurer's Brand","desc":"Marks a target; any deceptive act — feint, blink, or invisibility — stuns it and refunds your spell."}],"progressionSteps":["Reach level 25 and obtain a devil's true contract — the original, not a copy. Devils die guarding these.","Find the loophole. Every contract has one; the pit writes in arrogance, and arrogance leaves gaps.","Bind the fiend with its own signature and walk it leashed through the market of a mortal city.","Refuse the archdevil's offer to buy your silence. Frame the offer instead."]},{"id":"warlock.t3b","name":"Cinder Bailiff","tier":3,"level":25,"parent":"warlock.t2a","role":"Melee-hybrid striker — debt-fueled burst","lore":"When a debt to the pit matures, the Court of Embers dispatches a Bailiff — mortal, branded, and legally indistinguishable from fire. They seize exactly what is owed: a voice, a harvest, an heir's luck. Their restraint is famous and frightening; a Bailiff who takes one breath too many becomes the next collection.","playstyle":"Bruiser-collector; drag debtors into reach, brand them with growing arrears, then repossess health, buffs, and finally the killing blow when the debt matures.","abilities":[{"name":"Seizure Order","desc":"Drags a target into melee reach; its shields and wards are held in evidence for the duration."},{"name":"Brand of Arrears","desc":"Applies a debt that grows each time the target acts; the accrued total lands as fire when you collect."},{"name":"Repossession","desc":"Strips a buff, a summoned ally, or a portion of health from the target — whichever is currently worth most."},{"name":"Collector's Toll","desc":"Aura: enemies who strike you owe interest, taking a portion of their own damage dealt as hellfire."}],"progressionSteps":["Reach level 25 and petition the Court of Embers for a collector's brand-iron. Petitions are heard in the flame; kneel close.","Collect your first defaulted soul from a debtor who begs. Take exactly what is owed, and not one breath more.","Collect the second from a debtor with an army.","Burn a ledger page bearing a name you love, so the court knows your hand will not shake."]},{"id":"warlock.t3c","name":"Anglewright","tier":3,"level":25,"parent":"warlock.t2b","role":"Battlefield warper — zone control and displacement","lore":"The patron showed them angles, and the angles were true; that was the horror. Anglewrights memorize eleven forbidden diagrams and reproduce them in doorways, siege-lines, and sleep. Architects pay ruinous fees to have them certify a fortress cannot fold. Nobody pays them to make one that can. They fold anyway.","playstyle":"Zone warper; fold the battlefield so corridors reroute and cover lies, collapse proofs onto grouped enemies, and exit any fight through a wrong angle.","abilities":[{"name":"Wrong Angle","desc":"Redirects a projectile mid-flight along a fold, returning it to its origin by a route that never crossed the room."},{"name":"Folded Floor","desc":"Creases the terrain so two distant points touch; allies step across instantly, enemies arrive somewhere narrower."},{"name":"Close the Figure","desc":"Completes a diagram over an area; the enclosed space implodes, crushing everything toward its provable center."},{"name":"Impossible Interior","desc":"Opens a room that is larger inside than out; allies shelter there for one turn that lasts longer."}],"progressionSteps":["Reach level 25 and copy the eleven forbidden diagrams from memory, in one sitting, in a room with no corners.","Fold your first door: walk into a wall and out of a stranger's shadow a mile away.","Spend one night inside an angle. Come out with your name still in the right order.","Map a temple so its own priests can no longer find the altar. Leave before the geometry does."]},{"id":"warlock.t3d","name":"Void Antiphon","tier":3,"level":25,"parent":"warlock.t2b","role":"Support-debuffer — wards and name erosion","lore":"The whisper is a call; the Antiphon is the answer. These warlocks learned the response verse by verse, paying in memories they chose and some they did not. Congregations of one, they steady allies with borrowed calm and unpick enemies syllable by syllable. Their singing voice is beautiful now. It is also not theirs.","playstyle":"Support-debuffer; echo verses that ward allies while eroding enemy names, stripping titles, buffs, and certainties until foes forget how to fight.","abilities":[{"name":"Response Verse","desc":"Echoes the patron's call as a blessing, granting nearby allies a calm that absorbs fear, charm, and despair."},{"name":"Name Erosion","desc":"Sings a syllable out of the target's name, stripping one title, buff, or aspect with each verse."},{"name":"Descant of Dread","desc":"A high thin harmony only enemies hear; those below half resolve flee toward the nearest dark."},{"name":"Choir of One","desc":"Splits your voice across three positions; each may cast your whispers independently for two turns."}],"progressionSteps":["Reach level 25 and learn the call by heart — all of it, though hearts were not built to hold it.","Sing the response alone in an empty cathedral until the emptiness sings the verse back.","Speak one eroding truth to a tyrant and watch a certainty leave his eyes forever.","Give up the memory of your own singing voice. What replaces it is not yours, and it is better."]},{"id":"warlock.t4a","name":"Censor of Dis","tier":4,"level":40,"parent":"warlock.t3a","role":"Elite controller — ability deletion and dispels","lore":"A handful of binders have entered the Iron Archive where hell's living contracts hang like carcasses, and left with editorial authority. Censors strike clauses from documents that scream. Archdevils reroute wars around their signatures. Each carries a stylus of accounting-iron that never runs dry, because the ink is drawn from the margin of their own pact.","playstyle":"Elite control; delete one enemy ability per battle by redaction, void enchantment fields, and rewrite ongoing effects as amendments favoring your side.","abilities":[{"name":"Iron Ink","desc":"Draws a line of iron ink through one enemy ability, deleting it for the remainder of the encounter."},{"name":"Null and Void","desc":"Voids all enchantments, blessings, and contracts in an area — including, briefly and dangerously, your own."},{"name":"Amendment","desc":"Rewrites an ongoing effect on the field, changing its beneficiary to a target of your choosing."},{"name":"Archive Key","desc":"Summons a door of the Iron Archive; allies who pass through emerge with one cooldown refreshed."}],"progressionSteps":["Reach level 40 and enter the Iron Archive of Dis — by writ, by breach, or by being subpoenaed and refusing to leave.","Strike a single clause from a living contract, and survive the archdevil whose power that clause was.","Redact your patron's claim on one hour of your future. Spend it however you like; you have earned exactly one.","Leave the Archive with ink on your hands that the pit cannot account for."]},{"id":"warlock.t4b","name":"Pyre Executor","tier":4,"level":40,"parent":"warlock.t3b","role":"Elite executioner — delayed dooms and executes","lore":"Executors preside over the estates of the damned: soul-holdings so vast the pit cannot burn them without procedure. They build nine-tiered pyres, hear final appeals, and enforce rulings even hell contests. Their arrival is a formality in the worst sense — the sentence was passed the moment they were sent, and the fire is paperwork.","playstyle":"Elite executioner; place delayed maturity dooms, burn crowds of lesser enemies in procedural pyres, and execute any target that falls below the debt threshold.","abilities":[{"name":"Maturity Date","desc":"Stamps a doom that falls due in three turns, dealing damage equal to everything the target did meanwhile."},{"name":"Writ of Execution","desc":"Instantly executes a target below one-quarter health; the estate's remaining souls transfer to your debt meter."},{"name":"Procedural Pyre","desc":"Erects a nine-tiered pyre zone; lesser enemies inside burn in strict order of their outstanding balance."},{"name":"Ash Settlement","desc":"Converts a defeated enemy into ash payment, healing allies and issuing each a receipt of minor warding."}],"progressionSteps":["Reach level 40 and accept appointment as executor over an estate of ten thousand damned souls.","Preside over a default the pit itself contests. Rule against the pit. Enforce the ruling.","Build the procedural pyre with your own hands: nine tiers, one for each circle owed.","Execute a writ against a hell-prince's own collateral. Deliver ash, and a receipt."]},{"id":"warlock.t4c","name":"Axiombreaker","tier":4,"level":40,"parent":"warlock.t3c","role":"Elite warper — rule suspension and counterspells","lore":"Each Axiombreaker has published one disproof: a demonstrated contradiction in the world's founding geometry. Parallel lines that met. A whole smaller than its part. The wizard colleges burn their treatises on sight and cannot say why the ash falls upward. Reality treats an Axiombreaker as errata — annoying, footnoted, and irremovably true.","playstyle":"Rule-breaker; suspend one battlefield law at a time — gravity, distance, sequence — counterspell by contradiction, and crush enemies between lines made to meet.","abilities":[{"name":"Postulate Zero","desc":"Suspends one physical law in an area — gravity, momentum, or distance — for two turns; you are exempt."},{"name":"Reductio","desc":"Extends an enemy's power to its absurd conclusion, converting its strongest buff into an equivalent penalty."},{"name":"Parallel Made to Meet","desc":"Draws two converging lines through the battlefield; everything caught between is crushed at the meeting point."},{"name":"Disproof","desc":"Counterspell by contradiction: the interrupted spell resolves as though it had never been possible, refunding nothing."}],"progressionSteps":["Reach level 40 and choose one axiom the world rests on. Study it until you find where it lies.","Publish the disproof by demonstration: make two parallel lines meet, and stand where they cross.","Survive the correction, when the world sends its geometry to argue.","Refuse the colleges when they come to burn your proof. Let them measure your shadow and find it disagreeing."]},{"id":"warlock.t4d","name":"Cantor of Erasure","tier":4,"level":40,"parent":"warlock.t3d","role":"Elite debuffer — silence zones and action erasure","lore":"The full antiphon has verses no throat should carry, and Cantors carry them anyway, spaced with silences out of mercy. They trade languages for verses and remember each trade as a blank page. Kingdoms retain Cantors to unsay treaties, heresies, and on one occasion a war. What they erase does not become forgotten; it becomes never.","playstyle":"Elite debuffer; blanket zones in unsinging silence, erase an enemy's most recent action, and spread a rot that eats abilities out of their lexicon.","abilities":[{"name":"Threnody Gap","desc":"Blankets a zone in unsinging silence; spellcasting, commands, and battle-cries fail inside it."},{"name":"Unsung Verse","desc":"Erases the target's most recent action, undoing its effects and returning any cost paid as confusion."},{"name":"Lexicon Rot","desc":"Infects a target with spreading forgetting; each turn it loses one word, then the abilities those words held up."},{"name":"Rest Note","desc":"Holds one enemy inside a musical rest, removed from time until the measure ends or it is struck."}],"progressionSteps":["Reach level 40 and recover a verse of the antiphon from a monastery whose monks all died mid-sentence.","Sing it once, entire, to an audience of one condemned volunteer. Record what remains.","Learn the rest gap by gap, trading a language you speak for each. Keep your mother tongue for last.","Perform the Erasure Round beneath the patron's regard, and remain a someone when the song ends."]},{"id":"warlock.t5a","name":"Final Signatory","tier":5,"level":60,"parent":"warlock.t4a","role":"Mythic controller — battlefield-wide rule imposition","lore":"There is one seat at hell's every negotiation that is never offered and always filled. The Final Signatory holds more infernal paper in escrow than the Nine Courts combined, priced the peace between two warring hells, and keeps their own original pact framed, unpaid, and eternally in dispute. Archdevils schedule appointments. The Signatory does not keep them.","playstyle":"Mythic controller; impose battle-wide terms all combatants obey, escrow the strongest enemy out of the fight, and countersign allies' abilities to duplicate them.","abilities":[{"name":"Terms Absolute","desc":"Imposes battle-wide terms — no summoning, no healing, or no retreat — that every combatant, allies included, must obey."},{"name":"Escrow of Kings","desc":"Seals the strongest enemy in a neutral vault outside the fight until you release it or fall."},{"name":"Signature Required","desc":"Nothing enters or leaves the battlefield — reinforcements, teleports, fleeing souls — without your countersignature."},{"name":"The Disputed Original","desc":"Once per day, invoke your own unpaid pact to refuse a death; the dispute over who owns you continues."}],"progressionSteps":["Reach level 60 holding more infernal contracts in escrow than any devil holds mortal souls.","When the Nine Courts convene to void your holdings, attend uninvited. Table the master pact they thought was burned.","Countersign the peace between two warring hells, and price your signature so neither can ever afford war again.","Frame your own contract, unpaid and eternally disputed, in a hall where archdevils wait for appointments you do not keep."]},{"id":"warlock.t5b","name":"Ninth Flame","tier":5,"level":60,"parent":"warlock.t4b","role":"Mythic striker — scaling foreclosure damage","lore":"Eight flames of the pit burn tithes, tribute, and the routinely damned. The ninth burns collateral — the things debtors could not bear to lose — and it walks now in a borrowed body that was once a warlock. The hells list the Ninth Flame in their ledgers under assets. The entry has been corrected, in ash, to creditor.","playstyle":"Mythic striker; damage scales with everything the target values, interest doubles each round, and foreclosure claims defeated souls as fuel for city-burning flame.","abilities":[{"name":"Collateral Burn","desc":"Ignites what the target values most; damage scales with its buffs, minions, and remaining hope."},{"name":"Balance Due","desc":"A burn that doubles each round it goes unpaid; extinguishing it costs the target its strongest ability."},{"name":"Collect in Full","desc":"Executes a burning target and claims its soul as fuel, permanently increasing your flame by a fraction."},{"name":"Tithe of Cities","desc":"Once per siege, taxes an entire district in fire, sparing exactly those who owe you nothing."}],"progressionSteps":["Reach level 60 with the brand of every circle scarred over your heart, and let the eighth flame find you wanting nothing.","Walk into the furnace where defaulted worlds are burned. Do not come out. Become what comes out.","Burn a debt so old the pit had forgotten it was owed — and collect.","Let the hells open a ledger in your name. When they list you as an asset, correct the entry: creditor."]},{"id":"warlock.t5c","name":"The Unfolded","tier":5,"level":60,"parent":"warlock.t4c","role":"Mythic warper — extradimensional evasion and assassination","lore":"They stepped through their own proof and returned with directions no one else possesses. Seen from the east, a person; from an angle without a name, a corridor with weather. Cartographers who chart the Unfolded produce maps that chart the cartographer. Where they linger, rooms acquire extra insides, and locked doors become a matter of opinion.","playstyle":"Mythic evasion-warper; occupy surplus directions no attack can follow, tessellate into simultaneous selves, and kill from angles that do not exist yet.","abilities":[{"name":"Surplus Direction","desc":"Move along a direction only you possess; attacks, walls, and line-of-sight cannot follow the route."},{"name":"Tessellate","desc":"Unfolds into simultaneous selves tiling the battlefield; each acts once, then the pattern decides which was real."},{"name":"Perspective Kill","desc":"Strikes from an angle that does not exist at the target's location, ignoring armor, cover, and witnesses."},{"name":"Room With No Inside","desc":"Encloses enemies in a space that has an outside only; they exist nowhere until the geometry relents."}],"progressionSteps":["Reach level 60 and write the proof of yourself: every angle you contain, every direction you have earned.","Step through the proof.","Return by an angle that did not exist when you left. Bring back one impossible room, and live in it.","Allow the cartographers one glimpse. When their maps of you burn themselves, the folding is complete."]},{"id":"warlock.t5d","name":"The Unword","tier":5,"level":60,"parent":"warlock.t4d","role":"Mythic unmaker — existence-level debuffs","lore":"The antiphon is complete, and what finished it wears the singer lightly. The Unword is spoken of in careful synonyms, because languages near it keep losing their nouns. It no longer hears the patron's whisper; the whisper issues from it, patient and grammatical. Histories leave a blank page where its deeds should be. The page is accurate.","playstyle":"Mythic unmaker; silence precedes you, words fail around you, and the antiphon's final verse briefly removes an enemy from existence's page entirely.","abilities":[{"name":"First Silence","desc":"Radiates the silence that preceded language; enemy abilities with names cease to function within it."},{"name":"The Blank Page","desc":"Removes an enemy from the record for two turns; every effect it caused this battle is suspended with it."},{"name":"Antiphon Complete","desc":"Sings the final verse once per day; a chosen enemy is unwritten, leaving a gap that legends form around."},{"name":"Careful Synonym","desc":"Allies speak of you sideways and gain a ward; enemies who name you directly take psychic backlash."}],"progressionSteps":["Reach level 60 with the whole antiphon learned and every memory it cost already spent.","Sing the call and the response together, alone, in the place where the starless patch touches the sea.","Let the patron finish the verse through your mouth. What survives of you may keep the body.","Unspeak one word from every language at once. Choose mercy: make it a small word. They will still write legends around the gap."]}]},{"id":"cleric","name":"Cleric","archetype":"Spirit","icon":"🕯️","tagline":"A mortal lens for a divine and terrible light.","description":"A Cleric is what happens when a god needs hands. Sworn at a shrine, trained in scripture and field surgery, they carry a mace in one fist and a prayer in the other, learning that faith under pressure is a muscle, not a mood. Some become the god's wrath, some its open channel — and every miracle is entered in a ledger somebody must eventually pay.","nodes":[{"id":"cleric.t1","name":"Cleric","tier":1,"level":1,"parent":null,"role":"Hybrid support — mending and radiant reprisal","lore":"Every shrine keeps a ledger of novices: farm children who prayed and were answered, soldiers who bargained in a ditch and lived. The Cleric is the one who came back to pay. They learn scripture, surgery, and the weight of a mace, because a god's mercy travels through hands that work.","playstyle":"A midline hybrid: close wounds with short litanies, crack the profane with a blessed mace, and bank Favor from both to fuel the next answered prayer.","abilities":[{"name":"Litany of Binding","desc":"Chant a closing verse over an ally's wound; it restores health and stanches bleeding for as long as the verse holds."},{"name":"Censured Blow","desc":"Strike with a consecrated mace; against undead and the oath-broken, the impact flares for additional radiant damage."},{"name":"Vigil Ward","desc":"Raise a brief ward over an ally within reach, absorbing the next blow meant for them."},{"name":"Kindled Favor","desc":"Mending the faithful or striking the profane builds Favor; spend it to double the potency of your next prayer."}],"progressionSteps":["Keep the vigil-night in your god's shrine, dusk bell to dawn bell, awake and silent; if the candle gutters, begin again.","Learn the Eighty Small Prayers by rote, and the field-surgeon's knots besides — the god mends through hands that know their work.","Work your first answered prayer before witnesses — a fever broken, a wound closed — and have it entered in the shrine's ledger.","Carry a stranger's corpse through unquiet country to consecrated burial, and do not set it down."]},{"id":"cleric.t2a","name":"Warpriest","tier":2,"level":10,"parent":"cleric.t1","role":"Frontline smiter — melee pressure and battle-blessing","lore":"Some clerics learn the god answers loudest from inside a shield-wall. The Warpriest carries doctrine at mace-length: chrism on the haft, verses timed to the push of pike. Companies pay well for one and sleep better besides, for a Warpriest's blessing is applied like medicine — directly, and without asking.","playstyle":"Fight in the press. Anoint your weapon, bless comrades by the shoulder-clap, and convert every landed blow into wrath the whole line can spend.","abilities":[{"name":"Anointed Haft","desc":"Dress your mace with war-chrism; strikes deal radiant damage and mark the struck for your allies' next blows."},{"name":"Shoulder-Clap Blessing","desc":"Grip a comrade mid-fight to grant vigor and immunity to fear for six heartbeats."},{"name":"Wrathful Doxology","desc":"Roar a verse of judgment; enemies in earshot stagger while the faithful strike harder."},{"name":"Penitent's Toll","desc":"An overhead blow that rings like a struck bell, dazing the target and dragging its fury onto you."}],"progressionSteps":["Reach level 10, then stand your first shield-wall from horn to rout without letting the prayer break in your mouth.","Take up the mace of a fallen warpriest and carry it home to their shrine for reconsecration; earn the right to keep it.","Bless a company on the eve of battle, and be there, still standing, to bless what remains of it after.","Shatter something unholy with your own arms — an idol, a false relic, a fane — and bring a fragment back as proof."]},{"id":"cleric.t2b","name":"Vessel","tier":2,"level":10,"parent":"cleric.t1","role":"Backline conduit — healing and foresight","lore":"Most clerics ask; a Vessel opens. They stop shaping prayers and start hosting answers — mendings no surgeon can chart, dreams that arrive true, sentences in their mouths that belong to someone vast. The temples honor them carefully, the way one honors a door that does not fully close.","playstyle":"A fragile backline channel. Position first, then choose: pour the god into a dying ally, or into three seconds of foresight the enemy cannot afford.","abilities":[{"name":"Open Channel","desc":"Still yourself completely; your next miracle costs no Favor but takes double from your body instead."},{"name":"Mending Past Craft","desc":"Unmake an injury as though it never landed, restoring health beyond what surgery could explain."},{"name":"Three Seconds Hence","desc":"Glimpse the immediate future; one ally gains the dodge or parry you witnessed."},{"name":"Borrowed Tongue","desc":"Speak a sentence not your own; enemies who hear it falter, having learned something true about their deaths."}],"progressionSteps":["Reach level 10 and fast in the sanctuary until the first true vision arrives; write it down before you understand it.","Heal a wound no surgeon would touch, and accept without complaint the ache it leaves in your own body.","Deliver an unwelcome prophecy to someone powerful, word for word, softening nothing.","Let the god speak through you once at full voice, and be recognizably yourself the morning after."]},{"id":"cleric.t3a","name":"Judicar","tier":3,"level":25,"parent":"cleric.t2a","role":"Melee striker — single-target holy execution","lore":"The crusade needs judges more than it admits. A Judicar reads the charges aloud before the blow falls — apostate priests, false saints, commanders who consecrated what they should have burned. They are licensed to sentence the anointed, which is why bishops greet them warmly and count the silver afterward.","playstyle":"Build a case in combat: name crimes to stack the judgment mark, deny escape and succor, then deliver a verdict that scales with everything proven.","abilities":[{"name":"Read the Charges","desc":"Name the target's offenses aloud; each charge deepens their judgment mark and amplifies your eventual verdict."},{"name":"Verdict","desc":"A two-handed sentence of a blow; damage rises with accumulated charges and the target's missing health."},{"name":"No Sanctuary","desc":"While your eyes hold them, the marked cannot be healed, hidden, or spirited away."},{"name":"Iron Contrition","desc":"Executing a marked sinner remits your own wounds, restoring health for every charge proven."}],"progressionSteps":["Reach level 25 and sit the Assize of Embers: recite the crimes of ten heresiarchs from memory, and the lawful sentence for each.","Carry out a sealed sentence against one of your own order, alone, and return the seal unbroken.","Refuse a bribe worth more than your life, and enter the offer, with names, into the record.","Hear the full confession of the one you were sent to kill, and proceed unless the god stays your hand."]},{"id":"cleric.t3b","name":"Consecrant","tier":3,"level":25,"parent":"cleric.t2a","role":"Frontline support — consecrated ground and warband blessing","lore":"Where a Consecrant walks, the earth is sworn in. They hallow trenches into naves, turn a shield-wall's footing into church floor, and plant standards the dead cannot pass. Siege captains requisition them like ordnance, and old soldiers polish their boots before crossing ground a Consecrant has claimed.","playstyle":"Claim ground and make it argue for you: plant standards, chain blessings down the line, and let trespassers ring the unseen bell.","abilities":[{"name":"Hallowing Stride","desc":"Ground you cross stays consecrated for a time; allies standing on it resist fear and bleed slower."},{"name":"Planted Standard","desc":"Drive a blessed standard into the earth; nearby allies gain armor and the dead cannot rise in its shadow."},{"name":"Rite of the Unbroken Line","desc":"Chain a blessing through adjacent allies; while the line holds, damage is shared and none can be routed."},{"name":"Trespass Bell","desc":"Unhallowed creatures entering your ground ring a bell only you hear, taking radiant damage and standing revealed."}],"progressionSteps":["Reach level 25 and reconsecrate a ruined chapel alone, threshold-stone to roof-beam, over forty days of unbroken rite.","Hold one piece of hallowed ground against desecration until relieved, however long relief takes to come.","Bury the dead of both armies after a battle, and hallow the field so thoroughly that neither side rises.","Learn the boundary-rites of three orders not your own, well enough to say where each of them errs."]},{"id":"cleric.t3c","name":"Lazarene","tier":3,"level":25,"parent":"cleric.t2b","role":"Dedicated healer — triage, transference, and revival","lore":"Named for the first one raised, Lazarenes work where medicine surrenders: plague-houses, drowned villages, the third day after a battle. Their miracles keep a ledger — every returned breath is owed, and they know precisely what a life costs. It makes them gentle, exact, and difficult to sit beside at supper.","playstyle":"A ledger-keeping healer. Stay deaths rather than prevent all damage, take wounds into your own flesh, and spend banked breath on saves medicine cannot copy.","abilities":[{"name":"Ledger of Breath","desc":"Every life you save is entered; spend entries to fuel miracles beyond medicine's reach."},{"name":"Stay the Hour","desc":"An ally struck down does not die for ten heartbeats; what you do with them is yours."},{"name":"Take the Wound","desc":"Draw an ally's injury into your own flesh at half its weight; both of you keep the scar."},{"name":"Second Breath","desc":"Call a soul back across the threshold within a candle's burning; it returns owing, and so do you."}],"progressionSteps":["Reach level 25 and serve a full plague-season in a lazar-house, leaving only when the last bell stops ringing.","Bring back someone gone past all argument, and pay what it costs without haggling.","Sit deathwatch for a stranger from first rattle to last stillness, and learn what dying asks of the living.","Keep your ledger honest: record every life you lost as carefully as every life you kept."]},{"id":"cleric.t3d","name":"Godspeaker","tier":3,"level":25,"parent":"cleric.t2b","role":"Control support — foresight and spoken fate","lore":"The visions come whether or not a Godspeaker asks. Kings keep them close and never comfortable; generals hear how battles end before the first arrow and hate them for it. The god does not soften anything, and neither, by vow, may they — clarity is the whole office.","playstyle":"Fight from prophecy: call enemy actions to cancel them, hand allies the first strike against what you foresaw, and pay the toll for every silence.","abilities":[{"name":"It Was Written","desc":"Declare an enemy's next action aloud; if it comes to pass, it fails, having been foretold."},{"name":"Thread of Hours","desc":"Glimpse the fight's coming moments; allies you warn strike first against what you saw."},{"name":"Unwelcome Truth","desc":"Tell an enemy how it dies; it fights the rest of the battle knowing."},{"name":"Prophet's Toll","desc":"Each prophecy spoken this battle sharpens the next; each withheld bleeds you slowly."}],"progressionSteps":["Reach level 25 and endure the Long Seeing: nine days blindfolded in the crypt while the visions run their course.","Prophesy in public, be laughed at, and say nothing at all when it comes true.","Carry a doom to a village that cannot be saved, and stay to help them meet it.","Refuse, once, to look — and learn what the god does with a closed eye."]},{"id":"cleric.t4a","name":"Absolver","tier":4,"level":40,"parent":"cleric.t3a","role":"Elite executioner — burst elimination of the condemned","lore":"When excommunication fails, the church sends its last argument. Absolvers hold that a clean death under the rite cleanses what a whole life could not, and they deliver it personally. Few are named, fewer seen twice; towns remember their visits the way coastlines remember storms — by what is missing.","playstyle":"Hunt one target through anything. The rite makes you unstoppable while a sentence stands open; finish it clean, carry the sins, move on.","abilities":[{"name":"Rite of Absolution","desc":"Open the rite over a condemned target; until it closes, you cannot be slowed, silenced, or turned aside."},{"name":"The Clean Death","desc":"A sanctified killing blow that cannot be survived below a quarter health; the slain cannot rise or be raised."},{"name":"Bear the Weight","desc":"Carry the target's unabsolved sins as temporary strength; carry too many at once and they begin to whisper."},{"name":"Sealed Verdict","desc":"Nothing enters or leaves a small circle around you and the condemned until one of you is finished."}],"progressionSteps":["Reach level 40, then answer a summons that arrives with no sender, and survive the year of testing it begins.","Execute a sentence you privately believe is wrong, or refuse it before the conclave; the order keeps both kinds of scar.","Grant the full rite to someone who wronged you personally, and mean every word of it.","Surrender your birth name and enter the rolls under the name of your first condemned."]},{"id":"cleric.t4b","name":"Hierophant of the Breach","tier":4,"level":40,"parent":"cleric.t3b","role":"Anchor support — unbreakable zone control","lore":"When a wall fails, the order sends a wall. Hierophants of the Breach stand where masonry died and make the gap holier than the gate was; siege commanders request them like ordnance and record them like weather. In the annals, every breach they held is rewritten as a gate.","playstyle":"Plant yourself at the worst chokepoint and deepen. The longer you hold, the harder your ground argues; movement is a last resort, almost a heresy.","abilities":[{"name":"The Ground Remembers","desc":"Your consecration deepens each minute held, stacking armor, warding, and dread for anything unhallowed that trespasses."},{"name":"Gate That Held","desc":"Declare a breach a gate; allies passing through it mend, enemies passing through it burn."},{"name":"Unceasing Vigil","desc":"While you have not moved this battle, your blessings cost nothing and cannot be dispelled."},{"name":"Censer Wall","desc":"Swing the great censer in a slow arc; its smoke hangs as a wall the profane cannot cross."}],"progressionSteps":["Reach level 40 and hold a breach through a full assault, until the enemy sounds withdrawal or the wall is remade behind you.","Complete the forty-verse hallowing under bombardment without dropping a syllable.","Refuse a lawful order to retreat, and be proven right by dawn.","Carry a broken company's standard back through the breach where it died, and hallow the ground where you plant it."]},{"id":"cleric.t4c","name":"Threshold Warden","tier":4,"level":40,"parent":"cleric.t3c","role":"Elite healer — death denial and soul retrieval","lore":"They stand at the door the dying use and negotiate there, lawfully, in person. A Warden can hold the door shut against a massacre or walk through it to fetch someone back — but they may also shake their head, and no verdict in the world is quieter or more final.","playstyle":"Anchor the edge of a fight and intercept deaths as they happen. Your exhaustion is the true resource; refusal is a weapon you rarely draw.","abilities":[{"name":"Hold the Door","desc":"No ally in your sight dies while you keep your feet; every prevented death exhausts you further."},{"name":"Walk the Soul Back","desc":"Cross after a soul dead less than a day and lead it home, paying the toll yourself."},{"name":"Denied the Door","desc":"Deny an enemy the door; it cannot die, and carries its wounds screaming until you release it."},{"name":"Quiet Crossing","desc":"Grant a peaceful crossing to the suffering; against the undying, this counts as destruction."}],"progressionSteps":["Reach level 40, then die once, briefly, under the order's supervision, and return with the door's location fixed in memory.","Refuse to bring back a soul the whole world wanted returned, and carry the grieving's anger without defending yourself.","Sit the threshold through a massacre's aftermath, sorting the crossing from the called-back, until every soul is accounted.","Learn the far side of the door well enough to find your way blind, and never once speak of it."]},{"id":"cleric.t4d","name":"Anathemist","tier":4,"level":40,"parent":"cleric.t3d","role":"Dread controller — binding curses and pronounced dooms","lore":"A Godspeaker repeats what the god says; an Anathemist is trusted with the god's no. Their pronouncements bind — crops, bloodlines, city gates. Courts fall silent when one stands, because an anathema, once spoken, cannot be argued with, only served. Most write their dooms rather than risk saying them.","playstyle":"Weaponized prophecy: lay dooms that ripen over the fight, silence what the god has cursed, and
