uild your construct under arrow-fall, before you see to the wound in your arm."]},{"id":"artificer.t2b","name":"Volatile Chymist","tier":2,"level":10,"parent":"artificer.t1","role":"Ranged blaster — area denial","lore":"Volatile Chymists treat the word unstable as a schedule rather than a warning. They brew ordnance the guild refuses to store indoors, sip their own prototypes to save time, and keep meticulous journals so that whoever inherits the laboratory knows exactly which shelf killed them.","playstyle":"Area control through thrown chemistry: soften formations with corrosive clouds, spike damage with timed charges, and gamble on prototype elixirs when the arithmetic turns against you.","abilities":[{"name":"Unstable Batch","desc":"Your bombs each carry a random secondary element; you learn which one as it detonates."},{"name":"Acrid Veil","desc":"Shatter a flask into lingering vapor that corrodes armor, eating one point of protection each round."},{"name":"Test Subject One","desc":"Drink an unlabeled prototype: gain a strong random benefit and a documented, inconvenient side effect."},{"name":"Fused Charge","desc":"Place a charge with a timer of your choosing; its yield grows for every round it waits."}],"progressionSteps":["Reach level 10 and stabilize a compound your instructors called unstabilizable. Then stabilize it a second time, in front of them.","Lose your eyebrows to a batch you were certain of, and write down the ratio anyway.","Demolish a target of the guild's choosing with exactly the yield you quoted — no more, and no apology."]},{"id":"artificer.t3a","name":"Ironshepherd","tier":3,"level":25,"parent":"artificer.t2a","role":"Pet commander — sustained two-body pressure","lore":"An Ironshepherd builds one construct and stakes a lifetime on it. The machine is rebuilt after every battle until nothing original remains except the name, which is the part the shepherd actually maintains. Armies pay for the pair together; no offer has ever bought them separately.","playstyle":"Two-body play: the construct holds the line and takes the wounds while you direct, repair, and strike into the openings it creates.","abilities":[{"name":"The Naming","desc":"Bond permanently with one construct; it gains a growth track, keeps its memories, and obeys no other voice."},{"name":"Shepherd's Whistle","desc":"Command your construct to intercept any attack aimed at an ally within its stride."},{"name":"Graze on Ruin","desc":"Your construct consumes battlefield scrap to repair itself mid-combat, healing more amid greater wreckage."},{"name":"Iron Bellow","desc":"Your construct roars from its furnace core, forcing nearby enemies to attack it for two rounds."}],"progressionSteps":["Reach level 25 and rebuild your construct so many times that none of the first metal remains, and it still answers its name.","Refuse the coin offered for it. Refuse the second, larger offer without pausing.","Sleep beside it for a season, until you know every sound it makes when something is wrong.","Let it take a blow meant for you, and repair it before you bind your own wound."]},{"id":"artificer.t3b","name":"Plateheart","tier":3,"level":25,"parent":"artificer.t2a","role":"Armored bruiser — frontline attrition","lore":"Platehearts stop distinguishing between armor and anatomy. Plates are bolted to bone, a fabricated mind rides the harness, and the boiler in the chest is not a metaphor. Shield-walls part to let them plug a breach, and comrades learn to stand clear when the steam vents.","playstyle":"Frontline attrition: wade in slowly, let the grafted armor learn each attacker, and win exchanges that would kill anything still made only of meat.","abilities":[{"name":"Graft Protocol","desc":"Bolt plating directly to bone: permanent armor that cannot be removed, disarmed, or stolen, only earned."},{"name":"Second Opinion","desc":"The armor's mind acts when yours cannot, parrying and stepping for you while you are stunned, sleeping, or afraid."},{"name":"Boiler Vent","desc":"Release chest-furnace steam in a scalding burst, driving melee attackers back and searing the persistent."},{"name":"Deadbolt Stance","desc":"Lock your frame: you cannot move or be moved, and attacks against adjacent allies redirect to you."}],"progressionSteps":["Reach level 25 and bolt the first plate to living bone. Do not cry out; the armor is listening.","Lend the harness-mind a portion of your memories, and forgive what it chooses to do with them.","Stand in a breach where flesh alone breaks, and hold until the wall is rebuilt behind you."]},{"id":"artificer.t3c","name":"Petardier","tier":3,"level":25,"parent":"artificer.t2b","role":"Siege artillery — long-range timed burst","lore":"Petardiers are siegecraft distilled into a single walking profession. They carry shaped charges up killing grounds, count fuses aloud while arrows fall, and are famous for dying in exactly the manner their title suggests. The ones who live become the reason fortress architects drink.","playstyle":"Patient long-range devastation: mark targets, set staggered timers, and stack yields so that one exact moment does the work of a battery of trebuchets.","abilities":[{"name":"Breaching Charge","desc":"A shaped blast that ignores cover, walls, and shields, delivering its full yield to whatever hid behind them."},{"name":"Ranging Shot","desc":"Your first shell marks the impact zone; every later shell landing there strikes true automatically."},{"name":"Fuse Discipline","desc":"Set timers exact to the second; each round a charge waits adds another die of yield."},{"name":"Powder Ledger","desc":"Account for every grain: once per battle, combine all remaining charges into one consolidated detonation."}],"progressionSteps":["Reach level 25 and bring down a fortress gate with a charge you carried up the killing ground on your own back.","Count a fuse aloud under arrow-fall and be right. Do this until the sappers stop checking your math.","Walk away from a detonation without turning to watch, because doubt is a thing you no longer carry."]},{"id":"artificer.t3d","name":"Crucible-Drinker","tier":3,"level":25,"parent":"artificer.t2b","role":"Mutagenic skirmisher — adaptive melee alchemy","lore":"Crucible-Drinkers ran out of test subjects and volunteered. Each draught rewrites something — marrow, hide, the shape of their hands — and each dawn they catalogue what remains of the original. Guilds list them as equipment rather than members, which the Drinkers find flattering.","playstyle":"Adaptive melee alchemy: drink into the fight you are facing, growing claws, plating, or gills as needed, and outlast whatever cannot adapt back.","abilities":[{"name":"Mutagenic Draught","desc":"Drink to grow the tool you need — claws, dermal plate, gills — lasting until you drink otherwise."},{"name":"Purge Sweat","desc":"Expel accumulated toxins through the skin as a caustic mist that sears everything adjacent."},{"name":"Adaptive Marrow","desc":"Your bones learn: gain resistance to the last damage type that hurt you until something new does."},{"name":"Tolerance","desc":"You are permanently immune to your own compounds, which is more useful than outsiders assume."}],"progressionSteps":["Reach level 25 and drink a mutagen distilled from your own blood. Survive what it teaches your body about itself.","Catalogue every change at the mirror each dawn, until the catalogue's author is someone you used to be.","Hear a physician pronounce you an abomination, and correct only the terminology."]},{"id":"artificer.t4a","name":"Engine-Sire","tier":4,"level":40,"parent":"artificer.t3a","role":"Multi-summoner — battlefield overwhelm","lore":"An Engine-Sire's constructs build constructs. The craft has passed from hand to iron and from iron to iron again, and the foundry now marches under its own power with its maker walking at its head. Kingdoms describe an approaching Engine-Sire the way coastal towns describe weather.","playstyle":"Overwhelming numbers with inherited discipline: field a family of constructs that share what each has learned, and replace losses faster than the enemy replaces courage.","abilities":[{"name":"Progeny Line","desc":"Field multiple constructs drawing on a single pool of learned behaviors; what one masters, all inherit."},{"name":"Inheritance Protocol","desc":"When a construct falls, its memory core migrates to the nearest kin, carrying its buffs and its grudges."},{"name":"Marching Foundry","desc":"Your workshop walks to war as a siege platform, assembling replacement frames mid-battle."},{"name":"Sire's Decree","desc":"Speak one word; every construct you have ever built within earshot obeys it before any other order."}],"progressionSteps":["Reach level 40 and forge a construct using your first as forge-hand, so the craft passes from your iron to its own.","March your foundry to a war it can end, and end it before the season turns.","Bury a frame that fell for you with full rites, and stand while the others grieve in gear-clatter."]},{"id":"artificer.t4b","name":"Interred Engine","tier":4,"level":40,"parent":"artificer.t3b","role":"Unkillable anchor — damage absorption","lore":"The Interred sealed the final seam years ago. Food, air, and sleep are administrative problems the armor has solved; the flesh inside is a rumor even to its owner. Fortresses request an Interred Engine by name when a gate must hold against something that should not exist.","playstyle":"Immovable anchor play: occupy the one span of ground that matters, shrug off attrition that breaks sieges, and grow harder as the damage accumulates.","abilities":[{"name":"Final Seam","desc":"You cannot be extracted from your armor, and neither can fear, poison, drowning, or age reach inside."},{"name":"Ossified Servos","desc":"Below half health your plating fuses harder, and your damage reduction climbs as the damage accumulates."},{"name":"Grave Pressure","desc":"Your tread slows enemies in a radius, as if the ground itself had grown heavier."},{"name":"Sepulcher Frame","desc":"Once per day, entomb yourself in place: immune to all damage for a round while allies rally behind you."}],"progressionSteps":["Reach level 40 and seal the final seam. There is no removing the armor now; there is no you without it.","Endure a winter siege without food, air, or sleep, and decline to say which of you kept the watch.","Let a priest declare you dead, then enter the chapel and pay the funeral fee yourself."]},{"id":"artificer.t4c","name":"Cataclysmith","tier":4,"level":40,"parent":"artificer.t3c","role":"Nuker — scheduled massive detonations","lore":"Cataclysmiths hold the doctrine that any structure is a demolition site awaiting scheduling. War-colleges teach their fuse arithmetic; treaties name them individually. Each carries one sealed schematic — a yield they pray never to build — because a Cataclysmith without a worst case has simply not finished calculating.","playstyle":"Setup-heavy nuking: spend turns in calculation and placement, then end the engagement, the fortification, and occasionally the local geography in a single scheduled instant.","abilities":[{"name":"City-Killer Shell","desc":"Spend three rounds in assembly to fire ordnance that removes a structure from the battle and the map."},{"name":"Synchronized Ruin","desc":"Detonate up to five placed charges in exact sequence, walking a line of blasts across the field."},{"name":"Overpressure","desc":"Your detonations knock prone, deafen, and strip reactions from everything in the outer radius."},{"name":"The Sealed Schematic","desc":"Once in your life, unseal your worst calculation and build it; there is no second use, and no second fortress."}],"progressionSteps":["Reach level 40 and erase a fortification so completely that cartographers dispute whether it was ever built.","Draft the yield you pray never to use, seal the schematic, and tell no one where it sleeps.","Lecture a war-college on fuse doctrine, and watch the generals go quiet when you begin to count."]},{"id":"artificer.t4d","name":"Panacea Heretic","tier":4,"level":40,"parent":"artificer.t3d","role":"Hybrid sustain — mutation and transfusion","lore":"Panacea Heretics cured what the temples called incurable and were excommunicated for the paperwork. Their bodies are running experiments — grafted limbs, borrowed lives, blood that heals whomever it touches with interesting side effects. The desperate seek them out; conclaves burn their formularies and quietly keep copies.","playstyle":"Hybrid sustain and mutation: transfuse allies, bloom chimeric limbs for burst, and treat your own health as a flexible reagent.","abilities":[{"name":"Forbidden Formulary","desc":"Brew elixirs the conclaves banned: borrowed lives, stolen years, and cures that outrage theology by working."},{"name":"Chimeric Bloom","desc":"Grow a grafted limb for one minute, gaining an additional attack or an additional pair of working hands."},{"name":"Transfusion","desc":"Pump your mutagenic blood into a dying ally, healing them fully and gifting them one random adaptation."},{"name":"Excommunicate's Poise","desc":"Curses, hexes, and consecrated ground no longer affect you; the church revoked its jurisdiction over your body."}],"progressionSteps":["Reach level 40 and cure a plague the temples had already assigned to the will of the gods. Distribute the formula anyway.","Graft your first chimeric limb with your own steady hands, awake through every stitch of the surgery.","Stand trial before the conclave and leave excommunicated, with your formulary intact and your patients living."]},{"id":"artificer.t5a","name":"Thousandth Hand","tier":5,"level":60,"parent":"artificer.t4a","role":"Army commander — total board control","lore":"Histories disagree on whether the Thousandth Hand is a person, an order, or an event. The truth is simpler and worse: a single will distributed through every frame it ever built, working in ten cities at once. Workshops wake when it passes. Nothing it has made has ever been truly destroyed.","playstyle":"Total board presence: act through any construct on the field, raise the fallen ones into new frames, and make attrition a nonsense concept.","abilities":[{"name":"Distributed Will","desc":"Your consciousness rides any construct you have built within a mile, acting through it as yourself."},{"name":"Wake the Workshops","desc":"Every dormant machine in the region rises and reports for assignment when you pass."},{"name":"No Single Death","desc":"If your body falls, your will migrates to the strongest surviving frame; you have not died, merely relocated."},{"name":"Hands Beyond Counting","desc":"Once per day, summon every construct bearing your maker's mark to a single battlefield."}],"progressionSteps":["Reach level 60 and pour your will into a thousand frames, until no single hammer in the world can find you.","Let your body sleep a full year while your hands keep building in ten cities.","Be referred to in the plural by frightened kings, and answer in the singular."]},{"id":"artificer.t5b","name":"Brazen Saint","tier":5,"level":60,"parent":"artificer.t4b","role":"Immortal bulwark — zone supremacy","lore":"A Brazen Saint outlasted its own flesh and never abandoned the post. It has guarded one gate so long that the clergy added it to the litanies and pilgrims oil its feet. What remains inside the shell is debated; whether the gate has ever fallen is not.","playstyle":"Zone supremacy: consecrate the ground you hold, armor the allies who share it, and continue fighting for a time even past your own death.","abilities":[{"name":"Canon of Brass","desc":"The ground you guard becomes consecrated to endurance; allies standing on it gain your plating's resistances."},{"name":"Vigil Past Death","desc":"At zero health you keep fighting for ten rounds; what happens after the tenth has never been observed."},{"name":"Pilgrim's Offering","desc":"Oil, prayers, and relics left at your feet convert directly into repair and warding."},{"name":"Litany Tread","desc":"Your step tolls like a bell; enemies who hear three tolls fight at disadvantage against you."}],"progressionSteps":["Reach level 60 and outlast the flesh entirely. When the last of you is brass, keep the vigil anyway.","Guard one gate for a generation, until pilgrims oil your feet and children swear oaths on your shadow.","Hear the clergy enter you into the litany of saints, and do not correct them."]},{"id":"artificer.t5c","name":"Appointed Sun","tier":5,"level":60,"parent":"artificer.t4c","role":"Apocalypse burst — one perfect strike","lore":"The Appointed Sun announces its detonations in advance — sometimes by a year — and has never once been early, late, or stopped. Kings evacuate on its word alone. Historians divide certain wars into before and after an hour it chose, and the craters it left have names of their own.","playstyle":"One perfect strike: telegraph an apocalypse, defend the countdown, and deliver a detonation that is less an attack than a calendar date.","abilities":[{"name":"The Announcement","desc":"Declare a detonation up to a year ahead; it cannot be defused, delayed, or hurried, including by you."},{"name":"Solar Yield","desc":"The declared blast detonates with the light and heat of a risen sun, exactly on schedule."},{"name":"Perfect Fuse","desc":"No charge of yours ever misfires, cooks off, or errs by even a second."},{"name":"Afterglow","desc":"Your craters remain hostile ground for a generation; enemies inside them burn, and allies do not."}],"progressionSteps":["Reach level 60 and announce a detonation a year in advance. Let kings evacuate. Fire it to the second.","Split the mountain armies broke against for a century, and end the war before its next winter.","Become the deadline. When historians write of the hour, ensure they mean you."]},{"id":"artificer.t5d","name":"Azoth Incarnate","tier":5,"level":60,"parent":"artificer.t4d","role":"Protean engine — every role, briefly","lore":"The Azoth Incarnate solved alchemy's oldest problem by becoming the solution. Its body is first matter — every mutation it ever survived, wearable as a shape, holdable in a hand. It dissolves curses as demonstrations of principle and leaves drops of itself in sealed vials, each of which is also entirely it.","playstyle":"Protean shapeshifting: flow between every form the line has learned, dissolve whatever binds, and answer each threat with the specific body that beats it.","abilities":[{"name":"Universal Solvent","desc":"Your touch dissolves bindings — chains, wards, curses, contracts — reducing them to inert first matter."},{"name":"Prima Materia","desc":"Shift instantly between every mutation you have ever survived, wearing each body like a decanted shape."},{"name":"Transmute Wound","desc":"Convert incoming damage into a reagent pool, then spend it as healing, elixirs, or acid."},{"name":"The Divided Vial","desc":"Seal a drop of yourself in a vial; if your body is destroyed, you reconstitute from the drop, entire."}],"progressionSteps":["Reach level 60 and complete the final distillation: reduce yourself to first matter, then reconstitute by will alone.","Dissolve a curse set by a god, in public, as a demonstration of principle.","Seal one drop of yourself in a vial for your successors, knowing the drop is also entirely you."]}]},{"id":"spellblade","name":"Spellblade","archetype":"Esoteric","icon":"🔮","tagline":"Spell and steel, sworn into a single edge.","description":"Every generation, a few students fail correctly: too restless for the towers' silence, too curious for the drill-yard's rote. The Spellblade is what becomes of them, a heretic discipline that scribes casting into swordwork until neither can be separated. Both traditions disown the art; both quietly hire it. To take up this path is to belong nowhere, and to be needed everywhere.","nodes":[{"id":"spellblade.t1","name":"Spellblade","tier":1,"level":1,"parent":null,"role":"Hybrid melee caster — versatile skirmisher","lore":"Expelled apprentices, drummed-out soldiers, hedge-duelists who taught themselves to cast between parries. The Spellblade begins as a rumor in both worlds: the swordsman who should not know that word, the student who should not hold a blade that well. No guild certifies them. Their credential is the survivors' account of what they did.","playstyle":"Alternate cantrip and cut in a single rhythm; spend spell-charge to empower strikes, spend momentum to shorten casts. Weakest when forced to speak only one language.","abilities":[{"name":"Bladecant","desc":"Weave a minor spell into a sword form; the strike deals bonus arcane damage and refunds part of the cast's cost."},{"name":"Quicksilver Guard","desc":"Parry with the inlaid edge to convert a blocked blow into one charge of stored spellforce."},{"name":"Twin Grammar","desc":"Casting after a melee hit halves the spell's cast time; striking after a spell adds arcane damage to the blow."},{"name":"Sidestep Sigil","desc":"Blink a short distance along a line you walked this turn, leaving a fading rune where you stood."}],"progressionSteps":["Be refused twice: once by a tower that called your swordplay vulgar, once by a barracks that called your questions dangerous.","Steal, copy, or beg a single cantrip, and learn to speak it with a blade in your hand.","Survive a duel against a real swordsman and a real mage in the same season.","Scribe your first sigil into steel without cracking the blade, and keep what the failure cost you."]},{"id":"spellblade.t2a","name":"Runefencer","tier":2,"level":10,"parent":"spellblade.t1","role":"Melee duelist — anti-caster pressure","lore":"Runefencers treat a hostile spell as one more blade to be read and answered. They scribe sigils along the fuller mid-swing, letting each pass rewrite the edge's purpose. Court mages hire them as seconds in arcane duels; the same mages cross the street when a Runefencer walks by uncontracted.","playstyle":"Aggressive single-combat tempo: bait a cast, parry the spell itself, and punish through the gap. Rewrite the blade's rune between exchanges to match the opponent.","abilities":[{"name":"Parse the Weave","desc":"Read an enemy's casting to learn the spell's school; your next parry against that school cannot fail."},{"name":"Riposte in Kind","desc":"Cut an incoming spell apart; a fragment of it returns along your counterthrust as arcane damage."},{"name":"Wetscribe Edge","desc":"Mid-swing, inscribe a fresh rune into the blade, changing its damage type before the blow lands."},{"name":"Second Tongue","desc":"While in single combat, your counterspells cost stamina instead of mana."}],"progressionSteps":["Reach level 10 and defeat a licensed duelist of either tradition using only what neither taught you.","Parry a living spell with bare steel and stay standing; the scar along the fuller is your certificate.","Learn to scribe a rune in the time a swing takes — first on parchment at a run, then on iron in the rain.","Stand as second in a mage's duel and be accepted, once by the challenger and once by the accused."]},{"id":"spellblade.t2b","name":"Wardsworn","tier":2,"level":10,"parent":"spellblade.t1","role":"Arcane defender — zone control, retaliation","lore":"Where Runefencers duel, the Wardsworn dig in. They layer spell-armor like laminate steel and let the wards do the answering, standing where mage-craft meets the shield-wall. Garrison captains request them by name for breach duty; abbots request them for vigils no one explains. Both pay in advance.","playstyle":"Deliberate and immovable: stack wards before contact, anchor a zone, and let attackers spend themselves against retaliation. Wins by making ground too expensive to take.","abilities":[{"name":"Laminate Aegis","desc":"Maintain up to three concentric wards; each layer broken detonates outward, staggering adjacent attackers."},{"name":"Oath of Standing","desc":"While you have not moved this round, allies behind you take reduced damage and cannot be forcibly displaced."},{"name":"Tollgate","desc":"Inscribe a threshold on the ground; enemies crossing it are slowed and marked for your retaliation."},{"name":"Answering Ward","desc":"When a ward absorbs a blow, store its force; release it as an arc of returned violence on your next strike."}],"progressionSteps":["Reach level 10 and hold a doorway against a siege drill until the instructors, not you, call the halt.","Wear your first spell-armor for a full month; sleep in it, and learn what the wards whisper when they fail.","Take a blow meant for a stranger and let the ward, not the flesh, answer it.","Swear the Standing Oath before witnesses from both traditions, neither of whom will thank you."]},{"id":"spellblade.t3a","name":"Nullblade","tier":3,"level":25,"parent":"spellblade.t2a","role":"Anti-mage hunter — spell denial","lore":"The Nullblade found the seam in the Runefencer's art: every weave, however grand, has a first thread. Their edges are scribed with unwriting runes that drink enchantment on contact. Towers keep registries of known Nullblades the way port cities keep plague maps, and quietly retain one or two regardless.","playstyle":"Patient hunter's tempo: close the distance under dispelling cover, sever the enemy's opening weave, then kill the mage in the silence that follows.","abilities":[{"name":"Sever the First Thread","desc":"Interrupt any spell as it begins; the caster cannot attempt that spell again until they rest."},{"name":"Drinking Edge","desc":"Your strikes strip one active enchantment from the target and convert it into temporary vigor."},{"name":"Field of Unwriting","desc":"Project a short aura in which ongoing magical effects sputter and pay double to persist."},{"name":"Nullstep","desc":"Pass through a barrier or ward as if it were mist, once per engagement, unraveling it behind you."}],"progressionSteps":["Reach level 25 and cut a sanctioned spell out of the air before a tribunal that wanted you to fail.","Carry an unwriting rune against your skin for a year without letting it eat your own casting.","Hunt a rogue caster the towers disowned but could not stop; return the staff unbroken, as proof of restraint.","Refuse the first assassination contract you are offered. The second is your own affair."]},{"id":"spellblade.t3b","name":"Edgescribe","tier":3,"level":25,"parent":"spellblade.t2a","role":"Melee striker — layered arcane detonation","lore":"Edgescribes turned the Runefencer's mid-swing sigils into full authorship: every cut leaves a rune in the wound, and the runes keep working after the blade moves on. Their duels read like manuscripts written on the loser. Universities forbid study of the technique, then cite it under other names.","playstyle":"Layer marked wounds across one or many foes, then speak the closing word to make every inscription ignite at once. Builds toward a single authored moment.","abilities":[{"name":"Wounding Script","desc":"Each melee hit inscribes a rune in the target; runes deal arcane damage over time and stack to five."},{"name":"The Closing Word","desc":"Speak the phrase that finishes the sentence: all your runes on all enemies detonate simultaneously."},{"name":"Errant Script","desc":"Your missed swings scribe runes on the ground instead; enemies who step on them take the mark."},{"name":"Author's Privilege","desc":"Reading your own runes on a dying foe restores mana and shortens your cooldowns."}],"progressionSteps":["Reach level 25 and write a legible sentence in sword-cuts on a training post, at full speed, blindfolded.","Compose a rune of your own, one no tower archive holds, and survive its first casting from your edge.","Duel before a scribe who transcribes every stroke; when he reads it back, it must scan as verse.","Leave a marked man alive for a season, and learn what your runes do to a life that continues."]},{"id":"spellblade.t3c","name":"Linewarden","tier":3,"level":25,"parent":"spellblade.t2b","role":"Formation anchor — ally warding, area denial","lore":"Linewardens took the Wardsworn's oath and stretched it across a rank of soldiers. Their wards run shield to shield like mortar, and a line so bound does not break where a Linewarden stands. Marshals argue over them before battles; afterward, the soldiers they held do not argue at all.","playstyle":"Positional and communal: bind your wards through allies' shields, walk the rank to reinforce failing sections, and make the formation itself your armor.","abilities":[{"name":"Mortarwork","desc":"Bind adjacent allies into your ward-lattice; damage they take is spread thin across the whole bound line."},{"name":"Walk the Rank","desc":"Move along your bound line without provoking attacks, repairing one broken ward per ally passed."},{"name":"No Step Backward","desc":"Bound allies cannot be feared, displaced, or routed while you remain standing."},{"name":"Salient","desc":"Project a ward-wall forward to claim ground; it holds until your line advances to occupy it."}],"progressionSteps":["Reach level 25 and bind your wards through nine shields at once without a single soldier feeling the weight.","Hold a section of a real wall during a real breach; count the living afterward, and remember the count.","Teach a green company to trust the lattice enough to stand where veterans would run.","Refuse a marshal's order that would spend your line cheaply, and survive the court-martial with your oath intact."]},{"id":"spellblade.t3d","name":"Spiteward","tier":3,"level":25,"parent":"spellblade.t2b","role":"Retaliation tank — punishment and attrition","lore":"Spitewards read the Wardsworn's oath backwards: protection is fine, but debt is better. Their wards remember every blow taken and repay with interest — in scald, in seizure, in the slow ruin of the striker's own strength. Bandit companies teach recruits to recognize the plate. Recognizing it, they leave.","playstyle":"Invite the hit: absorb punishment through vindictive wards, bank each blow as debt, then discharge the ledger onto whoever owes the most.","abilities":[{"name":"Ledger of Blows","desc":"Every hit you absorb is recorded as debt on the attacker; debt increases your damage against them."},{"name":"Scald Clause","desc":"Melee attackers take searing backlash through your wards, and their weapon hands blister, slowing their next swings."},{"name":"Collections","desc":"Discharge all recorded debt on one enemy as a single crushing invoice of arcane force."},{"name":"Grudge Given Form","desc":"While below half health, your wards regenerate from the pain of those who struck you."}],"progressionSteps":["Reach level 25 and let a champion beat on your wards until his arms fail; then walk him home unharmed.","Scribe your first vindictive clause and test it on yourself, because you must know exactly what you charge.","Take a beating you could have prevented, and collect the debt a year later to the day.","Be named in a mercenary charter as a hazard, by companies you have never met."]},{"id":"spellblade.t4a","name":"Sword of Unmaking","tier":4,"level":40,"parent":"spellblade.t3a","role":"Elite anti-mage executioner — hard denial","lore":"A Sword of Unmaking is what the towers mean when they say containment. Perhaps a dozen exist in a generation, sworn to an order with no hall and one law: no weave stands that they have judged. Their edges no longer bear runes; the unwriting has soaked into the steel, and into them.","playstyle":"Walk through the enemy's magic as if uninvited: strip wards on approach, execute casters through their own defenses, and leave the battlefield mundane.","abilities":[{"name":"Judgment of Silence","desc":"Declare one enemy's magic void; for a full engagement they can cast nothing above a cantrip."},{"name":"The Soaked Edge","desc":"Your weapon permanently ignores magical armor, barriers, and displacement effects."},{"name":"Mundane Ground","desc":"Render a wide circle inert; within it, only your own blade remembers magic."},{"name":"Unmake","desc":"Strike a persistent enchantment, construct, or summoned being and end it outright; greater works take two blows."}],"progressionSteps":["Reach level 40 and be judged by three Swords in a room with no door you noticed on entering.","Unmake a named work — a tower's founding ward, a battlefield curse, a crowned man's geas — and file no claim.","Give up your own casting; the order requires that what you sever, you can no longer envy.","Carry the soaked edge for a year. If it still lets you sheathe it, you are a Sword."]},{"id":"spellblade.t4b","name":"Scrivener of Scars","tier":4,"level":40,"parent":"spellblade.t3b","role":"Elite striker — engraved ruin, burst orchestration","lore":"Scriveners of Scars write in the oldest medium. Their runes no longer fade when the wound closes; the scar itself remains a working script, dormant until read. Kings bearing a Scrivener's mark have signed treaties rather than test what the closing word might still do. The order keeps its library alive, and walking.","playstyle":"Long-game authorship: seed engagements and years with dormant scars, then orchestrate detonations across every text you have ever written. Nothing marked is ever safe.","abilities":[{"name":"Indelible Script","desc":"Your runes persist through healing, dispelling, and death; only your own hand can strike them out."},{"name":"Read Aloud","desc":"Detonate every scar you have authored within sight, in any order you choose, over three heartbeats."},{"name":"Palimpsest","desc":"Overwrite an enemy's scar with a harsher edition; the old wound reopens as the new rune takes hold."},{"name":"Dedication","desc":"Scribe a protective epigraph on an ally's skin; the first fatal blow against them becomes a detonation instead."}],"progressionSteps":["Reach level 40 and present the order with a scar you wrote ten years prior, still legible, still loaded.","Author a rune that outlives its bearer, and stand graveside to prove it.","Mark a king, a heresiarch, or an archon, and let the mark be enough; collect nothing.","Surrender your practice blades. From now on, everything you write is permanent."]},{"id":"spellblade.t4c","name":"Warden of the Breach","tier":4,"level":40,"parent":"spellblade.t3c","role":"Elite bastion — breach denial, fortress warding","lore":"When a wall fails, the Warden of the Breach is sent to be the wall. The order maintains perhaps twenty at a time, rotated between fortresses the way relics are rotated between shrines. Chronicles record breaches by two names: where the stone broke, and which Warden stood in the gap.","playstyle":"Become terrain: plant yourself in the gap, scale your lattice to fortress size, and convert every push against you into proof the gap is closed.","abilities":[{"name":"Be the Wall","desc":"Rooted in a breach, you gain massive damage reduction and count as fortification for every allied purpose."},{"name":"Gatelaw","desc":"Enemies entering your gap cannot target anyone else; those who attempt to slip past are hurled back."},{"name":"Raise the Stones","desc":"Draw rubble and ruin into your lattice, rebuilding physical cover from the wreck of the wall around you."},{"name":"The Long Vigil","desc":"Your wards no longer decay with time; a post once warded stays warded until you choose otherwise."}],"progressionSteps":["Reach level 40 and stand a breach through a full assault after the garrison is ordered back behind you.","Ward a fortress so well that history records no attempt on it; accept that this is your only monument.","Learn the name of every stone in one wall. The order will know if you missed one.","Be requested, by name, by a commander who watched a different Warden die well."]},{"id":"spellblade.t4d","name":"Requiter","tier":4,"level":40,"parent":"spellblade.t3d","role":"Elite retaliator — debt-fueled devastation","lore":"Requiters are the Spiteward doctrine made institutional. The order keeps ledgers going back nine generations: blows owed, blows repaid, interest accrued in blood not yet spilled. A Requiter may arrive decades after the offense, wearing wards that remember what the offender has forgotten. Payment is always in the original currency.","playstyle":"Escalating exchange: soak the opening violence, compound the debt through vindictive wards, and end fights with a repayment no armor was priced for.","abilities":[{"name":"Nine Ledgers","desc":"Inherit stored debt from the order's ledgers; begin every engagement with retaliation already banked."},{"name":"Mounting Debt","desc":"Debt on an attacker doubles each round they continue striking you."},{"name":"Original Currency","desc":"Your repayment strike duplicates the exact wounds, curses, and breaks the target dealt to you, all at once."},{"name":"Forgiveness Clause","desc":"Void all debt on a target who yields; gain a lasting ward equal to what you declined to collect."}],"progressionSteps":["Reach level 40 and balance one ledger the order has carried for a hundred years, to the last blow.","Track a debtor across two borders and one war, and collect without touching anyone not named in the entry.","Master the forgiveness clause; the order trusts no collector who cannot decline.","Add your own name to a ledger for a wrong you committed, and let another Requiter come for you."]},{"id":"spellblade.t5a","name":"The Neverdrawn","tier":5,"level":60,"parent":"spellblade.t4a","role":"Mythic spell-execution — absolute magical denial","lore":"Histories disagree whether The Neverdrawn is a rank or one recurring person. Where they walk, prophecy stalls, scrying returns yesterday, and the towers' oldest grimoires develop blank pages. The blade is no longer distinguishable from the intention. What they cut has, in every sense that can be verified, never been cast.","playstyle":"Erasure as movement: spells die at the thought-stage in your presence; you duel entire schools of magic and edit outcomes retroactively.","abilities":[{"name":"Never Cast","desc":"Undo a spell that already resolved this engagement; its effects, damage, and consequences are removed from record."},{"name":"Never Written","desc":"Erase one written work of magic permanently, everywhere — every copy, every memory of the wording."},{"name":"The Quiet","desc":"Your presence is a field where magic requires your consent; allies you name are exempt."},{"name":"Final Parry","desc":"Once, cut fate itself: cancel any single event you witness, at the cost of a memory of your choosing."}],"progressionSteps":["Reach level 60 and unmake something a god maintains personally; survive the courtesy visit that follows.","Erase your own name from every archive, roll, and gravestone that holds it. What remains of you is the rank.","Stand where a prophecy says a hero dies, and see to it that the prophecy has never been written.","Sheathe the soaked edge for the last time. If the world still holds, you may draw it again."]},{"id":"spellblade.t5b","name":"The Final Stroke","tier":5,"level":60,"parent":"spellblade.t4b","role":"Mythic striker — continent-spanning authored ruin","lore":"The order speaks of a stroke that closes every sentence ever begun, and of the one who carries it unspent. The Final Stroke's runes are found on cliff faces, on the hulls of ships not yet sunk, in the flyleaves of books that later mattered. Nothing they have written has finished happening.","playstyle":"Author at world scale: your marks accumulate across a lifetime and a continent, and combat is merely where you choose to punctuate.","abilities":[{"name":"A Lifetime's Marginalia","desc":"Every rune you have ever written, anywhere, becomes available for detonation or revision from where you stand."},{"name":"The Unfinished Sentence","desc":"Begin a cut and refuse to finish it; the wound waits, worsening, until you complete the motion — even years later."},{"name":"Corrigendum","desc":"Rewrite one rune's effect after it detonates, applying the corrected version as well."},{"name":"End Mark","desc":"Write a single terminal rune on the world itself; within its radius, nothing you have marked survives the period."}],"progressionSteps":["Reach level 60 and detonate, in one ordered breath, marks you left in twelve kingdoms across forty years.","Write a rune that alters the outcome of a war you never attended.","Compose the terminal stroke. Show it to no one. Carrying it unspent is the rank.","Refuse to finish a killing sentence once, and let history see the ellipsis."]},{"id":"spellblade.t5c","name":"The Unfallen Gate","tier":5,"level":60,"parent":"spellblade.t4c","role":"Mythic bastion — absolute immovability, sanctuary","lore":"Some fortresses are named for a Warden who never left. The Unfallen Gate has stopped being stationed anywhere; places are stationed around them. Armies reroute rather than test the ground they stand on, and maps mark their vigil the way they mark mountains. No chronicle records one falling. Chronicles record everything else falling first.","playstyle":"You are the objective, and the objective cannot be taken: anchor reality around your vigil, shelter thousands, and outlast whatever arrives.","abilities":[{"name":"Terrain Entire","desc":"You count as a fortress: allies inside your lattice gain walls, gates, and a garrison's worth of wards."},{"name":"The Gate Holds","desc":"Once per vigil, negate an army-scale attack completely — siege spell, dragonfire, tide, or god's regard."},{"name":"Ground That Remembers","desc":"Any ground you have defended before recognizes you; your wards there raise themselves at full strength instantly."},{"name":"Open for No One","desc":"While your vigil stands, nothing crosses your threshold without consent — including effects that ignore walls."}],"progressionSteps":["Reach level 60 and hold one gap through a year of continuous siege; let the besiegers starve first.","Have a fortress renamed for you while you still stand in it.","Turn away a god politely at your threshold. The politeness is the test.","Choose the place you will never leave. The rank begins when the choice does."]},{"id":"spellblade.t5d","name":"The Iron Rebuke","tier":5,"level":60,"parent":"spellblade.t4d","role":"Mythic retaliator — inevitable reciprocal ruin","lore":"The order's ledgers end in a symbol meaning the balance now keeps itself. The Iron Rebuke is that symbol given a body. Harm done in their presence returns unbidden, the way weather returns. Tyrants have abdicated on rumor of an approach. Wars have been settled by asking which side they would find more owed.","playstyle":"Do nothing, and be lethal: reflection is passive, total, and lawful. Your art is choosing what to forgive before the world repays itself.","abilities":[{"name":"Standing Verdict","desc":"All harm dealt within your presence is automatically mirrored to its source; you no longer act to retaliate."},{"name":"Debt Older Than You","desc":"Invoke the full nine-generation ledger against one target whose line is named in it."},{"name":"Amnesty","desc":"Suspend the verdict for all within your sight; while it holds, no one can harm anyone."},{"name":"Final Accounting","desc":"Once in a lifetime, repay everything at once: every recorded debt of the order, discharged through your body in a single hour."}],"progressionSteps":["Reach level 60 and end a war by arriving; let both sides read their ledgers and reconsider.","Forgive the debt you have carried longest. The order says the rank cannot be held with it.","Stand in a massacre and let the verdict work; touch no one, and be the only thing survivors agree on.","Outlive the order. Keep the ledgers anyway."]}]}]};</script>
<script>
(function () {
  'use strict';
  const DATA = window.CODEX;
  if (!DATA || !DATA.families) { document.getElementById('app').textContent = 'Codex data missing — run tools/build.js.'; return; }

  const ARCH = {
    Might:    { color: 'var(--might)',    blurb: 'Steel, sinew, and the refusal to fall.' },
    Cunning:  { color: 'var(--cunning)',  blurb: 'Wits sharp enough to cut where blades cannot.' },
    Arcane:   { color: 'var(--arcane)',   blurb: 'Power studied, inherited, or borrowed at interest.' },
    Spirit:   { color: 'var(--spirit)',   blurb: 'Faith, nature, and breath made manifest.' },
    Esoteric: { color: 'var(--esoteric)', blurb: 'The forbidden arts that fit no tradition.' },
  };
  const ARCH_ORDER = ['Might', 'Cunning', 'Arcane', 'Spirit', 'Esoteric'];
  const TIERS = [
    { n: 'I',   label: 'Initiate',   lv: 1  },
    { n: 'II',  label: 'Adept',      lv: 10 },
    { n: 'III', label: 'Specialist', lv: 25 },
    { n: 'IV',  label: 'Elite',      lv: 40 },
    { n: 'V',   label: 'Mythic',     lv: 60 },
  ];

  /* ----- indexes ----- */
  const fams = DATA.families;
  const famById = {};
  const nodeById = {};   // "fam.node" -> node
  const childrenOf = {}; // "fam.node" -> [node,...]
  for (const f of fams) {
    famById[f.id] = f;
    for (const n of f.nodes) {
      nodeById[n.id] = n;
      n._fam = f.id;
      if (n.parent) (childrenOf[n.parent] = childrenOf[n.parent] || []).push(n);
    }
  }
  const lineage = n => { const out = []; let cur = n; while (cur) { out.unshift(cur); cur = cur.parent ? nodeById[cur.parent] : null; } return out; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const acOf = f => ARCH[f.archetype] ? ARCH[f.archetype].color : 'var(--gold)';

  const nNodes = fams.reduce((a, f) => a + f.nodes.length, 0);
  document.getElementById('headStats').textContent =
    ARCH_ORDER.length + ' archetypes · ' + fams.length + ' origins · ' + nNodes + ' ranks';

  /* ----- tree geometry (fixed 1-2-4-4-4 topology) ----- */
  const CW = 182, CH = 60, GX = 62, RH = 92, PX = 18, HY = 56;
  const ROW = { t1: 1.5, t2a: 0.5, t2b: 2.5 };
  const rowOf = id => {
    const s = id.slice(id.lastIndexOf('.') + 1);
    if (ROW[s] !== undefined) return ROW[s];
    return { a: 0, b: 1, c: 2, d: 3 }[s.slice(-1)];
  };
  const colX = t => PX + (t - 1) * (CW + GX);
  const rowY = r => HY + r * RH;
  const TREE_W = PX * 2 + 5 * CW + 4 * GX;
  const TREE_H = HY + 3 * RH + CH + 18;

  /* ----- views ----- */
  const app = document.getElementById('app');
  let fullRoad = false;

  function renderHome() {
    let h = '<div class="hero">' +
      '<h2>Every legend begins as a beginner.</h2>' +
      '<p>Choose one of fifteen origins. Each unfolds through five tiers of written trials — from first oath to mythic apotheosis — along four diverging destinies.</p>' +
      '<div class="rule">' + ARCH_ORDER.map(a => '<i style="background:' + ARCH[a].color + '"></i>').join('') + '</div></div>';
    for (const a of ARCH_ORDER) {
      const list = fams.filter(f => f.archetype === a);
      if (!list.length) continue;
      h += '<section class="arch-section" style="--ac:' + ARCH[a].color + '">' +
        '<div class="arch-head"><h3 style="color:' + ARCH[a].color + '">' + esc(a) + '</h3>' +
        '<span class="blurb">' + esc(ARCH[a].blurb) + '</span></div><div class="arch-rule"></div><div class="class-grid">';
      for (const f of list) {
        h += '<button class="class-card" data-go="#/f/' + f.id + '" style="--ac:' + acOf(f) + '">' +
          '<span class="icon">' + f.icon + '</span><span>' +
          '<h4>' + esc(f.name) + '</h4>' +
          '<div class="tagline">' + esc(f.tagline) + '</div>' +
          '<div class="meta">' + f.nodes.length + ' ranks · 4 mythic destinies</div>' +
          '</span></button>';
      }
      h += '</div></section>';
    }
    app.innerHTML = h;
  }

  function edgePath(p, c) {
    const x1 = colX(p.tier) + CW, y1 = rowY(rowOf(p.id)) + CH / 2;
    const x2 = colX(c.tier), y2 = rowY(rowOf(c.id)) + CH / 2;
    return 'M' + x1 + ' ' + y1 + ' C' + (x1 + GX / 2) + ' ' + y1 + ',' + (x2 - GX / 2) + ' ' + y2 + ',' + x2 + ' ' + y2;
  }

  function renderFamily(famId, nodeId) {
    const f = famById[famId];
    if (!f) { location.hash = '#/'; return; }
    const sel = nodeById[nodeId] && nodeById[nodeId]._fam === famId ? nodeById[nodeId] : f.nodes[0];
    const ac = acOf(f);
    const path = new Set(lineage(sel).map(n => n.id));
    const dimOthers = sel.tier > 1; // with the root selected, the whole tree is still ahead of you

    let svg = '<svg width="' + TREE_W + '" height="' + TREE_H + '" viewBox="0 0 ' + TREE_W + ' ' + TREE_H + '">';
    let cards = '';
    for (const n of f.nodes) {
      if (n.parent) {
        const lit = path.has(n.id) && path.has(n.parent);
        svg += '<path d="' + edgePath(nodeById[n.parent], n) + '"' + (lit ? ' class="lit"' : '') + '/>';
      }
      const cls = 'node' + (n.id === sel.id ? ' selected' : path.has(n.id) ? ' on-path' : dimOthers ? ' dimmed' : '');
      cards += '<button class="' + cls + '" data-go="#/f/' + f.id + '/' + n.id + '" ' +
        'style="left:' + colX(n.tier) + 'px;top:' + rowY(rowOf(n.id)) + 'px;width:' + CW + 'px;height:' + CH + 'px" ' +
        'title="' + esc(n.name) + '">' +
        '<span class="n-name">' + esc(n.name) + '</span>' +
        '<span class="n-meta">Tier ' + TIERS[n.tier - 1].n + ' · Lv ' + n.level + '</span></button>';
    }
    svg += '</svg>';
    let heads = '';
    for (let t = 1; t <= 5; t++) {
      heads += '<div class="tier-head" style="left:' + colX(t) + 'px;width:' + CW + 'px">' +
        '<b>' + TIERS[t - 1].n + ' — ' + TIERS[t - 1].label + '</b>Level ' + TIERS[t - 1].lv + '</div>';
    }

    app.innerHTML =
      '<div style="--ac:' + ac + '">' +
      '<div class="fam-top"><button class="back-btn" data-go="#/">← All origins</button></div>' +
      '<div class="fam-title"><span class="icon">' + f.icon + '</span>' +
      '<div><h2>' + esc(f.name) + '<span class="chip">' + esc(f.archetype) + '</span></h2>' +
      '<div class="tagline">' + esc(f.tagline) + '</div></div></div>' +
      '<p class="fam-desc">' + esc(f.description) + '</p>' +
      '<p class="tree-hint">Click a rank to read its lore and the written road that leads to it. Its lineage lights up in the tree.</p>' +
      '<div class="fam-layout">' +
      '<div class="tree-wrap"><div class="tree" style="width:' + TREE_W + 'px;height:' + TREE_H + 'px">' + svg + heads + cards + '</div></div>' +
      '<aside class="detail" id="detail">' + detailHTML(f, sel) + '</aside>' +
      '</div></div>';
  }

  function detailHTML(f, n) {
    const chain = lineage(n);
    const crumbs = chain.map((c, i) =>
      (i ? '<span class="sep">›</span>' : '') +
      '<button class="crumb' + (c.id === n.id ? ' here' : '') + '" data-go="#/f/' + f.id + '/' + c.id + '">' + esc(c.name) + '</button>'
    ).join('');

    let road;
    if (fullRoad && chain.length > 1) {
      road = '<div class="d-label">The Full Road — ' + esc(chain[0].name) + ' to ' + esc(n.name) + '</div><div class="full-road">' +
        chain.map(c =>
          '<h5>' + esc(c.name) + ' <small>Tier ' + TIERS[c.tier - 1].n + ' · Lv ' + c.level + '</small></h5>' +
          '<ol class="steps">' + c.progressionSteps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>'
        ).join('') + '</div>' +
        '<button class="road-btn" data-road="off">Show this rank only</button>';
    } else {
      road = '<div class="d-label">' + (n.tier === 1 ? 'Taking the First Step' : 'The Road to ' + esc(n.name)) + '</div>' +
        '<ol class="steps">' + n.progressionSteps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>' +
        (chain.length > 1 ? '<button class="road-btn" data-road="on">≡ Trace the full road from ' + esc(chain[0].name) + '</button>' : '');
    }

    const kids = (childrenOf[n.id] || []);
    const onward = kids.length
      ? '<div class="d-label">From Here the Path Divides</div><div class="kids">' +
        kids.map(k => '<button class="kid" data-go="#/f/' + f.id + '/' + k.id + '">' + esc(k.name) +
          '<small>Lv ' + k.level + '</small></button>').join('') + '</div>'
      : '<div class="d-label">Apex</div><p class="apex">There is no rank beyond this one — only the stories they will tell.</p>';

    return '<div class="crumbs">' + crumbs + '</div>' +
      '<h2>' + esc(n.name) + '</h2>' +
      '<div class="badges"><span class="badge tier">Tier ' + TIERS[n.tier - 1].n + ' — ' + TIERS[n.tier - 1].label + '</span>' +
      '<span class="badge">Level ' + n.level + '</span><span class="badge">' + esc(n.role) + '</span></div>' +
      '<p class="lore">' + esc(n.lore) + '</p>' +
      '<div class="d-label">Playstyle</div><p class="playstyle">' + esc(n.playstyle) + '</p>' +
      '<div class="d-label">Abilities Granted</div><ul class="abilities">' +
      n.abilities.map(a => '<li><b>' + esc(a.name) + '.</b> <span>' + esc(a.desc) + '</span></li>').join('') + '</ul>' +
      road + onward;
  }

  /* ----- search ----- */
  const veil = document.getElementById('veil');
  const input = document.getElementById('searchInput');
  const resultsEl = document.getElementById('results');
  const searchIndex = [];
  for (const f of fams) for (const n of f.nodes) {
    searchIndex.push({ f, n, hay: (n.name + ' ' + n.role + ' ' + f.name + ' ' + f.archetype).toLowerCase() });
  }
  function openSearch() { veil.hidden = false; input.value = ''; runSearch(''); setTimeout(() => input.focus(), 0); }
  function closeSearch() { veil.hidden = true; }
  function runSearch(q) {
    q = q.trim().toLowerCase();
    const hits = q
      ? searchIndex.filter(e => e.hay.includes(q)).slice(0, 40)
      : searchIndex.filter(e => e.n.tier === 5).slice(0, 40); // idle: show the myths
    resultsEl.innerHTML = hits.length
      ? hits.map(e =>
          '<button class="result" data-go="#/f/' + e.f.id + '/' + e.n.id + '">' +
          '<span class="r-dot" style="background:' + acOf(e.f) + '"></span>' +
          '<span>' + esc(e.n.name) + ' <small>· Tier ' + TIERS[e.n.tier - 1].n + '</small></span>' +
          '<span class="r-fam">' + e.f.icon + ' ' + esc(e.f.name) + '</span></button>'
        ).join('')
      : '<div class="no-results">Nothing in the codex answers to that name.</div>';
  }
  input.addEventListener('input', () => runSearch(input.value));
  veil.addEventListener('click', e => { if (e.target === veil) closeSearch(); });
  document.getElementById('searchBtn').addEventListener('click', openSearch);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeSearch();
    else if (e.key === '/' && veil.hidden && document.activeElement !== input) { e.preventDefault(); openSearch(); }
  });

  /* ----- routing & delegation ----- */
  function route() {
    const h = location.hash || '#/';
    const m = h.match(/^#\/f\/([\w-]+)(?:\/([\w.-]+))?$/);
    if (m) renderFamily(m[1], m[2]); else renderHome();
    if (!veil.hidden) closeSearch();
  }
  document.addEventListener('click', e => {
    const road = e.target.closest('[data-road]');
    if (road) {
      fullRoad = road.dataset.road === 'on';
      const m = (location.hash || '').match(/^#\/f\/([\w-]+)(?:\/([\w.-]+))?$/);
      if (m) {
        const f = famById[m[1]];
        const n = nodeById[m[2]] || f.nodes[0];
        document.getElementById('detail').innerHTML = detailHTML(f, n);
      }
      return;
    }
    const go = e.target.closest('[data-go]');
    if (go) {
      const cur = (location.hash || '').match(/^#\/f\/([\w-]+)/);
      const nxt = go.dataset.go.match(/^#\/f\/([\w-]+)/);
      if (!(cur && nxt && cur[1] === nxt[1])) fullRoad = false; // keep road mode within a family
      if (location.hash === go.dataset.go) route(); else location.hash = go.dataset.go;
    }
  });
  document.getElementById('brand').addEventListener('click', () => { location.hash = '#/'; });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
