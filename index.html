<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex of Ascension — RPG Class Progression</title>
<style>
  :root {
    --bg: #0d0d11;
    --bg-soft: #131318;
    --panel: #17171d;
    --panel-2: #1d1d25;
    --line: #2a2a35;
    --line-soft: #23232c;
    --ink: #e9e3d4;
    --ink-dim: #a39c8e;
    --ink-faint: #6f6a5f;
    --gold: #c9a962;
    --might: #d96a5f;
    --cunning: #7dbb6e;
    --arcane: #a98ae8;
    --spirit: #e0b354;
    --esoteric: #5fb8ba;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #33333f var(--bg); }
  body {
    background: var(--bg);
    background-image: radial-gradient(1100px 500px at 50% -10%, #1a1722 0%, transparent 60%);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 15.5px;
    line-height: 1.55;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: rgba(201,169,98,.3); }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 28px 16px;
    border-bottom: 1px solid var(--line-soft);
    background: linear-gradient(180deg, rgba(23,23,29,.9), rgba(13,13,17,.6));
    position: sticky; top: 0; z-index: 30; backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: center; gap: 14px; cursor: pointer; user-select: none; }
  .brand-mark {
    width: 40px; height: 40px; border: 1px solid var(--gold); border-radius: 50%;
    display: grid; place-items: center; color: var(--gold); font-size: 18px;
    box-shadow: 0 0 18px rgba(201,169,98,.18), inset 0 0 10px rgba(201,169,98,.12);
    flex: none;
  }
  .brand h1 {
    font-size: 19px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink);
  }
  .brand .sub { font-size: 12.5px; color: var(--ink-dim); font-style: italic; letter-spacing: .02em; }
  .head-right { display: flex; align-items: center; gap: 18px; }
  .head-stats { font-size: 12.5px; color: var(--ink-faint); letter-spacing: .08em; text-transform: uppercase; }
  .search-btn {
    background: var(--panel); color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font-size: 13.5px; letter-spacing: .02em;
    transition: border-color .15s, color .15s;
  }
  .search-btn:hover { border-color: var(--gold); color: var(--ink); }

  main { max-width: 1440px; margin: 0 auto; padding: 30px 28px 80px; }

  /* ---------- landing ---------- */
  .hero { text-align: center; margin: 18px auto 44px; max-width: 720px; }
  .hero h2 {
    font-size: 30px; font-weight: 500; letter-spacing: .04em; margin-bottom: 12px;
  }
  .hero p { color: var(--ink-dim); font-size: 15.5px; font-style: italic; }
  .hero .rule {
    display: flex; gap: 6px; justify-content: center; margin-top: 22px;
  }
  .hero .rule i { width: 44px; height: 2px; border-radius: 2px; opacity: .8; }

  .arch-section { margin-bottom: 42px; }
  .arch-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  .arch-head h3 {
    font-size: 15px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600;
  }
  .arch-head .blurb { color: var(--ink-faint); font-size: 13.5px; font-style: italic; }
  .arch-rule { height: 1px; margin: 10px 0 18px; background: linear-gradient(90deg, var(--ac), transparent 70%); opacity: .45; }
  .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

  .class-card {
    text-align: left; background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-left: 3px solid var(--ac);
    border-radius: 10px; padding: 18px 18px 16px; color: var(--ink);
    display: flex; gap: 14px; align-items: flex-start;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .class-card:hover {
    transform: translateY(-2px); border-color: var(--ac);
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .class-card .icon { font-size: 26px; line-height: 1.2; flex: none; filter: saturate(.85); }
  .class-card h4 { font-size: 18px; font-weight: 600; letter-spacing: .03em; }
  .class-card .tagline { color: var(--ink-dim); font-size: 13.5px; font-style: italic; margin-top: 3px; }
  .class-card .meta { color: var(--ink-faint); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-top: 10px; }

  /* ---------- family view ---------- */
  .fam-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 8px; flex-wrap: wrap; }
  .back-btn {
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 8px; padding: 7px 14px; font-size: 13.5px;
  }
  .back-btn:hover { border-color: var(--gold); color: var(--ink); }
  .fam-title { display: flex; gap: 16px; align-items: center; margin: 14px 0 4px; }
  .fam-title .icon { font-size: 34px; }
  .fam-title h2 { font-size: 28px; font-weight: 600; letter-spacing: .04em; }
  .fam-title .chip {
    font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase;
    border: 1px solid var(--ac); color: var(--ac);
    border-radius: 20px; padding: 3px 12px; margin-left: 6px;
  }
  .fam-title .tagline { color: var(--ink-dim); font-style: italic; font-size: 14px; }
  .fam-desc { color: var(--ink-dim); max-width: 860px; font-size: 14.5px; margin: 6px 0 4px; }
  .tree-hint { color: var(--ink-faint); font-size: 12.5px; font-style: italic; margin: 8px 0 14px; }

  .fam-layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 22px; align-items: start; }
  @media (max-width: 1160px) { .fam-layout { grid-template-columns: 1fr; } }

  .tree-wrap {
    background: var(--bg-soft);
    border: 1px solid var(--line-soft); border-radius: 12px;
    overflow-x: auto; overflow-y: hidden;
    padding: 6px 0 14px;
  }
  .tree { position: relative; }
  .tree svg { position: absolute; inset: 0; pointer-events: none; }
  .tree svg path { fill: none; stroke: var(--line); stroke-width: 1.6; transition: stroke .15s; }
  .tree svg path.lit { stroke: var(--ac); stroke-width: 2.2; filter: drop-shadow(0 0 3px var(--ac)); }

  .tier-head {
    position: absolute; top: 8px; text-align: center;
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint);
  }
  .tier-head b { display: block; color: var(--ink-dim); font-size: 12.5px; letter-spacing: .16em; margin-bottom: 1px; }

  .node {
    position: absolute; text-align: left;
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-left: 3px solid var(--ac);
    border-radius: 8px; padding: 9px 12px 8px; color: var(--ink);
    transition: border-color .15s, box-shadow .15s, opacity .15s, transform .1s;
  }
  .node:hover { border-color: var(--ac); transform: translateY(-1px); }
  .node .n-name { font-size: 13.5px; font-weight: 600; letter-spacing: .02em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .n-meta { font-size: 10.5px; color: var(--ink-faint); letter-spacing: .14em; text-transform: uppercase; margin-top: 3px; display: block; }
  .node.on-path { border-color: var(--ac); }
  .node.dimmed { opacity: .38; }
  .node.selected {
    border-color: var(--ac);
    box-shadow: 0 0 0 1px var(--ac), 0 0 20px color-mix(in srgb, var(--ac) 35%, transparent);
    opacity: 1;
  }

  /* ---------- detail panel ---------- */
  .detail {
    background: linear-gradient(170deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-top: 3px solid var(--ac);
    border-radius: 12px; padding: 22px 24px 24px;
    position: sticky; top: 92px;
    max-height: calc(100vh - 116px); overflow-y: auto;
  }
  @media (max-width: 1160px) { .detail { position: static; max-height: none; } }
  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
  .crumbs .sep { color: var(--ink-faint); font-size: 11px; }
  .crumb {
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    font-size: 11.5px; border-radius: 14px; padding: 2px 10px; letter-spacing: .04em;
  }
  .crumb:hover { border-color: var(--ac); color: var(--ink); }
  .crumb.here { border-color: var(--ac); color: var(--ac); }
  .detail h2 { font-size: 23px; font-weight: 600; letter-spacing: .03em; margin-bottom: 6px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .badge {
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 4px; padding: 3px 9px;
  }
  .badge.tier { border-color: var(--ac); color: var(--ac); }
  .lore { font-style: italic; color: var(--ink-dim); border-left: 2px solid var(--ac); padding-left: 14px; margin-bottom: 16px; font-size: 14.5px; }
  .d-label { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-faint); margin: 18px 0 8px; }
  .playstyle { font-size: 14.5px; color: var(--ink); }
  .abilities { list-style: none; }
  .abilities li { padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
  .abilities li:last-child { border-bottom: none; }
  .abilities b { color: var(--gold); font-weight: 600; letter-spacing: .02em; }
  .abilities span { color: var(--ink-dim); }

  .steps { list-style: none; counter-reset: step; }
  .steps li {
    counter-increment: step; position: relative;
    padding: 7px 0 7px 38px; font-size: 14px; color: var(--ink);
  }
  .steps li::before {
    content: counter(step, upper-roman);
    position: absolute; left: 0; top: 8px;
    width: 26px; text-align: center;
    font-size: 11px; color: var(--ac); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 0; letter-spacing: .05em;
  }
  .road-btn {
    width: 100%; margin-top: 18px;
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 8px; padding: 9px 12px; font-size: 13px; letter-spacing: .06em;
  }
  .road-btn:hover { border-color: var(--gold); color: var(--gold); }
  .full-road h5 {
    font-size: 13.5px; color: var(--ink); font-weight: 600; letter-spacing: .04em;
    margin: 16px 0 2px; display: flex; align-items: baseline; gap: 8px;
  }
  .full-road h5 small { color: var(--ink-faint); font-weight: 400; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .kids { display: flex; flex-wrap: wrap; gap: 8px; }
  .kid {
    background: none; border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
  }
  .kid:hover { border-color: var(--ac); }
  .kid small { color: var(--ink-faint); margin-left: 6px; font-size: 11px; }
  .apex { color: var(--ink-faint); font-style: italic; font-size: 13px; }

  /* ---------- search ---------- */
  .veil {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8,8,11,.72); backdrop-filter: blur(4px);
    display: grid; justify-items: center; align-items: start; padding: 12vh 20px 20px;
  }
  .veil[hidden] { display: none; }
  .search-box {
    width: min(640px, 100%); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
  }
  .search-box input {
    width: 100%; background: none; border: none; outline: none;
    color: var(--ink); font-family: var(--serif); font-size: 17px;
    padding: 16px 20px; border-bottom: 1px solid var(--line-soft);
  }
  .results { max-height: 52vh; overflow-y: auto; }
  .result {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: none; border: none; border-bottom: 1px solid var(--line-soft);
    padding: 11px 20px; color: var(--ink); font-size: 14.5px;
  }
  .result:hover { background: var(--panel); }
  .result .r-fam { color: var(--ink-faint); font-size: 12px; margin-left: auto; text-align: right; flex: none; }
  .result .r-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .result small { color: var(--ink-faint); }
  .no-results { padding: 18px 20px; color: var(--ink-faint); font-style: italic; font-size: 14px; }

  footer { text-align: center; color: var(--ink-faint); font-size: 12px; letter-spacing: .08em; padding: 24px; border-top: 1px solid var(--line-soft); }
</style>
</head>
<body>

<header>
  <div class="brand" id="brand" title="Return to the codex">
    <div class="brand-mark">✦</div>
    <div>
      <h1>Codex of Ascension</h1>
      <div class="sub">Fifteen origins. Two hundred twenty-five destinies.</div>
    </div>
  </div>
  <div class="head-right">
    <div class="head-stats" id="headStats"></div>
    <button class="search-btn" id="searchBtn">⌕ &nbsp;Search the codex&hairsp;… &nbsp;<span style="opacity:.55">/</span></button>
  </div>
</header>

<main id="app"></main>

<footer>CODEX OF ASCENSION · CHOOSE YOUR ORIGIN, WALK IT TO MYTH</footer>

<div class="veil" id="veil" hidden>
  <div class="search-box">
    <input id="searchInput" placeholder="Search ranks, roles, classes… (Esc to close)" autocomplete="off">
    <div class="results" id="results"></div>
  </div>
</div>

<script>window.CODEX = {"families":[{"id":"warrior","name":"Warrior","archetype":"Might","icon":"⚔️","tagline":"Steel forgives nothing; the drill-yard rewards everything.","description":"The Warrior asks for nothing you were born with. No bloodline, no pact, no whispered patron — only a body, a weapon, and the willingness to repeat one motion until it stops being a motion and becomes you. Warriors fill the world's garrisons and free companies, and from their mud-floored drill-yards every road of Might begins.","nodes":[{"id":"warrior.t1","name":"Warrior","tier":1,"level":1,"parent":null,"role":"Frontline melee — versatile and durable","lore":"Every garrison keeps them: farm sons and gutter orphans who traded whatever came before for a spear and a bunk. Most die unremembered. The ones who survive their first winter learn what the drill-yards teach — that steel forgives nothing and rewards everything, and that a body, patiently punished, can be re-forged into an instrument.","playstyle":"Straightforward frontline melee. Manage stamina, hold your ground, and trade blows with unglamorous efficiency while deciding which road calls louder — the perfected self, or the company.","abilities":[{"name":"Measured Cut","desc":"A drilled strike that cannot glance; deals full weapon damage even against a raised guard."},{"name":"Set the Feet","desc":"Brace for one round: knockbacks, trips, and shoves against you fail, and blocked damage is halved."},{"name":"Soldier's Wind","desc":"Once per fight, recover a burst of stamina and shake off one bleed or daze."},{"name":"Yard Callus","desc":"Passive: each week of campaigning grants small permanent gains to carry weight and fatigue resistance."}],"progressionSteps":["Present yourself at any muster, garrison, or free company; bring nothing but two working hands.","Survive your first winter of drills — the yard at dawn, the wall at dusk, blisters into callus.","Stand your first real fight without breaking. What you do after the fear arrives decides everything.","Bury a comrade, then report for drill the next morning."]},{"id":"warrior.t2a","name":"Drillsworn","tier":2,"level":10,"parent":"warrior.t1","role":"Melee striker — precision single-target","lore":"Some soldiers discover the company was only ever a scabbard for the self. The Drillsworn take a private vow: ten thousand repetitions of every cut before they may claim its name. Officers find them in the yard at midnight, alone, correcting a wrist angle that no one else alive can see.","playstyle":"Precise single-target melee. Build tempo through repeated engagement; feints and drilled counters punish anything predictable. Weaker amid chaos, lethal wherever the fight narrows to one.","abilities":[{"name":"Ten-Thousandth Repetition","desc":"Passive: consecutive strikes against one target each land truer than the last, stacking until you switch targets."},{"name":"Feint in Tempo","desc":"Sell a false opening; if the enemy takes it, your true strike ignores their armor."},{"name":"Single Combat","desc":"Mark one foe: you read them fully, gaining counters against them while dropping guard against all others."},{"name":"Edge Discipline","desc":"Passive: your weapon never dulls, jams, or slips, and disarm attempts against you all but fail."}],"progressionSteps":["Reach level 10 and swear the Drill-Vow before a witness who has themselves sworn it.","Perform one cut ten thousand times, counted honestly. The count restarts the first time you lie.","Defeat your own drill instructor using the weapon they taught you.","Fight one full campaign without a wasted motion — every strike thrown must land or teach."]},{"id":"warrior.t2b","name":"Bannerhand","tier":2,"level":10,"parent":"warrior.t1","role":"Frontline support — orders and morale","lore":"When the standard-bearer falls, someone catches the pole before it touches the mud. That reflex — reaching for the weight of everyone else — is what quartermasters watch for. A Bannerhand holds no commission at first; they hold the thing itself, the cloth a company follows after its officers are dead.","playstyle":"Frontline support and control. Plant the standard, anchor allies to its shadow, and spend your own guard freely to keep the line's shape from breaking.","abilities":[{"name":"Raise the Standard","desc":"Plant your banner: allies within its shadow resist fear and strike steadier while it stands."},{"name":"The Voice That Carries","desc":"Shout an order over any din; one ally immediately moves or strikes out of turn."},{"name":"Shoulder the Line","desc":"Redirect a portion of the damage dealt to any adjacent ally onto your own guard."},{"name":"Forced March","desc":"Your company covers a further span each day and delays all fatigue penalties until camp."}],"progressionSteps":["Reach level 10 and carry the company standard through one engagement without letting it touch the ground.","Learn every soldier's name in your file, and the name each one calls out in their sleep.","Rally a broken line using only your voice. If they re-form, the rank is yours.","Refuse a promotion that would take you off the line."]},{"id":"warrior.t3a","name":"Halfsword","tier":3,"level":25,"parent":"warrior.t2a","role":"Duelist — bind, control, armor-piercing","lore":"Duels in the border towns are settled close: gauntlet on the blade, pommel raised, breath shared. Halfswords study the crossing itself — that grinding half-second where two weapons argue. They are hired to end quarrels the courts cannot, and they walk out of rooms that other fighters are carried from.","playstyle":"Close-range duelist. Bind the enemy's weapon, deny every disengage, and win the grapple-distance argument with armor-slipping thrusts and pommel strokes. Helpless against numbers, near-certain alone.","abilities":[{"name":"Grip the Blade","desc":"A halfsword thrust at grappling range that slides through visor slits and joint gaps, ignoring plate entirely."},{"name":"The Bind","desc":"Lock weapons with a foe; neither of you may disengage, and you win every contested crossing."},{"name":"Murder-Stroke","desc":"Reverse the blade and swing the pommel; against a helmeted foe this dazes straight through the steel."},{"name":"Read the Shoulder","desc":"Passive: enemies telegraph to you; the first attack in each exchange grants you a free counter-thrust."}],"progressionSteps":["Reach level 25 and win seven witnessed duels without taking a wound past the first.","Grip your own blade barehanded and drive it through a breastplate. Learn what the edge permits.","Study one opponent for a month before fighting them, then end the duel inside three exchanges.","Decline a duel you would have won, because the cause was rotten. The refusal is the lesson."]},{"id":"warrior.t3b","name":"Edgewright","tier":3,"level":25,"parent":"warrior.t2a","role":"Burst striker — single decisive cuts","lore":"In the high passes stand shrines of split stones, each cloven by a single stroke and signed with a maker's mark. Edgewrights leave them. They pursue the one honest cut — the motion with nothing extra in it — and grade their entire lives against falling silk and standing water.","playstyle":"Deliberate burst striker. Long setups and ruinous single strikes; draw-cuts from the scabbard that resolve whole fights in one motion. Patience is the true resource.","abilities":[{"name":"Draw-Cut","desc":"Strike from the scabbard in one motion; against an unwounded target it always lands first and cannot be parried."},{"name":"One Motion","desc":"Merge parry and cut: a successful defense this round is simultaneously a full-damage riposte."},{"name":"Cut the Falling Leaf","desc":"A strike so clean the target feels nothing for a breath; the delayed wound resolves doubled."},{"name":"Whetstone Rite","desc":"An hour's ritual sharpening: your next three cuts sever material one grade harder than steel should allow."}],"progressionSteps":["Reach level 25 and cut a hanging silk scarf so cleanly that both halves settle before the wind notices.","Forge or commission a blade fitted to your hand alone, and never lend it.","Spend a season cutting only air, until an Edgewright of standing certifies your motion holds nothing wasted.","Split a standing stone with one stroke, and sign it."]},{"id":"warrior.t3c","name":"Linebreaker","tier":3,"level":25,"parent":"warrior.t2b","role":"Assault leader — breach and momentum","lore":"Every siege has a moment when the wall opens and someone must be first into the smoke. Linebreakers volunteer twice. They command the worst thirty yards in the world — the breach, the gate, the ladder-top — and free companies bid against each other for a muster-roll carrying such a name.","playstyle":"Momentum-driven assault leader. Charge first, hit hardest at the point of entry, and drag your squad through the gap you tore before it closes.","abilities":[{"name":"First Through","desc":"Entering a space held by three or more enemies grants you a surge of guard and a free strike."},{"name":"Weight of the Charge","desc":"Your first strike's damage scales with every yard you crossed to deliver it."},{"name":"On Me","desc":"Allies who follow your charge this round share your speed and half your momentum bonus."},{"name":"Doorbreaker","desc":"Your strikes deal quadruple damage to gates, barricades, shields, and anything else pretending to be a wall."}],"progressionSteps":["Reach level 25 and be first through a defended breach three times. Volunteering counts only if you live.","Carry a wounded soldier back out through the gap you led them into.","Take a gate from the inside with fewer than ten at your back.","Have your name written first on a storming-party's roll — by someone else's hand."]},{"id":"warrior.t3d","name":"Ironmuster","tier":3,"level":25,"parent":"warrior.t2b","role":"Line commander — discipline and attrition","lore":"Armies are not raised; they are manufactured, and Ironmusters run the forge. They hammer levied plowboys into ranks that hold, count arrows and bread with the same cold arithmetic, and hold that glory is a rumor started by people who never smelled a supply train burn.","playstyle":"Defensive line commander. Position allies precisely, ration everyone's stamina including the enemy's, and grind battles down into arithmetic your side was built to win.","abilities":[{"name":"Dress the Line","desc":"Reposition any allies in earshot by one rank; the corrected line gains guard until it breaks formation."},{"name":"Attrition Doctrine","desc":"Passive: enemies attacking your formation spend double stamina; your ranks spend half."},{"name":"Quartermaster's Eye","desc":"Passive: your company consumes fewer supplies and shrugs off weather, hunger, and forced-march fatigue."},{"name":"No Step Back","desc":"Allies adjacent to you cannot be pushed, routed, or frightened out of position."}],"progressionSteps":["Reach level 25 and train one hundred raw recruits to hold formation under a cavalry feint.","March a company two hundred miles and arrive with more discipline than you left with.","Hold ground you were ordered to hold until the order changes, whatever crosses the field.","Court-martial a friend fairly. The muster is owed the truth more than you are owed comfort."]},{"id":"warrior.t4a","name":"Doomfencer","tier":4,"level":40,"parent":"warrior.t3a","role":"Execution duelist — sanctioned single combat","lore":"When a verdict must lie beyond appeal, crowns send for a Doomfencer. They fight judicial duels as officers of the court, in black quilting, before witnesses the law requires to watch. Perhaps forty hold the office across the known kingdoms. Their arrival in a city settles most lawsuits by itself.","playstyle":"Sanctioned execution duelist. Isolate one opponent under formal challenge, convert their every error into mounting counters, and close with strokes the law itself has blessed.","abilities":[{"name":"Sentence of Steel","desc":"Formally challenge one foe: both of you are bound to the duel until one yields, falls, or dies."},{"name":"Court of One","desc":"While your duel stands, no outside blow can reach either duelist; the world is reduced to witness."},{"name":"Weighed and Wanting","desc":"Passive: every miss your duel opponent makes grants you an escalating counter that cannot itself miss."},{"name":"Black Verdict","desc":"Against a duel opponent below a quarter of their health, deliver the sanctioned stroke: it kills, cleanly, always."}],"progressionSteps":["Reach level 40 and stand judicial champion in a capital trial, a kingdom's law resting on your point.","Kill a Doomfencer in office, or be named successor by one retiring — the office admits no third door.","Fight one duel you believe unjust, and let it teach you exactly what the office costs.","Swear before the bench to accept every lawful challenge, forever, regardless of who offers it."]},{"id":"warrior.t4b","name":"Severant","tier":4,"level":40,"parent":"warrior.t3b","role":"Nova striker — one prepared, absolute cut","lore":"High on the scarps lives an order that has cut everything else away — property, names, speech on certain days. Severants hold that every problem has a grain, like wood, and that a sufficiently honest edge will find it. Lowlanders climb for months to ask them for one stroke. Sometimes they descend.","playstyle":"Ascetic nova striker. Fights last one motion or none; everything before the cut is positioning, breathing, and an absolute refusal to be hurried.","abilities":[{"name":"Sever the Question","desc":"One prepared stroke that ignores all armor, guard, and mitigation; preparing it costs an entire round of stillness."},{"name":"Cut Water","desc":"Your strike passes through parries and blocks as if through current; only distance defends against it."},{"name":"Nothing Wasted","desc":"Passive: any cut that kills refunds its full cost; a finished fight leaves you unspent."},{"name":"The Pared Self","desc":"Passive: feints, taunts, illusions, and pain cannot move you; your tempo belongs to you alone."}],"progressionSteps":["Reach level 40, climb to the Severed Order's scarp, and leave your possessions at the treeline.","Keep silence for a hundred days, drilling the same cut at dawn and at dusk.","Sever a falling waterfall so the stream stutters. The elders will hear it and come down.","Cut away one thing you love. The order does not say which. You will know."]},{"id":"warrior.t4c","name":"Forlorn Captain","tier":4,"level":40,"parent":"warrior.t3c","role":"Vanguard commander — first-wave shock and rally","lore":"The forlorn hope is the first wave into a breach — soldiers counted dead at signing. A Forlorn Captain has led it and lived, more than once, which armies regard as something between skill and blasphemy. Veterans wear their captains' names inked on their arms: a roll of the saved.","playstyle":"Vanguard commander. Open every battle personally, convert the first minutes of violence into a beachhead, and make desperate allies fight like cornered kings.","abilities":[{"name":"Hope of the Doomed","desc":"Allies below half health within your sight deal heavier damage and cannot flee while you still advance."},{"name":"First Wave","desc":"In an engagement's opening rounds, you and every soldier who signed your roll strike twice."},{"name":"Carry the Fallen","desc":"Drag a downed ally at full speed while fighting one-handed, without penalty."},{"name":"The Breach Holds","desc":"A gap you open in an enemy line stays open; enemies cannot re-form ranks around you."}],"progressionSteps":["Reach level 40 and lead a forlorn hope through the wall, bringing more than half your roll out alive.","Be given up for dead by your own army, then report for duty.","Turn down the general's tent. Captains of the hope sleep where the ladders are stacked.","Learn your letters if you lack them — someone must write to the families afterward, and it should be you."]},{"id":"warrior.t4d","name":"Standfast","tier":4,"level":40,"parent":"warrior.t3d","role":"Bulwark commander — immovable defense","lore":"Some ground cannot be lost, so the crowns keep the Standfast: a small order sworn to hold named places — a bridge, a pass, a stair — until relieved or dead. Their muster-book lists positions, not people. In four centuries it records eleven retreats, each one ordered, none of them chosen.","playstyle":"Immovable bulwark commander. Fortify a position, rotate your line like a machine, and outlast anything the enemy can afford to keep sending at it.","abilities":[{"name":"This Ground Is Ours","desc":"Name the ground you hold: allies standing on it take reduced damage and cannot fail morale."},{"name":"Rotation Drill","desc":"Swap fatigued front-rank allies with rested rear ranks instantly, without ever opening the wall."},{"name":"Outlast","desc":"Passive: each hour a battle continues, your formation's guard and stamina recovery climb."},{"name":"The Wall Speaks","desc":"A single shout halts a rout; fleeing allies within earshot stop, turn, and re-form on you."}],"progressionSteps":["Reach level 40 and hold a named position through a siege of no fewer than forty days.","Recite the muster-book's eleven retreats from memory before the order's eldest, and say what each one cost.","Refuse relief once, because the relieving column was needed elsewhere more.","Add one position to the book, and be the first name sworn to it."]},{"id":"warrior.t5a","name":"The Unanswered","tier":5,"level":60,"parent":"warrior.t4a","role":"Apex duelist — perfect counters","lore":"Histories disagree about everything except the count: no riposte has ever landed. The Unanswered is less a person than a standing question — dueling culture across three kingdoms is one long argument about a fighter most living people have never seen draw, because the draw is the end of it.","playstyle":"Perfect counter-duelist. You act inside your opponent's hesitations; fights are decided before observers understand they have begun. Numbers do not matter — there is only ever one opponent at a time.","abilities":[{"name":"Final Tempo","desc":"Passive: you act in the instant between an enemy's decision and their motion; you always move first."},{"name":"No Second Exchange","desc":"Your riposte resolves the duel: a landed counter ends the target's capacity to continue, one way or another."},{"name":"Perfect Measure","desc":"Passive: you dictate the exact distance of every engagement; enemies cannot flank, crowd, or reach you unwilled."},{"name":"The Question","desc":"An enemy who watches you draw must pass a test of will or decline to fight you at all."}],"progressionSteps":["Reach level 60 bearing no recorded wound from single combat since your Doomfencer oath.","Answer one hundred lawful challenges, and let none of them become a second exchange.","Duel a sitting Doomfencer before every crowned witness alive; leave them living, unmarked, and finished with swords.","Refuse the last challenge ever offered you, and let the silence that follows stand as your successor."]},{"id":"warrior.t5b","name":"Hundredth Form","tier":5,"level":60,"parent":"warrior.t4b","role":"Apex striker — one absolute stroke","lore":"The order teaches ninety-nine forms and admits a hundredth exists: unteachable, arrived at only by exhausting the others. Once in a generation, someone stops drilling mid-motion and does not resume, because they are finished. Mountainsides where such people have cut carry weather-smooth scars. Farmers plow around them without being told why.","playstyle":"Apex single-strike fighter. One drawn breath, one motion, one ended thing per encounter; everything else is the walking between cuts.","abilities":[{"name":"The Hundredth Form","desc":"Once per day, the unteachable cut: one target, structure, or obstacle simply ends. No roll is made."},{"name":"Ten Thousand Days","desc":"Passive: your techniques cost no stamina; a lifetime of drilling has paid every bill in advance."},{"name":"Stillness Before","desc":"While your blade is sheathed you cannot be surprised, hastened, or made to move first."},{"name":"Cut the Uncuttable","desc":"Your edge severs what edges cannot: stone, siege chain, tempered plate, and the momentum of a charge."}],"progressionSteps":["Reach level 60 and perform all ninety-nine forms before the assembled order without one correction offered.","Cut something the order agrees cannot be cut, in a single stroke, with the elders watching.","Give away the blade fitted to your hand alone, and cut as well with whatever is handed to you.","Perform the hundredth form once. There is no second performance; the order will raise your shrine from the pieces."]},{"id":"warrior.t5c","name":"Ruin of Gates","tier":5,"level":60,"parent":"warrior.t4c","role":"Apex assault — siege-ending offense","lore":"Certain cities surrender when a particular banner crests the hill, reasoning that their walls are already gone in every way that matters. The Ruin of Gates has ended more sieges by arriving than by fighting, and the masons of six kingdoms curse the name professionally, the way sailors curse a reef.","playstyle":"Siege-ending assault apex. Collapse fortifications personally, chain-rally whole armies into the gap, and convert one breach into a general surrender within the hour.","abilities":[{"name":"The Gate Remembers","desc":"Passive: your melee strikes deal siege-engine damage; gates, walls, and towers count as valid single targets."},{"name":"Follow Me or Mourn Me","desc":"A battle-wide rally: every ally who can see your banner joins the charge carrying your momentum bonuses."},{"name":"Hundredth Hope","desc":"Once per battle, a blow that would kill you while advancing simply fails."},{"name":"Terms at the Wall","desc":"Offer surrender mid-assault; a shaken garrison must genuinely weigh it, checking morale at heavy penalty."}],"progressionSteps":["Reach level 60 and take a city sung as untakeable, its gate opened by your own hands.","Survive your hundredth forlorn hope, until the muster-clerks stop entering your name among the dead.","Accept a fortress's surrender offered to your banner alone, before your army has arrived.","Rebuild one city you broke, stone by stone, and garrison it with the soldiers you led through its wall."]},{"id":"warrior.t5d","name":"Sovereign of Hosts","tier":5,"level":60,"parent":"warrior.t4d","role":"Apex commander — army-scale command","lore":"When the muster-horns pass a certain name down the valleys, farms empty by choice. The Sovereign of Hosts commands no standing army; they are owed one — by veterans, by veterans' sons, by kingdoms that remember. Historians have taken to measuring wars by whether this person was in them.","playstyle":"Army-scale apex commander. Personally modest in the melee, overwhelming in aggregate: every ally fights as if drilled by your hand, because most of them were.","abilities":[{"name":"Ten Thousand Answer","desc":"Sound the muster: within days, veteran companies arrive owing you service no coin could buy."},{"name":"The Field Entire","desc":"Passive: you perceive the whole battlefield as a single shape; all allies act on your initiative."},{"name":"Worth a Legion","desc":"An enemy force that learns you command must check morale before offering battle at all."},{"name":"One Voice","desc":"Your orders reach every ally on the field regardless of distance, din, or dying."}],"progressionSteps":["Reach level 60 and raise ten thousand soldiers with no coin offered — only your name on the summons.","Win a war the historians agree was unwinnable, then disband the army when they beg you to keep it.","Train the sergeant who trains the sergeants of three kingdoms' armies.","Speak once on a field where two hosts stand ready, and send both home unblooded."]}]},{"id":"berserker","name":"Berserker","archetype":"Might","icon":"🪓","tagline":"What winter could not kill, it armed.","description":"The marches breed them: fighters raised where winter kills more than war does, taught that pain is fuel and fear a language they never learned. A Berserker does not hold formation; formation holds its breath. Whether they invite a beast-spirit under the skin or simply refuse to stop moving, they end fights by making restraint irrelevant.","nodes":[{"id":"berserker.t1","name":"Berserker","tier":1,"level":1,"parent":null,"role":"Melee bruiser — reckless sustained damage","lore":"Born to the frozen marches, where winter culls the timid and the rage-fire is banked in every hearth-tale. The berserker learns early that pain is a door, not a wall. Villages feed them, fear them, and set them loose when the wolves, or worse, come down from the ice.","playstyle":"Trade defense for damage. Build fury by taking and dealing hits, then spend it in short, terrifying windows where nothing else on the field matters.","abilities":[{"name":"Red Veil","desc":"Enter a fury that raises all damage dealt and taken for twelve seconds; you cannot be feared or slowed while it lasts."},{"name":"Blood Price","desc":"Sacrifice a tenth of your current health to make the next strike unblockable and critical."},{"name":"Howl of the Marches","desc":"A shout that strips enemy courage effects and staggers everything in a cone before you."},{"name":"Deaf to Fear","desc":"Passive: fear, panic, and morale effects are ignored; gain fury whenever one is attempted against you."}],"progressionSteps":["Survive a winter the elders call a culling year, and come out of it angrier than you went in.","Take your first true wound and stand back up before the count of ten.","Let the fury take you once in front of witnesses, and learn its cost when you wake.","Be turned away from the war-band's fire, then follow them anyway until they stop turning you away."]},{"id":"berserker.t2a","name":"Skinbearer","tier":2,"level":10,"parent":"berserker.t1","role":"Feral skirmisher — pursuit and bleed damage","lore":"Some berserkers hear a second heartbeat inside the fury and go looking for its owner. Skinbearers keep the old bargains: meat left at treelines, blood given at solstice, a pelt worn until it stops being a garment. The spirit that answers moves in, and it is always hungry.","playstyle":"Fast, low, and feral. Track wounded targets by scent, open bleeds that punish movement, and let the guest spirit sharpen every sense past human limits.","abilities":[{"name":"Guest Beneath the Skin","desc":"Invite the beast-spirit in: attack speed and movement rise sharply, but you cannot disengage from wounded prey."},{"name":"Borrowed Fangs","desc":"A bite attack that opens a bleed which deepens each time the target moves."},{"name":"Second Scent","desc":"Detect hidden, invisible, and fleeing enemies within sixty paces; bleeding targets cannot break your tracking."},{"name":"Winter Coat","desc":"Grow a dense hide that halves cold damage and shortens every bleed laid on you."}],"progressionSteps":["Reach level 10 and carry a killed beast home whole, wasting nothing; the spirit watches how you treat its kin.","Sleep three nights in an abandoned den without fire, until you dream in smells instead of words.","Cut your palm on a solstice altar and speak the invitation; if something answers, do not flinch."]},{"id":"berserker.t2b","name":"Bloodwader","tier":2,"level":10,"parent":"berserker.t1","role":"Frontline breaker — damage soak, forward pressure","lore":"The marches remember warriors who walked into spear-hedges and came out the far side, annoyed. Bloodwaders court that memory. They learn to drink pain like mead, to keep moving when muscle says stop, and to make of their own body a weight the enemy cannot brace against.","playstyle":"Walk forward through everything. Absorb hits to build momentum, ignore wounds until the fight ends, and be exactly where the enemy least wants you standing.","abilities":[{"name":"Wade the Spears","desc":"Advance at full speed through enemy reach; each hit taken while moving forward grants fury."},{"name":"Shrug the Grave","desc":"Once per battle, reduce a killing blow to a flesh wound and keep swinging."},{"name":"Drunk on Hurt","desc":"Passive: damage taken converts to a stacking damage bonus that decays only outside combat."},{"name":"Landslide Step","desc":"A slow, unstoppable advance that shoves enemies back and cannot be halted by roots, bodies, or fear."}],"progressionSteps":["Reach level 10 and stand in the practice line while five spearmen strike true; walk the field's length before you fall.","Take a wound the healers call mortal, and make them wrong by morning.","Carry a wounded shield-brother out of a rout, walking, without once looking back."]},{"id":"berserker.t3a","name":"Vargr","tier":3,"level":25,"parent":"berserker.t2a","role":"Pursuit striker — single-target attrition hunter","lore":"Named for the outlaw-wolves of the old tongue, Vargr leave the war-band for the long trail. They hunt what others flee: man-eaters, deserter kings, things that walk out of the ice. In three provinces, a Vargr's declaration of hunt is treated as a death already recorded.","playstyle":"Choose one target and end them. Stack pursuit bonuses over days of chase, deny escape and healing, and strike when exhaustion has done half the work.","abilities":[{"name":"Speak the Quarry","desc":"Name a single target; against them you ignore armor thresholds and always know their direction."},{"name":"Tireless Lope","desc":"Travel without rest for days equal to your fury, and arrive at full strength."},{"name":"No Den Deep Enough","desc":"Your quarry gains nothing from stealth, sanctuary, or door wards while you are within a mile."},{"name":"Winter's Patience","desc":"Each day the hunt continues, your first strike against the quarry grows stronger, without cap."}],"progressionSteps":["Reach level 25 and follow a quarry through one full turn of the moon, eating only what the trail gives.","Refuse a hunt once — for coin, for cruelty, for a wrong scent — and be known for the refusal.","Run down something faster than you, and understand that speed was never the point.","Return with proof of the kill that the elders look at once and never again."]},{"id":"berserker.t3b","name":"Urskin","tier":3,"level":25,"parent":"berserker.t2a","role":"Shapeshift bruiser — claws, hide, raw grapple","lore":"The bear-shirt is the oldest rite the marches keep. Urskin let the guest spirit past the skin and into the bone: hands broaden, hide thickens, voice drops below language. They are welcome at fires in the wary way a tame avalanche would be welcome.","playstyle":"Slow, huge, and horribly durable. Shift deeper into beast-shape as the fight lengthens, trading finesse for claws, hide, and a grip nothing slips.","abilities":[{"name":"Bear-Shirt","desc":"Transform: gain claw attacks, doubled carrying strength, and hide that treats all weapons as blunt."},{"name":"Winterhide","desc":"Passive: regenerate steadily in combat; the rate doubles below half health."},{"name":"Red Maul","desc":"An overhead claw blow that crushes shields, breaks grapples, and flattens man-sized foes."},{"name":"Below Language","desc":"While transformed, mind-affecting magic finds nothing in you it can speak to."}],"progressionSteps":["Reach level 25 and wear the raw pelt through a winter, until you cannot say where it ends.","Let the spirit take your hands for one fight, and win it without a weapon.","Winter in a den beside a true bear and leave in spring, unchallenged."]},{"id":"berserker.t3c","name":"Woundtaker","tier":3,"level":25,"parent":"berserker.t2b","role":"Attrition bruiser — converts damage to power","lore":"Where others bind wounds, Woundtakers open accounts. Every cut is entered, remembered, and spent later with interest. Old soldiers recognize the look — a fighter glancing at a fresh wound the way a merchant checks a purse. It unsettles men more than the axe does.","playstyle":"Deliberate attrition. Invite hits you can afford, bank the pain as fury, and out-economy enemies who believe damage dealt means they are winning.","abilities":[{"name":"Open the Ledger","desc":"Begin recording: a portion of all damage taken is stored as spendable fury."},{"name":"Spend the Scar","desc":"Consume stored pain to drive a strike beyond your weapon's normal ceiling."},{"name":"Ask for the Knife","desc":"Willingly take a small wound to end any bleed, poison, or curse; the pain crowds it out."},{"name":"Second Heartbeat","desc":"Passive: below half health, fury generation doubles and your hands stop shaking."}],"progressionSteps":["Reach level 25 and name every scar you carry, in order, without touching them.","Accept a wound in a duel you could have dodged, and win with what it paid.","Go a full campaign without letting a healer close anything you can spend."]},{"id":"berserker.t3d","name":"Breachwright","tier":3,"level":25,"parent":"berserker.t2b","role":"Line-breaker — charge, knockdown, formation collapse","lore":"Sappers dig for weeks; a Breachwright arrives. They study walls the way duelists study opponents — where a gate hinges, where a shield-line breathes — then apply themselves like falling masonry. Siege captains list them in inventories, somewhere between rams and reasons to surrender.","playstyle":"Momentum management. Build speed and mass across the field, spend both on walls, gates, and formations, and never fight standing still.","abilities":[{"name":"Gathering Slope","desc":"Each stride in a straight line stacks momentum, raising damage and knockdown force."},{"name":"Keystone Blow","desc":"Strike a structure's weak point; walls, gates, and shield formations all count as structures."},{"name":"Doorless","desc":"Passive: doors, barricades, and lines of pikemen do not end your charge, merely tax it."},{"name":"Press the Rout","desc":"Enemies you knock down rise slower; enemies who flee you spread fear as they go."}],"progressionSteps":["Reach level 25 and put a shield wall on the ground — the whole wall — before your war-band closes.","Carry the old gate beam from the quarry road to the walls without setting it down.","Walk through a burning granary because it was the shorter way, and be seen doing it."]},{"id":"berserker.t4a","name":"Fangthane","tier":4,"level":40,"parent":"berserker.t3a","role":"Elite hunter — marked-prey execution","lore":"A thane of the long hunt holds no hall. Their oath-torc hangs with a fang from every hunt completed, and no Fangthane's torc has a gap. Kingdoms retain them against horrors, then quietly pray never to earn a place on the torc themselves.","playstyle":"The endgame of pursuit. Bind yourself by oath to impossible quarry, turn their fear into a leash, and close hunts other trackers died beginning.","abilities":[{"name":"Oathmark","desc":"Swear a hunt: you cannot die of wounds while the quarry lives, and it knows you are coming."},{"name":"Fear Is a Scent","desc":"Frightened enemies are revealed, slowed, and take doubled bleed damage from you."},{"name":"Culling Silence","desc":"Your approach mutes sound and warning; sentries notice you only as the strike lands."},{"name":"The Last Mile","desc":"When the quarry falls below quarter strength, gain unstoppable speed and immunity to everything but the quarry itself."}],"progressionSteps":["Reach level 40 and close a hunt that outlasted a season, alone, across a border war.","Have your torc weighed at the gathering of hunters and found without a gap.","Decline a king's price for a hunt, then take the hunt for a reason he cannot buy.","Kill something that had killed a Fangthane, and hang both their fangs together."]},{"id":"berserker.t4b","name":"Ironpelt","tier":4,"level":40,"parent":"berserker.t3b","role":"Immovable shapeshifter — anchor tank, grapples","lore":"An Ironpelt has stopped shifting all the way back. The claws fold, mostly; the hide stays. They den apart from villages that nonetheless leave meat and grievances at the treeline, because an Ironpelt settles both. Whole raiding cultures have rerouted around a single known den.","playstyle":"Anchor the field. Grapple what cannot be cut, endure what cannot be dodged, and regenerate through punishment that erases shield-lines around you.","abilities":[{"name":"Pelt of Iron Winters","desc":"Passive: your hide counts as heavy armor that regenerates and cannot be sundered."},{"name":"Denfather's Grip","desc":"Seize a foe up to horse-size; while held, they take your regeneration as damage."},{"name":"The Long Sleep","desc":"Out of combat, sleep to heal any injury, regrow what was lost, and shed one curse."},{"name":"Treeline Law","desc":"Mark ground as den; within it your grip cannot be broken and your allies cannot be moved."}],"progressionSteps":["Reach level 40 and winter in the open den, sleeping the true sleep, and wake with the pelt grown inward.","Answer a village's grievance without being asked twice, and take payment in meat alone.","Hold a bridge through a cavalry charge, moving nothing but your arms.","Out-grapple the thing the spirit sends to test you, and let it leave alive."]},{"id":"berserker.t4c","name":"Flayed Saint","tier":4,"level":40,"parent":"berserker.t3c","role":"Martyr tank — damage transfer and aura","lore":"The order keeps no relics but skin. Each Saint's scars are read like scripture, a wound-history of battles that should have had no survivors. Soldiers touch their hems for luck and flinch doing it. The Saints bless shield-lines by standing in front of them.","playstyle":"A martyr in the tactical sense. Intercept harm meant for others, convert it to power, and hold ground that has no business holding.","abilities":[{"name":"Give Me Yours","desc":"Transfer any ally's wounds onto your own body; the pain converts to fury at double rate."},{"name":"Litany of Scars","desc":"Recite your wound-history aloud; allies in earshot cannot fear or rout while it continues."},{"name":"Red Absolution","desc":"A blow that grows stronger for every wound currently open on your body."},{"name":"Standing Scripture","desc":"Passive: while you are below half health, allies behind you take less damage and deal more."}],"progressionSteps":["Reach level 40 and let the order read your skin, scar by scar, omitting nothing.","Stand before a shield-line as the volley lands, and take what was meant for all of them.","Refuse the healers three times in one campaign, and outlive the campaign.","Bless a coward with a scar he asked for, and watch him hold the line for it."]},{"id":"berserker.t4d","name":"Towerbane","tier":4,"level":40,"parent":"berserker.t3d","role":"Siege striker — structure and formation destruction","lore":"Fortresses keep two sets of plans: one for war, one for a Towerbane. The elite of the breach-trade end sieges by arriving; garrisons that see the banner — a black keystone on grey — are permitted by long custom to open the gates first.","playstyle":"A one-man siege. Convert momentum into structural collapse, walk out of the rubble, and turn every fallen wall into a road for the army behind you.","abilities":[{"name":"Toll the Gate","desc":"Announce yourself with a single blow to the gate; wood, iron, and defender morale all take it."},{"name":"Rubble Stride","desc":"Collapsing structures deal you nothing; you emerge from debris at full momentum."},{"name":"Read the Masonry","desc":"See every load-bearing weakness in a structure or formation at a glance."},{"name":"Bring Down the Sky","desc":"Topple a tower, arch, or gatehouse onto a chosen area after three uninterrupted blows."}],"progressionSteps":["Reach level 40 and end a siege that had lasted a year, between one dawn and the next.","Take a standing tower down with nothing you did not carry in your two hands.","Be buried in a collapse of your own making, and let them hear you knocking from inside.","Accept the black keystone banner from a Towerbane grown too old to lift it."]},{"id":"berserker.t5a","name":"Wolf of the Long Night","tier":5,"level":60,"parent":"berserker.t4a","role":"Apex predator — inevitable single-target death","lore":"Histories argue whether there has been one or many; the torc suggests one. When the Wolf speaks a name, chroniclers write the death first and the date after. Border tales say winter follows them out of courtesy, and that they have not slept since the oath.","playstyle":"Play inevitability itself. Declared prey cannot heal, hide, or bargain a way out; everything and everyone else on the field is merely in the way.","abilities":[{"name":"Doom Spoken Once","desc":"Name a living thing; it can no longer be healed, resurrected, or hidden by any power."},{"name":"The Long Night","desc":"Draw unnatural dusk across a mile; within it you see everything and your quarry sees only you."},{"name":"The Hunt Remembers","desc":"Inherit the tracking knowledge of every hunter who ever failed against your quarry."},{"name":"No Last Door","desc":"Wards, gates, and other planes do not bar your pursuit, and deaths you deliver cannot be undone."}],"progressionSteps":["Reach level 60 and accept the hunt no gathering will speak aloud.","Follow the quarry past the map's last honest line, and keep the trail through places with no ground.","Kill what history says cannot be killed, and let the chroniclers strike its name.","Come back to the fires, and say nothing, and be believed."]},{"id":"berserker.t5b","name":"First Beast","tier":5,"level":60,"parent":"berserker.t4b","role":"Primal avatar — escalating transformation, zone control","lore":"The eldest spirit — the one that taught wolves hunger and bears winter — does not take guests. It takes a body. Once in an age, an Urskin walks into the high tundra, and what walks out answers no human name, though it still, for its own reasons, defends the fires.","playstyle":"A permanent, deepening transformation. Cycle primal aspects mid-fight, hold ground through sheer presence, and grow stronger the longer the battle forgets to end.","abilities":[{"name":"Shape Before Names","desc":"Cycle three primal aspects — fang, hide, antler — without pause; none can be dispelled or dismissed."},{"name":"The Old Growl","desc":"A subsonic warning: beasts obey, mounts throw riders, and lesser courage simply leaves the field."},{"name":"Blood of the First Winter","desc":"Your blood freezes to armor where it spills; every wound taken thickens it."},{"name":"Den of the World","desc":"All wild ground counts as your den: regeneration for you, fearlessness for allies who stand on it."}],"progressionSteps":["Reach level 60 and climb past the treeline carrying no iron, wearing every pelt you have earned.","Offer the eldest spirit your name, and let it be eaten without asking what remains.","Walk back down in spring on feet that no longer print as human.","Defend one fire without being asked, so the marches know what came back is still theirs."]},{"id":"berserker.t5c","name":"Agonarch","tier":5,"level":60,"parent":"berserker.t4c","role":"Immortal attrition — banked-damage burst","lore":"The Agonarch has died before witnesses — the annals record where, and how often — and returned each time angrier. Pain no longer visits; it pays tribute. Veterans say a battlefield goes quiet when the Agonarch begins counting scars aloud, because everyone present knows a new entry is coming.","playstyle":"Immortal attrition. Bank every point of damage taken across an entire battle, then repay the whole ledger at a moment of your choosing.","abilities":[{"name":"Throne of Scars","desc":"Damage taken is banked instead of killing you; only the ledger's full total can end you."},{"name":"All Debts Called","desc":"Release the banked pain as a single strike or a field-wide shockwave of equal total."},{"name":"Tribute","desc":"Attackers take a share of the pain they deal you, doubled if they flee afterward."},{"name":"The Wound That Rules","desc":"Passive: your wounds close on their own, faster the more enemies can see them."}],"progressionSteps":["Reach level 60 and read your full ledger of scars aloud to the order, one origin at a time, forgetting nothing.","Die before a hundred witnesses, and stand up while they are still deciding to grieve.","Forgive one debt — a single scar, freely — and learn what that mercy costs you.","Walk unarmored into a war and end it by demonstrating what its best blow is worth."]},{"id":"berserker.t5d","name":"Walking Ruin","tier":5,"level":60,"parent":"berserker.t4d","role":"Catastrophe engine — army-scale momentum damage","lore":"Chronicles class them with floods and fire-mountains rather than soldiers, and the insurance canons of three cities agree. A Walking Ruin does not besiege; it schedules. The last one to cross the marches is the reason two duchies now share one very wide road.","playstyle":"Terminal momentum. Accumulate unstoppable mass and speed over an entire battle, and let geography, architecture, and armies resolve themselves around your path.","abilities":[{"name":"The Name Arrives First","desc":"Enemies who learn you are coming begin the battle already shaken; some simply do not attend."},{"name":"Nothing Holds","desc":"Passive: no wall, ward, or formation counts as an obstacle, only as material."},{"name":"Momentum of Ages","desc":"Your momentum no longer decays; each battle begins at the force the last one ended."},{"name":"Terminus","desc":"Stop moving, once per war, and release all gathered momentum as a collapse felt for miles."}],"progressionSteps":["Reach level 60 and cross a kingdom that refused you passage, in a straight line.","Have a fortress surrender to your name while you are still two days away.","End a war by attending it, once, briefly.","Leave one wall standing, deliberately, so the histories know it was a choice."]}]},{"id":"knight","name":"Knight","archetype":"Might","icon":"🛡️","tagline":"The vow outlasts the flesh that swore it.","description":"Every Knight begins the same way: kneeling, speaking words that cannot be unsaid. What follows differs. Some vows shine — a promise to stand between the helpless and the dark until one of them breaks. Others are grimmer bargains, taking curses and sins onto shoulders built to carry them. The armor is incidental. The Knight is whatever the oath, kept long enough, makes of a person.","nodes":[{"id":"knight.t1","name":"Knight","tier":1,"level":1,"parent":null,"role":"Tank — frontline defense, damage mitigation","lore":"Every hold keeps a few: squires who knelt in a cold chapel and rose owning nothing but a promise. A knight-errant of the first vow guards roads, wells, and other people's harvests. Most die unremembered. The rest learn what the vow is for, and what it will eventually cost.","playstyle":"Plant your feet and make the enemy's choices for them. Taunt, intercept, and trade your own health for everyone else's, one blow at a time.","abilities":[{"name":"Sworn Interception","desc":"Dash to an ally within 8 meters and absorb the next attack meant for them, taking 30% reduced damage."},{"name":"Iron Tithe","desc":"Taunt all enemies in melee range for 4 seconds; gain 2% damage reduction per enemy affected."},{"name":"Kneel and Rise","desc":"Once per battle, drop to one knee to block a killing blow, then rise with 20% temporary health."},{"name":"Vow's Edge","desc":"Your strikes deal 15% bonus damage to any enemy currently attacking someone other than you."}],"progressionSteps":["Kneel a full night on chapel stone and speak the First Vow aloud to no one; the words must survive the cold.","Carry a wounded stranger seven miles in your own armor, and take nothing for it.","Stand your first watch on a wall that is attacked, and do not leave your post before relief comes.","Have your shield marked by a sworn knight who has watched you bleed for someone else."]},{"id":"knight.t2a","name":"Oathwarden","tier":2,"level":10,"parent":"knight.t1","role":"Bulwark tank — party-wide mitigation and zoning","lore":"Oathwardens are what garrisons request by name when the dark presses in. They have learned the radiant discipline: that a shield is a wall, a wall is a promise, and a promise held long enough becomes a fact. Villages measure their worth in raids that turned back without a fight.","playstyle":"Anchor the line with wide guard zones and interposed shields. You win by outlasting: every second you hold, the enemy's plan rots a little further.","abilities":[{"name":"Bulwark Litany","desc":"Chant while guarding; allies behind you take 20% less damage for as long as you have not moved."},{"name":"The Turning Hour","desc":"After blocking ten attacks, release a radiant pulse that staggers every enemy engaging you."},{"name":"Shieldmeet","desc":"Lock shields with an adjacent ally to form a two-person wall that cannot be flanked for 6 seconds."},{"name":"Beacon Guard","desc":"Raise your shield overhead; ranged attacks aimed at allies within 5 meters strike you instead."}],"progressionSteps":["Reach level 10, then hold a breach alone until the militia rallies behind you; a single step backward forfeits the trial.","Take the Radiant Oath at dawn before the people you failed to save, and name each of them without flinching.","Reforge your shield with a rim of temple silver and carry it unbloodied through one full season of war."]},{"id":"knight.t2b","name":"Knight Penitent","tier":2,"level":10,"parent":"knight.t1","role":"Sacrificial tank — damage transference, self-attrition","lore":"The Dread Oath is signed, not spoken — in the petitioner's own blood, witnessed by whatever is listening. A Knight Penitent takes what others cannot survive carrying: a widow's curse, a village's plague-fear, a soldier's unforgivable order. The armor grows heavier every year, and none of the added weight is steel.","playstyle":"Pull harm onto yourself deliberately — hexes, wounds, terrors — and convert the accumulating weight into grim endurance and slower, heavier blows.","abilities":[{"name":"Take This From Them","desc":"Transfer one curse, debuff, or wound from an ally onto yourself; gain 5% damage per affliction carried."},{"name":"Grief Iron","desc":"Your armor hardens with each burden you bear, granting stacking damage reduction up to 40%."},{"name":"The Heavier Hand","desc":"A slow overhead blow dealing bonus damage equal to twice the number of burdens you currently carry."},{"name":"Signed in Red","desc":"Once per day, refuse a death: survive at 1 health and accept a permanent burden stack instead."}],"progressionSteps":["Reach level 10 and sign the Dread Oath in your own blood, on a page that already bears ninety-nine names.","Take a dying man's confession and carry his sin a full year without telling a living soul.","Eat the curse laid on a stranger's child, and walk away before the family can thank you."]},{"id":"knight.t3a","name":"Gatesworn","tier":3,"level":25,"parent":"knight.t2a","role":"Anchor tank — chokepoint denial, immovable guard","lore":"A Gatesworn weds a threshold. Some hold a literal gate for decades; others carry a portable arch of blessed stone and declare any doorway theirs. Armies planning a route will pay well to learn where the Gatesworn stand, then plan a different route. Their funerals are held standing up.","playstyle":"Choose the ground and become its law. Enemies pass you only diminished; you are weakest in the open field and monstrous in a doorway.","abilities":[{"name":"Threshold Decree","desc":"Sanctify a doorway or chokepoint; enemies crossing it are slowed 50% and marked for allied attacks."},{"name":"Root of the Arch","desc":"Become immovable: immune to knockback, pulls, and forced movement while standing on ground you have sanctified."},{"name":"None Pass Whole","desc":"Strike freely at any enemy moving through your reach; each hit reduces their damage by 10%."},{"name":"The Long Stand","desc":"For every consecutive minute you do not move, gain 5% block chance, stacking until you step away."}],"progressionSteps":["Reach level 25 and hold the Weeping Gate through a full assault; the count of those who passed you must be zero.","Sleep thirty nights standing armored in the arch you mean to swear to, and do not fall.","Speak your gate's true name; you will only have learned it if the stone has accepted you.","Turn away a king who demanded passage you were sworn to refuse, and survive what follows."]},{"id":"knight.t3b","name":"Lanternshield","tier":3,"level":25,"parent":"knight.t2a","role":"Escort tank — mobile sanctuary, protective auras","lore":"Where the Gatesworn hold ground, Lanternshields move it: refugees through night country, pilgrims through plague towns, children out of cities already burning. Each carries a consecrated flame in the shield's boss that has never gone out. It is said the dark itself follows a Lanternshield at a respectful distance.","playstyle":"Herd the vulnerable inside your light and keep the column moving. You fight walking backward, shield high, always the last one through.","abilities":[{"name":"The Carried Flame","desc":"Your shield casts a 6-meter light; allies inside are immune to fear and take 15% less damage."},{"name":"Rearguard Psalm","desc":"While withdrawing from combat, you and escorted allies gain 25% movement speed and cannot be slowed."},{"name":"Shepherd's Rebuke","desc":"Slam your shield to blind every enemy that entered your light this turn, driving them back 4 meters."},{"name":"No One Left","desc":"Pull a downed ally instantly into your light and stabilize them; usable once per encounter."}],"progressionSteps":["Reach level 25 and lead a hundred souls through the Hollowing Fen by night, losing none. Not one.","Kindle your shield's flame from a temple hearth and keep it burning through storm, river, and battle for a year.","Walk into a plague quarter no priest will enter, and carry out whoever still breathes.","Refuse payment three times from people who owe you their lives; the flame dims for those who profit by it."]},{"id":"knight.t3c","name":"Hexdrinker","tier":3,"level":25,"parent":"knight.t2b","role":"Attrition tank — curse absorption and conversion","lore":"Hexdrinkers apprentice under witch-scarred elders, learning to open the body like a door and invite the curse inside. Their veins darken; their shadows misbehave. Cursed villages send for them the way other villages send for physicians, and pay in advance, since a Hexdrinker's gratitude is a complicated thing to hold.","playstyle":"Seek out the worst magic on the field and drink it. Each swallowed hex disfigures you and empowers you in equal measure.","abilities":[{"name":"Open the Vein","desc":"Draw an active curse, hex, or damaging field into your body, ending its effect and gaining a Draught stack."},{"name":"Blackblood Riposte","desc":"Spend a Draught to lash out with the stolen curse, afflicting your attacker with exactly what you swallowed."},{"name":"Scar Ledger","desc":"Each permanent curse scar grants 3% resistance to all magic, recorded visibly on your skin."},{"name":"The Third Swallow","desc":"At three Draughts your strikes apply a decaying weakness; at five, you begin to hear the curses speak."}],"progressionSteps":["Reach level 25 and drink your first named curse from a witch-elder's cup, knowing she will not tell you which one.","Carry a plague-hex through a crowded city without letting it leap to a single soul, though it begs you in your own voice.","Map the scars on your body and recite what each one spared, without error, before the Penitent conclave.","Refuse the one curse you are not yet ready for. Knowing which one it is constitutes the trial."]},{"id":"knight.t3d","name":"Black Confessor","tier":3,"level":25,"parent":"knight.t2b","role":"Dread vanguard — fear control, condemned execution","lore":"Black Confessors hear what the dying cannot say to priests, and carry it so the dead may travel light. Where law fails, they execute the condemned themselves, the sin passing into the Confessor at the killing stroke. Towns are quieter after one leaves. So, forever after, is the Confessor.","playstyle":"Fight under a mounting weight of borrowed guilt that terrifies enemies and fuels merciless finishing blows. Isolate the guilty, judge, and end it.","abilities":[{"name":"Last Rites","desc":"Mark an enemy Condemned; your attacks against them cannot be blocked, and their allies flee the killing blow."},{"name":"Litany of the Carried","desc":"Recite the sins you bear; enemies within earshot suffer fear and drop their guard for 5 seconds."},{"name":"Absolving Stroke","desc":"Execute a Condemned enemy below 30% health, absorbing their sin as a Grief stack that empowers your next mark."},{"name":"Weight Made Wrath","desc":"Convert all Grief stacks into a single strike dealing damage for every confession you have ever carried."}],"progressionSteps":["Reach level 25 and hear the deathbed confession of a man you hate, then bury him gently and tell no one.","Carry out one lawful execution the town's own headsman refused, and stay to dig the grave.","Sit vigil beside a mass grave until you can name the sin that filled it, then take that sin as your own.","Let a guilty man you could have judged walk free, because judgment was not yours that day."]},{"id":"knight.t4a","name":"Warden of the Last Door","tier":4,"level":40,"parent":"knight.t3a","role":"Siege anchor — unbreakable line, threshold command","lore":"The Order of the Last Door keeps the thresholds that must never open: sealed crypt-gates, breachways to the deep dark, the doors kingdoms pretend they do not have. Each Warden knows only their own door and one other's, so no captured mind can unmake the whole. Relief never comes; it is never requested.","playstyle":"Not a defender but a fact of architecture. Project fields of absolute denial, punish anything that tests the line, and never, ever be lured out.","abilities":[{"name":"The Door Holds","desc":"While you stand within a sanctified threshold, enemies beyond it cannot reduce you below 1 health."},{"name":"Masonry of Will","desc":"Raise a 10-meter rampart of force with your health and your stubbornness; it stands for 20 seconds."},{"name":"Toll of Passage","desc":"Every action an enemy takes inside your threshold costs them 5% of their maximum health."},{"name":"Bar the Door","desc":"Slam your door: hurl all enemies out of the threshold and lock it against them for 12 seconds."}],"progressionSteps":["Reach level 40 and be summoned; no one petitions the Last Door. The Order watches, and the Order writes to you.","Hold a nameless door for a year against something that knocks politely every midnight, and never once answer.","Learn your predecessor's fate from the scratches on the inside of the door, and take the post anyway.","Swear the Warden's silence: you will tell no one what you guard, including yourself, in dreams."]},{"id":"knight.t4b","name":"Dawnward","tier":4,"level":40,"parent":"knight.t3b","role":"Radiant guardian — mass aegis, battlefield deliverance","lore":"Dawnwards carry morning into places that have forgotten it — mines gone wrong, cities under endless eclipse, the marches where night stopped ending. Their number is never more than twelve. When a Dawnward's flame enters a dark that has held for years, things with long patience finally learn what waiting costs.","playstyle":"Project overwhelming sanctuary: vast light-fields, mass shields, allies dragged back from the brink. Your presence rewrites what the dark is permitted to do.","abilities":[{"name":"Borrowed Morning","desc":"Ignite a 20-meter field of daylight for 15 seconds; creatures of darkness within it lose all damage bonuses."},{"name":"Aegis Unnumbered","desc":"Grant every ally standing in your light a shield equal to 25% of your maximum health."},{"name":"The Waking Word","desc":"Speak the old word for dawn; all downed allies in your light rise with a third of their health."},{"name":"Eclipse Debt","desc":"Damage prevented by your shields accumulates; release the total as a cone of searing light."}],"progressionSteps":["Reach level 40 and carry your flame into the Sunless March, where it will either die or become something else.","Stand where dawn has not come in living memory, and hold your light aloft until it does.","Give your flame to a dying Dawnward's shield and receive theirs; twelve there are, and twelve there must remain.","Learn the old word for morning in the tongue the dark still fears, from the only mouth that remembers it."]},{"id":"knight.t4c","name":"The Leaden Chalice","tier":4,"level":40,"parent":"knight.t3c","role":"Curse vessel — sealed affliction arsenal","lore":"When a curse is too great to break — a king's bloodline blight, a battlefield that will not stop screaming — it is given to a Leaden Chalice to hold. Their bodies are engraved with binding scripture; their footsteps are recorded in three separate archives. They are venerated, escorted, and never, ever touched.","playstyle":"Walk the field as a sealed arsenal. Endure almost anything passively, and choose with great care the moment to crack a seal and let one horror out on your terms.","abilities":[{"name":"Sealed Scripture","desc":"Each Great Curse you carry radiates dread; enemies who strike you risk brief affliction by what leaks through."},{"name":"Crack the First Seal","desc":"Release one carried curse in a 12-meter burst, afflicting all enemies with its original, unweakened form."},{"name":"Leaden Skin","desc":"Your engraved flesh reflects 30% of magical damage back upon the caster as raw curse."},{"name":"The Weight Rests","desc":"Kneel and go inert for 6 seconds: untargetable and immovable while your seals fully restore."}],"progressionSteps":["Reach level 40 and accept a Great Curse no circle of nine could break, sealed beneath your own engraved skin.","Endure the Scriving: a year of binding scripture cut into you, one verse each dawn, none taken under mercy of drink.","Walk to a war and stand between the armies until both remember what you carry. Then go home.","Name your successor and begin their scars yourself, for the curses must never be left ownerless."]},{"id":"knight.t4d","name":"Dolorous Guard","tier":4,"level":40,"parent":"knight.t3d","role":"Terror arbiter — judgment burst, morale ruin","lore":"The Dolorous Guard number whatever the age requires. They arrive uninvited wherever a realm's sin has grown too heavy — a massacre unpunished, a treaty signed in children's blood — and take the weight by force of judgment. Kings do not welcome them. Kings also do not stop them. No one does.","playstyle":"Enter the field as a verdict. Break enemy morale in waves, isolate the guiltiest, and deliver executions that make the survivors lay down arms.","abilities":[{"name":"The Arrival","desc":"Your first appearance in battle forces every enemy to check morale; the guilty are revealed and Marked."},{"name":"Sentence Pronounced","desc":"Declare a Marked enemy's sin aloud; they take 40% increased damage from all sources for 10 seconds."},{"name":"Iron Requiem","desc":"Advance slowly and unstoppably; each step releases carried griefs as waves of terror that break formations."},{"name":"Take the Kingdom's Weight","desc":"Absorb a battlefield's collective guilt: massive Grief stacks, at the cost of reduced maximum health until dawn."}],"progressionSteps":["Reach level 40 and judge a crowned head before its own court, carrying every sin you name out of the hall.","Bear the massacre of Cold Hollow for a decade; the Guard will weigh you by how quietly you carry it.","Be feared correctly: let a burning village's raiders surrender at the mere sound of your approach.","Give judgment against a member of the Guard itself, and be the one who carries what they carried."]},{"id":"knight.t5a","name":"The Unfallen","tier":5,"level":60,"parent":"knight.t4a","role":"Mythic bastion — absolute lockdown, undying stand","lore":"Histories disagree on whether the Unfallen is one knight or a title passed down a chain of doors. What the sieges agree on: somewhere there is a threshold that has never been crossed, and a figure in fused armor who has not sat down in a hundred years. Armies route around the legend.","playstyle":"Cease to be a combatant and become terrain. Nothing crosses your line, nothing moves in your presence uninvited, and nothing kills what stands behind you.","abilities":[{"name":"Terminal Threshold","desc":"Declare a line; for 30 seconds no enemy, projectile, or spell crosses it while you draw breath."},{"name":"The Standing Century","desc":"You cannot die while holding your ground; lethal damage instead petrifies armor plates, shed when the battle ends."},{"name":"Stone Remembers","desc":"Every foe your line has ever stopped adds a permanent sliver to your block; the total no longer fits in ledgers."},{"name":"Let Them Break","desc":"Reflect one siege-scale attack in full back along its path, unmaking whatever engine sent it."}],"progressionSteps":["Reach level 60 and hold your door through the Sundering Siege; the histories will record that it did not open, and not your name.","Outlast the thing that knocks: when midnight comes and no knock follows, your watch has changed something.","Let your armor fuse. A smith will offer to cut you free, once, and the refusal is the rite.","Be mistaken for a statue by the pilgrims who come to see you, and permit it."]},{"id":"knight.t5b","name":"The Last Lantern","tier":5,"level":60,"parent":"knight.t4b","role":"Mythic sanctuary — inviolable light, mass deliverance","lore":"Doctrine holds that when the final light in the world gutters, one flame will remain, carried on a shield. Refugee songs in twenty tongues describe the same figure at the rear of the column, walking backward, the dark keeping its distance like a whipped animal. No song describes them arriving. Only leaving last.","playstyle":"Your light is sanctuary in law and in fact: absolute protection for everyone within it, and a slow, patient sentence for whatever waits outside.","abilities":[{"name":"Sanctum Absolute","desc":"Allies in your light cannot be targeted, cursed, or frightened; the radius grows with each soul it shelters."},{"name":"The Long Walk Home","desc":"Escorted allies leave no tracks, feel no cold, and heal steadily so long as the column keeps moving."},
