{"name":"Undimmed","desc":"Your flame cannot be extinguished by any means yet recorded; each attempt blinds the attacker for 8 seconds."},{"name":"Dawn Called Early","desc":"Once per day, summon true daylight for one full minute, regardless of hour, depth, or curse."}],"progressionSteps":["Reach level 60 and walk the Night That Stayed from edge to edge, gathering everyone still alive inside it.","Bring your column home with more souls than you set out with, and account for each addition.","Set your flame against the oldest dark and do not blink. The witnesses say the dark blinked.","Be sung of in a tongue you have never heard, by people you never reached; the light travels further than you do."]},{"id":"knight.t5c","name":"The Hollow Grail","tier":5,"level":60,"parent":"knight.t4c","role":"Mythic vessel — curse singularity, cataclysmic release","lore":"Scholars argue whether the Hollow Grail is a knight or a containment. Both are true. One vessel in an age drinks past the ninety-ninth seal and does not burst; what remains walks, speaks courteously, and holds enough bottled ruin to end a continent. Nations keep certain treaties specifically to avoid disturbing it.","playstyle":"Carry apocalypse politely. Overwhelming passive dread, near-total immunity to magic, and the option — never yet fully taken — of opening every seal at once.","abilities":[{"name":"Ninety-Nine Seals","desc":"You carry the great curses of an age; hostile magic cast near you is drawn in and simply kept."},{"name":"A Sip Returned","desc":"Pour a single measure from one seal onto an enemy; the affliction is centuries stronger than when it was bottled."},{"name":"The Quiet Brim","desc":"Lesser enemies cannot bring themselves to strike you; those who manage it are cursed by proximity alone."},{"name":"Grail Overturned","desc":"Open every seal at once. The codex does not record the effects, only the names of the craters."}],"progressionSteps":["Reach level 60 and drink the hundredth curse, the one every Reliquary before you refused, and remain courteous.","Sit in the treaty hall while nations negotiate around your silence; understand that your presence is the peace.","Hear all ninety-nine speak at once and answer none of them, for a year and a day.","Choose, daily, not to overturn. The histories call this the longest vigil, and it is the whole of the rank."]},{"id":"knight.t5d","name":"The Nameless Vow","tier":5,"level":60,"parent":"knight.t4d","role":"Mythic reckoning — inevitable judgment, terror incarnate","lore":"Somewhere the weight of every carried sin passes a threshold, and the knight beneath it stops being anyone. The Nameless Vow has no face witnesses agree upon, no grave, no beginning. It is what arrives when a wrong has grown too vast for courts, gods, or armies — and kneels to lift it.","playstyle":"You are the last consequence. Unstoppable advance, absolute terror, and judgments that end wars because no one present dares be found guilty.","abilities":[{"name":"The Unspoken Sentence","desc":"Enemies who witness your judgment of another must flee, surrender, or share the sentence."},{"name":"No Face, All Doors","desc":"You cannot be scried, ambushed, or barred; guilt is a door, and everyone has one."},{"name":"Kneel to Lift It","desc":"Absorb a calamity-scale wrong whole — a razed city's grief, a broken god's oath — and rise armored in it."},{"name":"The Vow Outlasts","desc":"On death, the Vow does not end; it stands the body back up and finishes the judgment first."}],"progressionSteps":["Reach level 60 and take up a sin so vast the carrying erases you; your name goes first, and you let it.","Judge a god's broken oath and make the judgment hold; the priesthoods will deny this happened, forever.","Walk out of every history that recorded you; the Dolorous Guard's own archive keeps an empty page in your honor.","Answer, when the last wrong asks who bears it now: no one does. And mean it."]}]},{"id":"rogue","name":"Rogue","archetype":"Cunning","icon":"🗡️","tagline":"Fair fights are for the buried.","description":"Born to alleys and taught by hunger, the Rogue learned that honor is a luxury of the well-fed. Locks open at a touch, lies sit easy on the tongue, and every shadow between two lamps is a door. Whether death arrives in a cup of wine or a city's crown vanishes overnight, somewhere a Rogue was paid — and no one saw a thing.","nodes":[{"id":"rogue.t1","name":"Rogue","tier":1,"level":1,"parent":null,"role":"Melee skirmisher — opportunistic strikes and escapes","lore":"Every city breeds them: the quick-fingered children who learn doors before letters and knives before prayers. Most die young or hang younger. The ones who last become Rogues — not by ceremony, but by the quiet arithmetic of surviving one more winter than the trade usually allows.","playstyle":"Strike from angles nobody watches, take what the moment offers, and be gone before the cry goes up. Positioning is everything; standing still is death.","abilities":[{"name":"Gutter Footwork","desc":"Moving through enemy spaces provokes no reactions; gain bonus evasion for one round after disengaging."},{"name":"First Cut","desc":"Attacks against foes unaware of you deal doubled weapon damage."},{"name":"Nimble Fingers","desc":"Pick a lock, lift a purse, or palm an object as a free action once per turn."},{"name":"Alley Instinct","desc":"Sense hidden exits, tripwires, and watching eyes within thirty feet."}],"progressionSteps":["Survive a winter in the gutters of a city that does not know your name.","Steal your first meal without waking the dog, the watchman, or your conscience.","Learn the rooftop roads until you can cross the ward blindfolded in rain.","Take a beating meant for a friend, and learn which debts are worth carrying."]},{"id":"rogue.t2a","name":"Whisperknife","tier":2,"level":10,"parent":"rogue.t1","role":"Melee striker — single-target ambush burst","lore":"The guilds mark the difference between a cutpurse and a Whisperknife the way farmers mark the difference between a fox and a wolf. These are rogues who accepted the trade's oldest contract: that some deaths are bought, and the buyer never hears the sale close.","playstyle":"Study the target, choose the hour, land one silent strike that ends the conversation. Patience before violence; the fight you avoid is the one you win.","abilities":[{"name":"Hushed Steel","desc":"Kills made from stealth produce no sound and leave you hidden."},{"name":"Vein Map","desc":"Study a target for one round to learn its weakest point, increasing your next critical strike's damage."},{"name":"Nightshade Coat","desc":"Coat a blade with a minor toxin that dulls the victim's reflexes for three rounds."},{"name":"Second Rooftop","desc":"After a killing strike, immediately move half your speed without being tracked."}],"progressionSteps":["Reach level 10, then bring the guild proof of a killing no watchman ever recorded.","Spend seven nights learning one stranger's habits, and never once be seen learning them.","Refuse a contract that smells wrong, and survive what the refusal costs you.","Bury your practice blade with the name you were born under."]},{"id":"rogue.t2b","name":"Velvet Hand","tier":2,"level":10,"parent":"rogue.t1","role":"Utility infiltrator — deception, evasion, acquisition","lore":"Velvet Hands are the ones fences greet by their working names and magistrates by their false ones. They have stopped stealing to eat and started stealing to matter — a signet here, a letter there, until half the ward owes them a favor it cannot name.","playstyle":"Talk your way through the front door and pick your way through the rest. Every guard has a price, every lock a temper, every mark a vanity.","abilities":[{"name":"Borrowed Face","desc":"Assemble a convincing disguise in one minute; casual observers cannot penetrate it."},{"name":"Featherlift","desc":"Take a carried item from a person without triggering alarm, notice, or magical wards of lesser order."},{"name":"Tumbler's Ear","desc":"Open mundane locks at double speed by hearing the mechanism's flaw through the metal."},{"name":"Small Debts","desc":"Once per day, call in a favor: a door unbarred, a rumor planted, a witness gone traveling."}],"progressionSteps":["Reach level 10, then sell the same forged deed to two collectors in a single evening.","Enter a guildhouse through the front door under a name you invented that morning.","Empty a strongbox and leave something behind, so the owner doubts the theft for a year.","Learn who actually runs your ward, then do them one favor they never asked for."]},{"id":"rogue.t3a","name":"Cupbearer","tier":3,"level":25,"parent":"rogue.t2a","role":"Damage-over-time specialist — poisons and slow ruin","lore":"Cupbearers serve at high tables under honest names, and the great families pretend not to know why certain rivals sicken after certain feasts. Their craft is chemistry and etiquette in equal measure: knowing which vintage hides bitterness, and which lord tastes his wife's cup first.","playstyle":"Kill slowly and from a distance of days. Layer toxins, watch the symptoms bloom, and be provably elsewhere when the physicians finally give up.","abilities":[{"name":"Patient Vintage","desc":"Administer a poison that lies dormant for hours before its first symptom shows."},{"name":"Bitter Pairings","desc":"Combine two toxins in one dose; victims suffer both effects and resist neither."},{"name":"Physician's Shadow","desc":"Identify any poison, antidote, or dosage by taste, scent, or symptom alone."},{"name":"The Kind Cup","desc":"Feign administering an antidote to gain a target's trust; the dose deepens the affliction instead."}],"progressionSteps":["Reach level 25 and grow your own garden of banes, from smuggled seed to steeped extract.","Serve one full season in a great house, and leave with its kitchen keys copied.","Drink a measured dose of your own work each dawn until your body forgives it.","End a man at a feast of two hundred, then stand mourning at his funeral unsuspected."]},{"id":"rogue.t3b","name":"Anatomist","tier":3,"level":25,"parent":"rogue.t2a","role":"Precision striker — critical single-target execution","lore":"Anatomists buy corpses the way scholars buy books, and for the same reason. They can name every gate in the body where life enters and leaves, and price the toll of each. Their contracts specify not merely a death, but its exact posture, expression, and hour.","playstyle":"One approach, one strike, one exit. Everything else is preparation: study the body, script the moment, and never improvise unless the improvisation was rehearsed.","abilities":[{"name":"Chart of Gates","desc":"Ignore all armor when striking the vital points of a studied target."},{"name":"Stillwork","desc":"Hold perfectly motionless for hours; detection magic reads you as furniture, not flesh."},{"name":"Measured Thrust","desc":"Your first strike against an unaware target is always a critical hit."},{"name":"Clean Table","desc":"Kills leave no blood spray, struggle, or forensic sign; the scene reads as natural."}],"progressionSteps":["Reach level 25 and map the body's twelve fatal gates, on subjects both dead and living.","Study under a barber-surgeon by day for one year, and let him praise your gentle hands.","Take a contract specifying that the victim smile at death, and deliver it as written.","Stand close enough to touch your mark for an evening, then leave without striking, because the contract said Thursday."]},{"id":"rogue.t3c","name":"Nightlatch","tier":3,"level":25,"parent":"rogue.t2b","role":"Stealth infiltrator — mobility and objective seizure","lore":"Nightlatch is a working name passed between second-storey artists of a certain calibre — those who treat locked as an opinion and guarded as a scheduling problem. The insurers of noble vaults keep a private list of everyone suspected of holding the title; the list is itself stolen most years.","playstyle":"Case the target for a week, then move through it like water finding a crack. Fight nothing you can climb past; take only what was named.","abilities":[{"name":"Opinion of Locks","desc":"Open any mundane lock by touch; magical locks take one quiet minute."},{"name":"Cat's Covenant","desc":"Climb sheer surfaces at full speed and fall forty feet without a sound or a bruise."},{"name":"Weightless Step","desc":"Cross pressure plates, brittle tiles, and alarm strings without triggering them."},{"name":"The Named Thing","desc":"Concentrate on a described object to sense its bearing within a hundred paces."}],"progressionSteps":["Reach level 25 and take a named jewel from a vault its maker called perfect.","Spend a night inside a mark's bedchamber and take nothing, to prove appetite obeys you.","Return something you stole years ago, unseen, to a house that has since doubled its guards.","Leave your calling knot on the magistrate's own strongbox, tied from the inside."]},{"id":"rogue.t3d","name":"Intelligencer","tier":3,"level":25,"parent":"rogue.t2b","role":"Support controller — secrets, misdirection, leverage","lore":"Intelligencers deal in the only currency that never debases: what people would pay to keep unknown. Their archives are memorized, their informants unaware they inform, and their prices denominated in futures — a vote, a silence, a door left off the latch.","playstyle":"Win fights by knowing which fights are scheduled. Gather secrets, sell misdirection, and enter every room already knowing who inside it is lying.","abilities":[{"name":"Ear in the Wall","desc":"Nominate a location you have visited; learn the substance of conversations held there each day."},{"name":"False Ledger","desc":"Plant a document, rumor, or remembered meeting that survives professional scrutiny."},{"name":"Read the Room","desc":"Learn each visible creature's strongest current desire and most recent lie."},{"name":"Denominated in Futures","desc":"Trade a secret to a willing creature for a favor that is magically owed."}],"progressionSteps":["Reach level 25 knowing one true secret about every member of the ward council.","Sell the same secret to three buyers, priced by what each feared it meant.","Cultivate an informant for a year who believes, to this day, that you are the informant.","Predict a riot to the hour, and be paid once for the warning and once for the cause."]},{"id":"rogue.t4a","name":"Hemlock Deacon","tier":4,"level":40,"parent":"rogue.t3a","role":"Attrition assassin — stacking toxins and denial","lore":"The Deacons of Hemlock keep no temple, but they keep a doctrine: that some lives are questions only a quiet chemistry can answer. Kingdoms retain one the way they retain a headsman — rarely spoken of, precisely paid, and consulted only when law has run out of instruments.","playstyle":"Turn whole rooms, wells, and households into instruments. Your poisons stack across days; the enemy is losing the battle before they know one has begun.","abilities":[{"name":"Doctrine of Draughts","desc":"Your toxins ignore purification of a lesser order; only true miracles cleanse them."},{"name":"Congregation of Symptoms","desc":"Foes poisoned by you spread your affliction to allies they touch."},{"name":"Clean Departure","desc":"Touch a dying victim to erase every trace of the compound from flesh and record."},{"name":"Tithe of Breath","desc":"Each foe your poisons fell restores your vigor and quickens your hands for one minute."}],"progressionSteps":["Reach level 40, then wait to be summoned; no one applies to the Hemlock, and it watches longer than you have been alive.","Compound a bane no living apothecary can name, and register its antidote with no one.","Poison a well and cure it by morning, to prove the doctrine is choice, not appetite.","Refuse a crown's gold once, so every crown afterward knows your price is not money."]},{"id":"rogue.t4b","name":"Heartstiller","tier":4,"level":40,"parent":"rogue.t3b","role":"Burst executioner — traceless one-strike eliminations","lore":"A Heartstiller's work is diagnosed, never witnessed: hale men who sat down mid-sentence and did not stand again. Physicians call it a failing of the heart, and are correct. The guild lends them out at the price of a warship, and only ever singly.","playstyle":"Erase the distance, land the one touch that matters, and be a rumor before the body cools. Burst without noise; commitment without trace.","abilities":[{"name":"Stopped Clock","desc":"A precise strike halts the heart; the victim dies without sound, wound, or spell-scar."},{"name":"Between Heartbeats","desc":"Move your full speed as a blur that mundane eyes cannot track."},{"name":"Grave Composure","desc":"Slow your own pulse to feign death or pass wards that detect the living."},{"name":"Sentence Unfinished","desc":"If your first strike kills, make a second strike against one witness within reach."}],"progressionSteps":["Reach level 40 and still a bull's heart with two fingers, before witnesses sworn to the guild.","Kill a man in a locked room, and let three courts rule it a natural death.","Slow your own heart until the physicians pronounce you, and hear which colleagues weep.","Decline a contract worth a warship because the mark deserved better; the guild must fear your judgment more than your blade."]},{"id":"rogue.t4c","name":"The Keyless","tier":4,"level":40,"parent":"rogue.t3c","role":"Elite infiltrator — total bypass and extraction","lore":"The Keyless take their name literally: initiates surrender every key they own into the order's furnace, a promise that nothing will ever again be opened the easy way. Treasurers speak of them the way sailors speak of weather. Some vaults now hold only decoys, on actuarial advice.","playstyle":"Nothing built keeps you out; the job is choosing which impossibility pays. Ghost through wards, unpick miracles, and vanish carrying the exact weight you came for.","abilities":[{"name":"Unbarred","desc":"Once per day, pass a locked door, ward, or seal as if it stood open."},{"name":"Inventory of Ghosts","desc":"Glance at a room and know every hidden compartment, false panel, and counterfeit within it."},{"name":"Toll Refused","desc":"Magical traps and alarms fail to register you as a creature at all."},{"name":"Six-Pocket Exit","desc":"Declare an exit route when a job begins; while on it, nothing slows you below full speed."}],"progressionSteps":["Reach level 40, then rob a sitting Keyless and return the prize with your admission letter inside.","Take a relic from a temple whose god was watching, and leave the god uncertain.","Walk out of the kingdom's inescapable prison twice: once as proof, once as a favor.","Retire an honest locksmith with an anonymous fortune; the order pays its respects to worthy adversaries."]},{"id":"rogue.t4d","name":"Undercrown","tier":4,"level":40,"parent":"rogue.t3d","role":"Battlefield manipulator — proxies, favors, command","lore":"Every great city has two governments, and the honest one meets in daylight. An Undercrown holds the other: fences, beggar-lines, watch-sergeants on quiet retainers, dock tallies that round in particular directions. Kings negotiate with them through intermediaries and record the payments as sanitation.","playstyle":"Fight with other people's hands. Spend favors like arrows, turn the enemy's hirelings, and shape every encounter three moves before it starts.","abilities":[{"name":"Quiet Retainers","desc":"In any settlement, summon armed assistance within minutes; someone nearby was already yours."},{"name":"The Rounding Error","desc":"Skim resources from any organization you have infiltrated; its own auditors defend the numbers."},{"name":"Turned Coat","desc":"Offer a visible enemy hireling a better deal mid-combat; morale decides the rest."},{"name":"Sanitation","desc":"Erase an event from a city's official memory: records altered, witnesses paid, ballads rewritten."}],"progressionSteps":["Reach level 40 holding debts from a magistrate, a dock-guild, and at least one honest priest.","End a gang war with three dinners and no funerals, and let both sides claim the victory.","Be robbed publicly, then have the goods returned with an apology before the story spreads.","Turn a crown tax collector into your most reliable expense."]},{"id":"rogue.t5a","name":"Mithridate","tier":5,"level":60,"parent":"rogue.t4a","role":"Mythic plague-blade — inevitable attrition","lore":"Histories record perhaps four Mithridates, and dispute two. They are the poisoners whom poison abandoned: bodies steeped so long in bane that venom greets them as kin. Emperors have kept one imprisoned as a living antidote, and buried food-tasters who claimed the title falsely.","playstyle":"You are immune to affliction and made of it. Wade through your own miasma, let enemies rot standing, and outlast anything that has blood.","abilities":[{"name":"A Thousand Draughts","desc":"You are immune to all poisons and diseases; imbibing venom heals you instead."},{"name":"Blood of the Bane-Eater","desc":"Your blood is a lethal contact toxin; creatures that wound you in melee are poisoned."},{"name":"Breath of the Garden","desc":"Exhale a lingering miasma that fills a chamber and drifts obedient to your steps."},{"name":"The Long Answer","desc":"Mark a target; no rest, cure, or prayer removes your toxin until you die or relent."}],"progressionSteps":["Reach level 60 having drunk, in measured communion, every bane recorded in the guild's black herbal.","Survive your own funeral: let the trade bury you poisoned, and walk out of the tomb.","Unmake a plague you did not author, so history cannot decide whether to curse you.","Let a king's tasters kneel to you as the antidote of last resort, and refuse the pension."]},{"id":"rogue.t5b","name":"Hush of Crowns","tier":5,"level":60,"parent":"rogue.t4b","role":"Mythic executioner — unstoppable single elimination","lore":"Dynasties keep a private word for the Hush, and do not write it down. When succession stalls or a tyrant outlives every honest remedy, the word is spoken once, into a particular dark. No Hush has ever been caught, tried, described, or proven to exist twice.","playstyle":"You are the ending other assassins pray to. Choose a name, cross any distance of guards and wards, and close the sentence history left open.","abilities":[{"name":"The Spoken Name","desc":"Mark a named target; you always know their direction, distance, and degree of fear."},{"name":"No Witness","desc":"Creatures who see you kill forget the seeing; records of the moment fade within a day."},{"name":"Regicide's Patience","desc":"Keep a sleepless, foodless vigil for seven days; while vigilant, you cannot be surprised or scried."},{"name":"The Perfect Hour","desc":"Once a season, declare one strike unavoidable: it ignores armor, wards, luck, and prophecy."}],"progressionSteps":["Reach level 60 with a ledger of endings no two kingdoms can agree really happened.","End a tyrant that three usurpers, two armies, and one god had failed to reach.","Let the guild that trained you conclude, from the evidence, that you never existed.","Hear your work blamed on plague, treason, and heaven — and correct no one."]},{"id":"rogue.t5c","name":"Moontaker","tier":5,"level":60,"parent":"rogue.t4c","role":"Mythic phantom — untouchable objective theft","lore":"One autumn night, in the year the ballads argue about, the moon did not rise, and the pawnshops of seven cities refused all silver. The Moontaker is whoever holds the title's proof: a theft so far beyond dispute that the world simply revised its ledgers.","playstyle":"Steal concepts as easily as coin. Objectives simply come to be in your hand, and guards remember doors that were never built.","abilities":[{"name":"The Reflected Moon","desc":"Once per year, steal something abstract: a name, a flag's color, one night's moonrise."},{"name":"Already Gone","desc":"When detected, retroactively be somewhere else you could plausibly have reached this round."},{"name":"Every Door Owed","desc":"All doors, gates, and bridges in a city recognize you and open; none remember doing so."},{"name":"Provenance","desc":"Any object you hold for a full day believes it has always been yours; so do its wards."}],"progressionSteps":["Reach level 60 with a collection no vault could hold, because half of it is not things.","Steal the moon's reflection from every still water in a province for one full night.","Take the coronation crown mid-ceremony and return it before the arch-priest finishes the blessing.","Have the insurers of seven cities jointly petition the gods about you, and be declined."]},{"id":"rogue.t5d","name":"The Rumor","tier":5,"level":60,"parent":"rogue.t4d","role":"Mythic puppeteer — total unseen orchestration","lore":"Scholars can prove the Rumor only by absences: treaties with a signature space left blank, portraits with one figure painted over, wars that ended for no recorded reason. Whoever holds the rank owns favors from people who have never heard of them, which is the point.","playstyle":"You have no face enemies can learn. Act through cutouts and coincidences; by the time anyone suspects a design, the design has already retired.","abilities":[{"name":"Redaction","desc":"Remove yourself from a scene retroactively; all memory, record, and divination of your presence goes blank."},{"name":"The Standing Favor","desc":"Once per month, anything mortal hands could plausibly have arranged simply has been."},{"name":"Author of Coincidence","desc":"Script an accident up to a day ahead: a slipped axle, a misdelivered letter, a guard's fever."},{"name":"Blank Signature","desc":"Contracts, curses, and prophecies cannot bind you; your name-space in them stays empty."}],"progressionSteps":["Reach level 60, then burn every record that you reached any level at all.","End a war with one forged letter, and let two historians duel over which general wrote it.","Own the debts of an emperor who has never heard any of your names.","Be erased so completely that this codex entry is, officially, a printer's error."]}]},{"id":"ranger","name":"Ranger","archetype":"Cunning","icon":"🏹","tagline":"Where the maps end, the Ranger begins.","description":"Where the last road frays into deer-trail, the Ranger keeps walking. Reared on the wild borders, they read wolf-sign like scripture and trust a bowstring further than any oath. Villages hire them to find what wandered too far; kingdoms hire them to learn what is coming. They survive where maps end, and they bring back those who should not have gone.","nodes":[{"id":"ranger.t1","name":"Ranger","tier":1,"level":1,"parent":null,"role":"Ranged skirmisher — traps and attrition","lore":"Rangers begin as border children who noticed too much: the raven that meant a raiding party, the silence that meant wolves. An older warden takes them on without ceremony, teaches them tracks, wind, and hunger, then leaves them somewhere hard. The ones who walk back are Rangers. The others are lessons.","playstyle":"Mark quarry and wear it down from range, laying snares along the retreat you predicted; win by knowing the ground better than anyone bleeding on it.","abilities":[{"name":"Quarry's Mark","desc":"Mark one enemy; your attacks against it gain bonus damage and you sense its heading through any obstruction."},{"name":"Wolf-Sign","desc":"Read the ground to reveal every creature that crossed it within a day, with their number, weight, and wounds."},{"name":"Thornfoot Snare","desc":"Set a hidden snare that roots the first creature through it and leaves it bleeding."},{"name":"Held Breath","desc":"After a turn without moving, your next shot cannot be deflected and strikes a weak point."}],"progressionSteps":["Walk past the last fence-post at dusk, alone, and come home with meat before anyone notices the knife is gone.","Apprentice yourself to a warden who has stopped counting winters, and carry their gear until they let you carry a bow.","Learn the forty signs of wolf, and the four that mean man.","Track a gut-shot stag for three days, and grant it a clean death you did not enjoy."]},{"id":"ranger.t2a","name":"Packbound","tier":2,"level":10,"parent":"ranger.t1","role":"Pair skirmisher — coordinated takedowns","lore":"Some rangers stop hunting alone the day a beast decides not to leave. The Packbound swear the old blood-oath: meat shared, wounds shared, one mind wearing two skins. Border folk trust them over any patrol, because a wolf will not lie about what it smells.","playstyle":"Fight as one creature in two bodies: your companion flanks, drags, and pins while you shoot, trading senses and wounds until nothing afield is faster.","abilities":[{"name":"Blood-Oath","desc":"Bind a sworn companion; you share wounds evenly and it acts on your instinct without command."},{"name":"Two Throats","desc":"You and your companion strike the same target within a heartbeat, and the stacked wounds bleed twice as long."},{"name":"Borrowed Ears","desc":"Perceive through your companion's senses at any distance, smelling fear and hearing pulses through walls."},{"name":"Drag Down","desc":"Your companion hamstrings a fleeing enemy and pins it prone until you arrive."}],"progressionSteps":["Reach level 10, then fast alone in the high pines until a beast chooses your fire over the dark.","Feed it from your own ration for a full season, and never eat first.","Take a wound that was meant for it, and let it lick the scar.","Hunt one whole winter without a spoken word between you, and come back fed."]},{"id":"ranger.t2b","name":"Stillhunter","tier":2,"level":10,"parent":"ranger.t1","role":"Stealth sniper — single decisive shots","lore":"The Stillhunter goes out alone and stops being a person for a while. They are the arrow that arrives from a hillside nobody watched, days after the target felt safe. Garrison soldiers speak of them the way sailors speak of weather: no malice in it, and no mercy either.","playstyle":"Play the long game: choose your ground, vanish into it, and spend patience like coin until one perfect shot decides the encounter before it begins.","abilities":[{"name":"Deadwood Stillness","desc":"While motionless you cannot be detected by sight, sound, or scent, even in open ground."},{"name":"Measured Wind","desc":"Each turn spent aiming adds range and lethality to your next shot, without limit."},{"name":"One Report","desc":"Your first shot from concealment strikes for triple damage and does not reveal your position."},{"name":"Cold Camp","desc":"You leave no tracks, ash, or scent; nothing mortal can backtrail you."}],"progressionSteps":["Reach level 10 and lie three days in a blind of your own weaving, moving only your eyes.","Kill at two hundred paces something that would have killed you at two.","Let a search party pass within an arm's reach of you. Twice.","Come home, and let no one ask where you were."]},{"id":"ranger.t3a","name":"Coursewarden","tier":3,"level":25,"parent":"ranger.t2a","role":"Pursuit striker — anti-flight execution","lore":"When something must not escape — a raider chief, a loosed horror, a deserter carrying plans — magistrates send for a Coursewarden. They and their beast do not fight quarry so much as spend it, running it hollow across days until it stands trembling and the ledger closes.","playstyle":"Momentum is your resource: speed and damage build every turn the quarry flees, and the execution triggers when exhaustion, terror, and your companion converge.","abilities":[{"name":"The Long Chase","desc":"Each turn your quarry moves away, you and your companion gain speed and damage; the bonus never resets."},{"name":"Hamstring Volley","desc":"A spread of low arrows cripples the legs of everything running in a line."},{"name":"Red Relay","desc":"You and your companion alternate strikes without breaking stride, each hit extending the other's reach."},{"name":"Run to Ground","desc":"A fleeing quarry below half strength is dropped instantly when your companion reaches it."}],"progressionSteps":["Reach level 25 and run a red hart to standing-still without loosing a single arrow.","Follow a raiding band over two rivers and a rockslide, then bring back their boots.","Refuse a bounty that asked you to stop at the border.","Let one quarry go, once, and understand why you never will again."]},{"id":"ranger.t3b","name":"Findsman","tier":3,"level":25,"parent":"ranger.t2a","role":"Scout-support — detection and rescue","lore":"When a child vanishes past the tree line, villages do not pray; they send for a Findsman. Ranger and beast pool their senses into one wide attention the wood cannot lie to. They charge little, drink less, and remember every name they carried home, and each they did not.","playstyle":"Recon and retrieval: ride your companion's senses to reveal what hides, hold a trail no sorcery can wash out, and shield whoever you are bringing home.","abilities":[{"name":"Third Nose","desc":"Merge senses with your companion to reveal every hidden creature, door, and grave within a bowshot."},{"name":"Hair and Thread","desc":"Once taken, a trail cannot be lost to water, snow, or sorcery."},{"name":"Carry-Word","desc":"Your companion bears a rescued creature to a spoken destination, unerring and unhindered."},{"name":"Lantern Discipline","desc":"Allies you escort cannot be frightened, charmed, or led astray while you watch."}],"progressionSteps":["Reach level 25, then find the child the wood took before third nightfall, and carry her out sleeping.","Learn the smell of every way a person can be lost.","Bring back a body when you had promised a boy, and say so plainly at the door.","Refuse payment from a mother, once, and never speak of it."]},{"id":"ranger.t3c","name":"Longeye","tier":3,"level":25,"parent":"ranger.t2b","role":"Extreme-range artillery — priority elimination","lore":"Longeyes measure shots in hillsides. They loose at targets the eye alone cannot honestly claim, trusting wind-craft, terrain, and arithmetic older than the bow. Captains fear open windows in towns a Longeye is rumored to have passed through; the arrow arrives before the sound, and long after the grudge.","playstyle":"Extreme-range elimination: spend the fight positioning and reading air, then delete the one target whose death unmakes the enemy's plan.","abilities":[{"name":"Mile-Mark","desc":"Strike a target beyond line of sight by memory of ground you have walked once."},{"name":"Wind's Confession","desc":"Read the air along the whole flight path; range and cover penalties do not apply to you."},{"name":"Arcing Writ","desc":"Loose over walls and ridgelines; the arrow descends on the target's shadow."},{"name":"Second Shame","desc":"If your first arrow kills, the next is nocked before the witnesses finish flinching."}],"progressionSteps":["Reach level 25 and cut a hanged man down at four hundred paces, in rain, with one arrow through the rope.","Spend a season loosing at nothing but wind-blown thistledown.","Miss once in front of someone who matters, and go back to the thistledown.","Put an arrow on a war-captain's map table, through the tent, as a letter of introduction."]},{"id":"ranger.t3d","name":"Lichenmask","tier":3,"level":25,"parent":"ranger.t2b","role":"Ambush controller — concealed area denial","lore":"A Lichenmask lies still long enough that the wood stops making an exception for them. Moss takes the cloak; beetles cross the bow hand. Whole armies file through passes under their count, and the tally reaches a distant desk with every button recorded and no watcher ever named.","playstyle":"Area denial from perfect concealment: seed the ground with patient traps, strike only while unseen, and make the terrain itself into hostile bookkeeping.","abilities":[{"name":"Grown Over","desc":"After a minute motionless, the terrain grows over you; you are undetectable until you choose otherwise."},{"name":"Patient Root","desc":"Your traps never expire and strengthen with each day they wait."},{"name":"First and Only","desc":"Attacks you make while unseen cannot be parried, dodged, or answered."},{"name":"Swallowed Camp","desc":"Hide a camp of six so thoroughly that hounds walk through it unknowing."}],"progressionSteps":["Reach level 25 and sit a fortnight in the pass while three columns march by; report every banner and every button.","Let moss claim your cloak before you claim a kill.","Go one full year without a stranger's eyes finding yours.","Bury your name under a flat stone, and visit it less each year."]},{"id":"ranger.t4a","name":"Wolf-Reeve","tier":4,"level":40,"parent":"ranger.t3a","role":"Pack commander — encirclement and pursuit","lore":"The Wolf-Reeve's warrant is older than most crowns and has no expiry. They command not one companion but a sworn pack, each wolf ranked and named, and the office answers to no magistrate once a quarry is declared. Kings have paid ransoms simply to be certain no warrant carried their name.","playstyle":"Command a full pack across the whole map: encircle, cut every line of retreat, and grind a declared quarry down over days, not turns.","abilities":[{"name":"Warrant of Teeth","desc":"Lead a pack of five sworn wolves; each can hold a separate mark."},{"name":"Closing Ring","desc":"Your pack forms a circle a bowshot wide; nothing inside leaves it without your leave."},{"name":"Speech of the Old Pack","desc":"Wild beasts within earshot obey you for one hunt, then owe you nothing."},{"name":"No Second Winter","desc":"A declared quarry cannot heal while any of your pack still draws breath."}],"progressionSteps":["Reach level 40 and inherit a warrant from a Reeve who died mid-hunt; finish that hunt before your own name dries on the rolls.","Name each wolf of your pack for something you lost.","Refuse a king who wanted the warrant used on a debtor.","Close a hunt begun forty years before your birth, and burn the warrant after."]},{"id":"ranger.t4b","name":"Finder of the Taken","tier":4,"level":40,"parent":"ranger.t3b","role":"Warded rescuer — hostile-ground extraction","lore":"Some places are struck from maps for good reasons, and the Finder walks into them anyway: barrow-fields that rearrange themselves, forests drowned but still growing. They are paid in advance, by custom. The feared part is not where they go; it is that the things there have started using their name.","playstyle":"Endure what should not be entered: ward against lures and false voices, carry the fallen at full speed, and always know the way back out.","abilities":[{"name":"Thread of Return","desc":"You can always retrace your exact path, and allies holding your rope cannot be separated from it."},{"name":"Name Under the Tongue","desc":"You are immune to charms, lures, and voices imitating the loved or the dead."},{"name":"Shouldered Burden","desc":"Carry an incapacitated creature at full speed; while carried, both of you are warded from harm."},{"name":"Salt and Iron Verge","desc":"Draw a line the unnatural cannot cross for one night."}],"progressionSteps":["Reach level 40 and enter a place struck from the maps; bring someone out still breathing.","Hear your true name spoken by something with no mouth, and keep walking.","Leave a marker at the deepest point you reached, so the next Finder aims past it.","Bring back one who was nine years gone, and stand quietly through the weeping."]},{"id":"ranger.t4c","name":"Fatefletcher","tier":4,"level":40,"parent":"ranger.t3c","role":"Declared executioner — inevitable single kills","lore":"A Fatefletcher builds each arrow for one death only: the shaft cut on a named day, the fletching bound with the target's habits in mind. When the grey feather is found on a commander's pillow, sieges have lifted by breakfast. Scholars call the craft mathematics. The fletchers call it listening.","playstyle":"Name the death in advance: spend turns fletching fate into a single arrow, then loose the one shot the battle has already agreed to.","abilities":[{"name":"Named Shaft","desc":"Fletch an arrow against one named creature over an hour; against that creature, it cannot miss."},{"name":"Already Loosed","desc":"The killing shot lands before any witness registers the draw."},{"name":"Grey Feather","desc":"Leave a feather where a leader sleeps; their forces suffer dread and desertion until they withdraw."},{"name":"Passes What It Must","desc":"A named shaft ignores armor, cover, and wards standing between it and its purpose."}],"progressionSteps":["Reach level 40 and fletch an arrow bearing your own name; carry it until you understand why.","End a siege with one shaft, and walk out through the celebrating.","Refuse a name you judged undeserved, and return the fee doubled.","Teach one apprentice the listening, then burn your notes."]},{"id":"ranger.t4d","name":"Grey Vigil","tier":4,"level":40,"parent":"ranger.t3d","role":"Invisible attrition — territorial denial","lore":"No one has knowingly met a Grey Vigil. There are borders where warbands enter at full strength and thin, man by man, in weather and silence, with no arrow ever recovered. Other rangers find only cold blinds a decade old. The order acknowledges its dead, and no one living.","playstyle":"Never be engaged: bank patience into power, remove intruders one by one when they stray, and let rumor finish what you started.","abilities":[{"name":"The Thinning","desc":"Each night, one intruder in your territory who strays from the others does not rejoin them."},{"name":"No Such Watcher","desc":"Within your sworn ground, no sense, spell, or record can establish that you exist."},{"name":"Borrowed Weather","desc":"Fog, rain, and dusk arrive when you need them, and side with you."},{"name":"Quiet Ledger","desc":"Every day you go unseen adds lethality to your first strike, without cap."}],"progressionSteps":["Reach level 40 and keep a border for a full year without being seen once, by enemy or friend.","Take the grey oath alone; if the order heard it, they will not say.","Turn back an army using only its own count of the missing.","Attend your predecessor's funeral, and leave before you are counted."]},{"id":"ranger.t5a","name":"Pack Incarnate","tier":5,"level":60,"parent":"ranger.t4a","role":"Mythic pursuit — many-bodied inescapable hunt","lore":"Histories from six kingdoms describe the same thing sideways: a hunt on the far borders that never quite ended, one will wearing many bodies. Wolves are part of it; so, the accounts insist, is something shaped like a ranger. When it takes a scent, sensible nations make peace to avoid being downwind.","playstyle":"Act through every body at once: the pack is your reach, your senses, and your argument, and no distance or border interrupts it.","abilities":[{"name":"One Will, Many Throats","desc":"Act through every pack member simultaneously; distance between bodies is irrelevant."},{"name":"Scent Eternal","desc":"A marked quarry cannot rest, heal, or hide until the hunt concludes."},{"name":"The Hunt Arrives","desc":"Your pack emerges from whatever cover exists at the quarry's destination, having always been ahead."},{"name":"Winter Runs With You","desc":"Cold, dark, and hunger afflict your quarry and feed your pack."}],"progressionSteps":["Reach level 60 and run one quarry across three kingdoms and through the middle of a war, letting no border slow the pack.","Fall in the snow with the pack around you, and rise when they nose you up. Twice.","Give up your reflection; the pack sees you, and that is enough.","Let the histories name the hunt, and never the hunter."]},{"id":"ranger.t5b","name":"Warden of the Way Back","tier":5,"level":60,"parent":"ranger.t4b","role":"Mythic rescuer — retrieval across final borders","lore":"Every land tells it differently and means the same story: someone taken past all finding, and years later a figure at the gate returning them unaged, declining supper. Grave-priests preach against the tale. Mothers go on telling it, and set a lamp in the window in case the Warden is passing.","playstyle":"Anchor the living and reclaim the lost: open doors out of anywhere, hold names against death, and pay tolls no one else can carry.","abilities":[{"name":"Door Where None Was","desc":"Once a day, open a way out of any place, including places that are not places."},{"name":"Kept Name","desc":"Hold a dying ally's name under your tongue and lead them back before dawn."},{"name":"The Long Carry","desc":"Carry one soul any distance, across any border, at a cost you settle later."},{"name":"Lamp in the Window","desc":"Anyone lost who remembers you can always be found by you."}],"progressionSteps":["Reach level 60 and walk into the country the dead walk out of; return leading someone by the hand.","Learn what the toll is, and pay it without telling anyone the price.","Return a child to the woman who buried her, and stay for the silence afterward.","Leave your own lamp lit. You will not be home for a while."]},{"id":"ranger.t5c","name":"The Last Arrow","tier":5,"level":60,"parent":"ranger.t4c","role":"Mythic artillery — war-ending single shot","lore":"The chronicles disagree on the archer and agree on the arrow: a siege that lifted mid-assault, a tyrant dead at dinner behind three walls, a war that ended with one report no one heard. Scholars argue whether it is a single bowman or an office quietly passed down. The quivers stay one arrow light either way.","playstyle":"Everything is windage for one shot: spend the battle unseen and calculating, then loose the arrow the war was always waiting for.","abilities":[{"name":"The Shot Foretold","desc":"Declare a death anywhere beneath the same sky; the arrow keeps the appointment."},{"name":"The Held Breath","desc":"Time thins around your draw; nothing moves between anchor and loose."},{"name":"No Wall Was Built","desc":"The shaft ignores fortification, armor, ward, and weather standing between it and the declared."},{"name":"Quiver of One","desc":"You carry a single arrow; it is always the right one."}],"progressionSteps":["Reach level 60 and end a war with one arrow, then let history misname the archer.","Decline three thrones offered by people who guessed correctly.","Loose at something the priests say cannot die, and make them revise.","Pass the office on the way it came to you: an arrow, a heading, and no names."]},{"id":"ranger.t5d","name":"The Absence","tier":5,"level":60,"parent":"ranger.t4d","role":"Mythic ghost — unwitnessed erasure","lore":"Officially, there is no such ranger. Yet there are woods that veteran armies refuse to enter for reasons their generals cannot commit to paper, and border wars that ended because the winning side began, quietly, to be alone. Scholars call the Absence a superstition. The superstition has a body count.","playstyle":"Win without ever appearing: you cannot be perceived or recorded, so enemies fight the terrain, the dark, and their own arithmetic instead.","abilities":[{"name":"Never There","desc":"You cannot be perceived, remembered, or recorded by any means, mortal or otherwise."},{"name":"The Unentered Wood","desc":"Enemy forces refuse to enter ground you have claimed; orders to do so trigger desertion."},{"name":"Death Without an Author","desc":"Your kills present no wound, cause, or story that any investigation can hold."},{"name":"Last Doubt","desc":"Beings of fate and prophecy cannot include you in their accounts."}],"progressionSteps":["Reach level 60 and be declared dead by the order that trained you; attend the rite unnoticed.","Empty a fortress without breaching a gate or leaving an arrow.","Be disproven by a royal commission. Assist their research.","Become the reason the wood is quiet, and let quiet be the whole of your name."]}]},{"id":"bard","name":"Bard","archetype":"Cunning","icon":"🎻","tagline":"The right word, placed rightly, moves armies and ages.","description":"The Bard collects what others overlook — songs, secrets, debts of gratitude, the exact words a person cannot refuse. Some carry their voices to war and hold shield-walls together with a cadence; others whisper in archives and anterooms, ending wars before the first arrow. All of them understand the same truth: a word placed correctly moves more than any lever, and history belongs to whoever phrases it.","nodes":[{"id":"bard.t1","name":"Bard","tier":1,"level":1,"parent":null,"role":"Support — versatile inspiration and control","lore":"Every road-worn troupe carries one: the apprentice who learned that a crowd can be tuned like a lute. Bards trade in songs, secrets, and applause, and they know the market value of each. Most die as footnotes in someone else's ballad. A few learn to write the ballad first.","playstyle":"Weave buffs and jeers between verses, patching allies' nerve and picking at enemies' composure while staying one clever step away from the front line.","abilities":[{"name":"Opening Chord","desc":"Begin combat with a flourish that grants nearby allies bonus initiative and a brief surge of morale."},{"name":"Cutting Couplet","desc":"Deliver a barbed verse that deals psychic damage and leaves the target flinching, weakening its next attack."},{"name":"Ear for Trouble","desc":"Passively sense lies and hidden hostility in conversation; act first against any ambush you overheard coming."},{"name":"Borrowed Refrain","desc":"Mimic the last ally ability you witnessed at reduced potency, once per rest."}],"progressionSteps":["Learn three hundred songs by ear, and be beaten once for singing the wrong one in the wrong hall.","Play for a crowd that came to jeer, and leave them silent.","Trade your first secret for supper, and understand what you have actually sold.","Bury your teacher with the song they hated, because it was the true one."]},{"id":"bard.t2a","name":"War-Skald","tier":2,"level":10,"parent":"bard.t1","role":"Frontline support — formation buffs and morale","lore":"War-skalds march where the banners do, armored in nothing but nerve, keeping time for the shield-wall with drum and bellowed verse. Captains requisition them like rations. The soldiers know the arithmetic: a line that sings holds three heartbeats longer than a line that does not, and most battles are decided in two.","playstyle":"Stand in the second rank and conduct the battle, layering marching cadences that harden allies and counter-verses that sap enemy charges. Your voice is the front line's spine.","abilities":[{"name":"Shield-Cadence","desc":"Chant a marching meter that grants allies in formation bonus block and immunity to the first fear effect."},{"name":"Drumfire","desc":"Strike your war-drum to reset one ally's broken stance and pull them back into the line."},{"name":"Skald's Bellow","desc":"A shout that carries over battle noise; every ally who hears it regains a spent reaction."},{"name":"Counter-Verse","desc":"Answer an enemy warcry with practiced mockery, cancelling its morale bonus before it lands."}],"progressionSteps":["Reach level 10, then enlist with a company that has lost its standard, and sing it a new one.","Keep the cadence through a full rout without once looking behind you.","Learn the death-songs of five peoples, so that no soldier under your voice dies to silence.","Carry the drum out of a defeat when stronger backs carried nothing."]},{"id":"bard.t2b","name":"Veiled Chronicler","tier":2,"level":10,"parent":"bard.t1","role":"Control support — charm, debuffs, information warfare","lore":"Veiled Chroniclers keep the histories nobody commissioned: the bastard lines, the buried treaties, the words kings spoke before the witnesses died. They learn early that lore is a lever and a noose at once. Courts host them nervously, the way one hosts a fire — useful, warming, and watched.","playstyle":"Fight before the fight begins: gather names, plant doubts, charm sentries. In combat, unmake enemy plans with bindings and misdirection rather than trading blows.","abilities":[{"name":"Marginalia","desc":"Recall one obscure fact about any named creature or place; gain advantage on your next action exploiting it."},{"name":"Hushword","desc":"Speak a syllable of old silence; one target cannot cast, command, or call for aid for a round."},{"name":"False Provenance","desc":"Forge a memory into a listener's recent past; they misremember one detail of the last hour."},{"name":"Thread of Rumor","desc":"Seed a rumor in a settlement; within a day it returns grown, carrying truths its carriers never meant to share."}],"progressionSteps":["Reach level 10 and recite, unprompted, a history its owners paid to have forgotten.","Spend a season as a servant in a great house and leave knowing which floorboards listen.","End one feud with three sentences, spoken to the right person at the wrong hour.","Copy a banned chronicle by candlelight, then decide alone who is permitted to read it."]},{"id":"bard.t3a","name":"Shieldsinger","tier":3,"level":25,"parent":"bard.t2a","role":"Defensive support — mitigation and battlefield anchoring","lore":"Shieldsingers are called wall-mortar by the infantry, and they take it as an honor. Their verses set into a standing line like cooling bronze, binding shield to shield until a hundred bodies breathe as one. Where a Shieldsinger plants their feet, generals redraw their maps around that point.","playstyle":"Anchor a position and refuse the enemy. Layer sustained wards over allies who hold their ground, and punish anything that breaks formation — theirs or yours.","abilities":[{"name":"Mortar-Hymn","desc":"Allies standing adjacent to one another share incoming damage and gain resistance while the hymn is held."},{"name":"Planted Verse","desc":"Choose ground; allies upon it cannot be moved against their will and mend slightly at each verse's turn."},{"name":"Hold the Vowel","desc":"Sustain a single note; while held, the first killing blow against each warded ally leaves them at one hit point instead."},{"name":"Ring of Voices","desc":"Once per battle, fallen allies within the song stand again with a portion of health, provided the line still holds."}],"progressionSteps":["Reach level 25, then hold a breach with your voice while the shields behind you are still forming.","Sing an eight-hour siege watch without water, and let no one on the wall sleep afraid.","Take the wound meant for the line and finish the stanza before you bind it.","Refuse a general's order to retreat, and be right."]},{"id":"bard.t3b","name":"Dirgecaller","tier":3,"level":25,"parent":"bard.t2a","role":"Offensive support — fear, attrition, siege-breaking","lore":"Dirgecallers sing at armies the songs meant for their graves, and soldiers who hear their own funeral early tend to attend it. Besieged cities dread them more than engines; stone resists a ram, but a garrison's nerve is masonry of a softer kind. Their arrival at a wall is itself an ultimatum.","playstyle":"Break the enemy before the charge does. Stack dread on packed formations, shatter morale thresholds, and turn organized resistance into a stampede pointed the wrong way.","abilities":[{"name":"Premature Requiem","desc":"Name a target and sing their funeral; they take escalating psychic damage each round they can hear you."},{"name":"Sapper's Threnody","desc":"A low sustained tone that cracks mortar and works fortification stones loose over several minutes."},{"name":"Rout-Note","desc":"Enemies below half morale who hear this discord must flee toward their own rear lines, through their allies."},{"name":"Grave-Hush","desc":"Silence falls across a wide radius; enemy commands go unheard while your dirge alone carries."}],"progressionSteps":["Reach level 25 and end a siege without a single ladder touching the wall.","Learn what a city sounds like the night before it surrenders, and be the one who taught it.","Sing a veteran company into flight, then walk their empty line slowly.","Attend the funerals your songs began. All of them."]},{"id":"bard.t3c","name":"Namebinder","tier":3,"level":25,"parent":"bard.t2b","role":"Controller — single-target binding and compulsion","lore":"Namebinders collect what things are actually called: the syllables a river answers to, the word a demon signed before witnesses. To hold a true name is to hold a leash. They speak carefully in company, because they know precisely what a careless sentence can be made to do.","playstyle":"Hunt the name, then own the fight. Slow to open, devastating once a target is named — command it, unmake it, or forbid it with a single word.","abilities":[{"name":"Utterance of Binding","desc":"Speak a learned true name; the named creature obeys one one-word command with no saving throw."},{"name":"Name-Sounding","desc":"Probe a target with test-syllables over three rounds to uncover fragments of its true name."},{"name":"Sealed Syllable","desc":"Lock one word out of a target's mouth; they cannot speak it, cast with it, or write it."},{"name":"Leash of Letters","desc":"A creature you have named cannot move beyond thirty paces of you until dawn."}],"progressionSteps":["Reach level 25 and hear your own true name from a stranger's mouth, and survive the hearing.","Bind a lesser spirit by name alone, without circle, salt, or blade.","Trade a year of your singing voice for one syllable of a mountain's name.","Speak a true name in anger exactly once, and let what follows teach you never again."]},{"id":"bard.t3d","name":"Silvertongue","tier":3,"level":25,"parent":"bard.t2b","role":"Social controller — charm, leverage, war-avoidance","lore":"Silvertongues end wars in anterooms, over wine nobody quite remembers pouring. They are lent between courts like fine instruments, and every ruler who borrows one wonders, correctly, what tune was played upon them in return. The great treaties of the age bear their fingerprints and never their names.","playstyle":"Win the encounter before initiative is rolled. Charm, leverage, and staged concessions turn enemies into hosts; in open combat, redirect aggression rather than absorbing it.","abilities":[{"name":"Perfect Concession","desc":"Offer surrender terms so precisely fitted that the enemy commander accepts conditions you wrote for them."},{"name":"Borrowed Loyalty","desc":"Charm a target into treating you as a trusted advisor for an hour; afterward they rationalize everything you asked."},{"name":"Turn the Blade","desc":"An enemy who strikes at you redirects the blow to a target you nominate with a whispered suggestion."},{"name":"Room Reading","desc":"Instantly learn the strongest desire and sorest grievance of every person in a gathering."}],"progressionSteps":["Reach level 25, then talk your way out of an execution you deserved.","Broker peace between two houses while carrying a knife-scar from each.","Convince a mercenary company to march home unpaid, and have them thank you at the gate.","Sit across from a tyrant, speak for one hour, and leave the room owning the war's ending."]},{"id":"bard.t4a","name":"Anthemwright","tier":4,"level":40,"parent":"bard.t3a","role":"Army-scale support — persistent zone anthems","lore":"Anthemwrights no longer sing songs; they build them, verse-engineered for a single army the way a smith fits a cuirass. A finished anthem outlives its commission — soldiers' grandchildren hum it in peacetime, and it still remembers how to close a shield-wall. Kingdoms count themselves fortunate to field three at once.","playstyle":"Compose before battle, conduct during it. Deploy pre-built anthem structures that persist across the field, letting whole formations fight a measure above their nature.","abilities":[{"name":"Forged Anthem","desc":"Spend a week composing for a specific company; while any ten of its members sing, all gain elite-tier discipline and defenses."},{"name":"Bridge Verse","desc":"Link two separated formations; they count as adjacent for morale and share the stronger unit's resolve."},{"name":"Standing Coda","desc":"Your anthem persists on the field for an hour after you fall silent, or after you fall."},{"name":"Tempering Silence","desc":"One measured pause; allies shed all fear, exhaustion, and one grievous condition as the anthem resumes."}],"progressionSteps":["Reach level 40 and compose an anthem that holds a line after your death is reported. Correct the report later, in person.","Submit your masterwork to the circle of Anthemwrights and defend every syllable through three nights of hostile revision.","Retire a broken company's old anthem with full honors before you write them the new one.","Refuse a paying crown once, because the song they asked for was a lie."]},{"id":"bard.t4b","name":"Threnodist","tier":4,"level":40,"parent":"bard.t3b","role":"Strategic debuffer — mass dread and unmaking","lore":"There is a short list of songs that are illegal to perform in three empires. Threnodists wrote all of them. Each carries a personal lament, years in the making and never yet sung whole; commanders have negotiated surrenders simply to keep it unfinished. Their gray robes empty streets faster than plague-bells.","playstyle":"Escalate dread on a strategic scale. Long-form lament movements degrade an entire army's cohesion, health, and works, building toward a finale few commanders permit to arrive.","abilities":[{"name":"The Unfinished Lament","desc":"Perform successive movements across rounds; each deepens army-wide penalties, and the final movement breaks any force still listening."},{"name":"Toll for the Living","desc":"Every enemy who has killed today hears a bell only they can hear; the guilty strike last and flinch first."},{"name":"Ash Registry","desc":"Name a fortification within the lament; its garrison abandons posts nightly until the walls stand unwatched."},{"name":"Mercy Clause","desc":"End any of your dirges instantly for all who ground arms; those who surrendered are immune to your songs until dawn."}],"progressionSteps":["Reach level 40, then begin composing your own lament, knowing you may never be permitted to finish it.","Be named in an empire's law by your work and not your name.","Sing the second movement over a fortress, and count the gates that stand open by morning.","Grant mercy once when the finale was owed, and carry what that mercy costs."]},{"id":"bard.t4c","name":"Redactor","tier":4,"level":40,"parent":"bard.t3c","role":"Existential controller — erasure and denial","lore":"Redactors unmake the written and the spoken. Where a Namebinder holds a leash, a Redactor cuts the collar out of the world: heresies un-taught, treaties un-signed, whole men reduced to a smudge in their mothers' memory. The great archives keep a lamp burning against them. It does not help.","playstyle":"Delete the enemy's options. Strip abilities, spells, and identities from targets mid-fight; the strongest foes are simply those with the most to lose.","abilities":[{"name":"Strikethrough","desc":"Erase one of a target's known abilities for the encounter; legendary creatures lose it for a full day."},{"name":"Excision","desc":"Remove a target's name from every mind within a mile; its allies stop taking its orders."},{"name":"Blank Page","desc":"Become unrecorded for ten minutes; scrying, memory, and written accounts cannot hold you."},{"name":"Errata","desc":"Rewrite one small fact declared aloud this scene — a password, an order, a price — and the world complies."}],"progressionSteps":["Reach level 40 and erase a heresy so completely that its inquisitors forget their own occupation.","Un-write one page of your own history and live with the seam.","Stand in the Archive of Echoes and learn to hear which of its silences are yours.","Refuse to erase a name once, though the payment was a kingdom, because the record was true."]},{"id":"bard.t4d","name":"Kingmaker","tier":4,"level":40,"parent":"bard.t3d","role":"Grand manipulator — favors, factions, proxy warfare","lore":"Kingmakers have stopped attending wars; they attend successions. Each keeps a quiet ledger of debts owed by the crowned, collected in policy rather than coin. Three reigning monarchs are commonly agreed to be Kingmaker work, though the guilds of heralds dispute, very carefully, which three.","playstyle":"Play the campaign, not the encounter. Call in owed favors — armies, pardons, poisonings — and enter combat only when a debt requires collecting in person.","abilities":[{"name":"Ledger of Crowns","desc":"Call in a stored favor from a ruler; receive troops, sanctuary, or a signature within a day."},{"name":"Whispered Succession","desc":"Over a week of court-work, redirect an inheritance, appointment, or command to a candidate of your choosing."},{"name":"Diplomatic Poise","desc":"Creatures that understand speech cannot strike you first in an encounter where you have not drawn a weapon."},{"name":"The Long Toast","desc":"During any shared meal, learn one secret each guest would trade their honor to protect."}],"progressionSteps":["Reach level 40 and seat your first ruler, then decline the title they offer you.","Hold a debt for a decade without once mentioning it.","Unmake a tyrant with paperwork, witnesses, and one well-timed silence.","Survive being owed too much by someone who would rather cancel the debt with a knife."]},{"id":"bard.t5a","name":"Voice of Legions","tier":5,"level":60,"parent":"bard.t4a","role":"Mythic army-wide aura — unbreakable formations","lore":"The histories record perhaps five Voices of Legions, and argue about two of them. When one sings, an army becomes a single instrument: ten thousand shields tuned to one pitch, fear engineered out of the design. Old soldiers swear the Song at Vessa's Ford still holds the ford, decades after its singer fell.","playstyle":"You are the battle's tempo. Every allied soul in earshot fights within your meter — unbreakable, synchronized, and, for as long as you sing, slightly more than human.","abilities":[{"name":"Ten Thousand, One Throat","desc":"All allies who can hear you share the highest morale, discipline, and resolve found among them."},{"name":"The Held Line","desc":"Declare a line upon the earth; while you sing, no ally behind it can die, only fall unconscious."},{"name":"Vessa's Measure","desc":"Once per war, the enemy army hears its own marching song played back, perfected, and hesitates a full round."},{"name":"Song Without Singer","desc":"Should you fall mid-battle, your anthem continues from every allied mouth until the field is decided."}],"progressionSteps":["Reach level 60, then hold a field where every officer has fallen, conducting an army whose only commander is the song.","Have a truce called because both armies were singing your verse.","Teach the anthem to a child, a veteran, and an enemy, and hear all three keep it true.","Enter a history you did not commission, and find it needed no exaggeration."]},{"id":"bard.t5b","name":"Knell of Empires","tier":5,"level":60,"parent":"bard.t4b","role":"Mythic dread — campaign-ending finales","lore":"A Knell of Empires is less a person than a precedent. Chronicles credit the fall of Vhoria to eleven days of a single voice outside its walls, with no arrow loosed. Rulers keep the names of living Knells in sealed letters, opened only to learn what must never be provoked.","playstyle":"Arrive as an ending. Your presence alone degrades enemy resolve at strategic range; your finished laments retire armies, dynasties, and the appetite for war itself.","abilities":[{"name":"The Finished Lament","desc":"Complete your life's dirge over three days against one realm; its will to make war ends for a generation."},{"name":"Eleven Days of Vhoria","desc":"Besiege a fortification with voice alone; each dawn, a portion of its garrison lays down arms and walks out."},{"name":"Funeral for the Future","desc":"Show one commander their own succession dying within the song; they seek terms or break entirely."},{"name":"Bell Unrung","desc":"Any who have heard your finale and lived can never again be rallied against you."}],"progressionSteps":["Reach level 60, then finish the lament you began decades ago, and choose whom it is for.","End an empire's war without an army — yours or theirs — taking the field.","Hear your name written into a treaty as a clause: that you will not be sent.","Sing once, at the last, for the dead of your own making, and mean it."]},{"id":"bard.t5c","name":"The Unwritten","tier":5,"level":60,"parent":"bard.t4c","role":"Mythic erasure — editing what is real","lore":"The Unwritten cut their own names out of the world's record and stepped through the gap. Nothing remembers them longer than a breath, which makes them the only editors history cannot flatter or bribe. Scholars infer their existence from the seams: wars that stop mid-sentence, tyrants nobody recalls obeying.","playstyle":"Exist in the margins. Unwrite enemies, events, and consequences at will; the fight itself is trivial — choosing what deserves to remain in the record is not.","abilities":[{"name":"Total Redaction","desc":"Remove a creature from the record entirely; it persists, but nothing can remember, follow, obey, or mourn it."},{"name":"The Gap","desc":"Step into an erased moment; you are untargetable and undetectable until you act upon the world."},{"name":"Restored Passage","desc":"Un-erase one thing you or any Redactor destroyed; the truth returns to every mind that once held it."},{"name":"Authorial Doubt","desc":"Force a legendary enemy to briefly disbelieve its own existence, losing all actions for a round."}],"progressionSteps":["Reach level 60, then unwrite your own name and watch your mother's eyes pass over you.","Erase a war so cleanly that its widows wake merely sad, not knowing why.","Meet another Unwritten in the margins, and agree on nothing except the rules.","Choose one true, terrible thing and let it stand in the record forever, because someone must."]},{"id":"bard.t5d","name":"Author of Ages","tier":5,"level":60,"parent":"bard.t4d","role":"Mythic orchestrator — history as an instrument","lore":"An Author of Ages no longer moves rulers; they move the idea of rule. Their work is measured in centuries: a philosophy seeded in a border town, a marriage arranged two generations early, a war scheduled like a harvest. Historians call certain eras well-written. They do not know how right they are.","playstyle":"Operate at the scale of eras. Every faction is a character you are developing; combat is a plot device, deployed sparingly and always foreshadowed.","abilities":[{"name":"Draft of the Century","desc":"Set a hundred-year design in motion; once per age, declare one historical outcome inevitable and watch events comply."},{"name":"Recurring Character","desc":"Any person you have spoken with for an hour can be activated as an ally decades later, unaware they were written."},{"name":"Foreshadowing","desc":"Declare an event aloud; within a year, circumstances bend until it occurs at a moment of your choosing."},{"name":"Narrative Weight","desc":"You cannot die in a way history would find meaningless; fatal blows in trivial scenes simply fail."}],"progressionSteps":["Reach level 60, then complete a design your predecessor began before your grandmother was born.","Start a renaissance with a rumor and a scholarship.","Watch a war you scheduled forty years ago arrive on time, and feel nothing you did not plan to feel.","Write the age's ending in advance, seal it, and be right."]}]},{"id":"wizard","name":"Wizard","archetype":"Arcane","icon":"📖","tagline":"Every word costs a decade; speak carefully.","description":"Wizards are not born to power; they purchase it, syllable by syllable, across decades of candlelit study. To them magic is a language older than the world that speaks it, with a grammar that punishes error in blood. Where others sing or borrow, the wizard conjugates. Each year in the archives adds another word no living rival can pronounce.","nodes":[{"id":"wizard.t1","name":"Wizard","tier":1,"level":1,"parent":null,"role":"Ranged caster — versatile, preparation-driven damage","lore":"Every tower, hedge-school, and archive keeps a few: apprentices who traded their youth for letters. A wizard at first rank owns little — a copied grimoire, a stub of candle, three words that reliably work. The world calls them scholars until the third word lands. Then it calls them carefully.","playstyle":"Prepare the right spells before the fight, then spend them precisely. Fragile and slow to ready, devastating when the situation matches the page you memorized.","abilities":[{"name":"Candle Logic","desc":"Kindle a small, obedient flame that deals modest fire damage and never spreads beyond the word that lit it."},{"name":"Inkbound Ward","desc":"Trace a warding sentence midair that absorbs the next hit; the ward breaks into legible fragments enemies find briefly blinding."},{"name":"Apprentice's Rebuttal","desc":"Interrupt an enemy casting by mispronouncing it back at them; weak spells fizzle, strong ones merely stutter."},{"name":"Recitation","desc":"Recite memorized passages to restore mana over six seconds; taking damage forces you to start the page again."}],"progressionSteps":["Learn your letters twice — once for men, once for the older things that listen beneath them.","Copy a dead wizard's grimoire by hand until your errors stop being errors.","Speak your first true word aloud, and survive being understood.","Swear the Candle Oath: study before sleep, accuracy before ambition, and never lend out your name."]},{"id":"wizard.t2a","name":"Convoker","tier":2,"level":10,"parent":"wizard.t1","role":"Ranged nuker — elemental burst and area denial","lore":"Convokers choose the loud grammar: fire, frost, storm, and stone — the four dialects the material world speaks about itself. They are summoned to break sieges and end droughts, and paid to leave quickly. The Convocation grants the rank only to those the elements have answered by name, at least once each.","playstyle":"Rotate four elemental dialects against resistances, earning short empowerments when you alternate. Loud, position-hungry casting that trades personal safety for overwhelming area damage.","abilities":[{"name":"Fire's First Name","desc":"Speak the flame's birth-name to detonate a burning zone; enemies already ignited take double the blast."},{"name":"Bedrock Clause","desc":"Command the ground to object, erupting a stone rampart that launches and staggers whatever stood upon it."},{"name":"Voltaic Refrain","desc":"Repeat a thunder-word three times; each repetition forks lightning to one additional target at growing damage."},{"name":"Hail Imperative","desc":"Order the sky downward, dropping a slow-marching column of frost that chills everything it crosses, then shatters."}],"progressionSteps":["Reach level 10 and address each of the four elements by its birth-name, without flattery and without flinching.","Stand in a mountain storm and correct its grammar; leave only when it thunders in the tense you chose.","Carry a live coal, a hailstone, an unspent bolt, and a fistful of grave-earth through the Convocation doors.","Answer the examiners in all four dialects while your own notes burn on the lectern."]},{"id":"wizard.t2b","name":"Deepscribe","tier":2,"level":10,"parent":"wizard.t1","role":"Battlefield controller — zones, wards, stolen tempo","lore":"Deepscribes go down instead of out — past the elements, into the Undertext: the writing beneath the world that fixes where things are and when. Archives quarter them apart from other students. Their margins fill with runes that itch to be true, and their letters sometimes arrive before being sent.","playstyle":"Shape the fight before it starts: inscribe traps, fold distances, tax enemy time. Weak in a fair exchange, so arrange that no exchange is fair.","abilities":[{"name":"Footnote","desc":"Inscribe a rune in the field's margin; the first enemy to cross it triggers a rooting annotation."},{"name":"Folded Footnote","desc":"Crease the space between two points and step across; the fold snaps shut behind you, clipping pursuers."},{"name":"Borrowed Minute","desc":"Lift sixty seconds from an enemy's future; they slow now and stagger when the debt comes due."},{"name":"Undertext Ward","desc":"Rewrite your outline one line deeper than reality, reducing all damage while you stand still and read."}],"progressionSteps":["Reach level 10 and read one full page of the Undertext without your own name changing.","Inscribe a rune that remains true after you stop believing in it.","Fold a map until two cities touch, and post a letter across the crease.","Descend to the archive's sealed floor, and return with the same number of shadows you took down."]},{"id":"wizard.t3a","name":"Cindertongue","tier":3,"level":25,"parent":"wizard.t2a","role":"Ranged striker — single-target incineration burst","lore":"Cindertongues speak the loud grammar so precisely it stops being weather and becomes intent. Their consonants scorch parchment at ten paces; taverns serve them in stoneware. Duelists dread the Held Word — fire kept behind the teeth for hours, then released as one immaculate, unsurvivable syllable.","playstyle":"Charge held-word stacks between engagements, then discharge everything into a single target. Burst windows are short and total; missing one means minutes of silent rebuilding.","abilities":[{"name":"Held Word","desc":"Bank fire on your tongue for up to an hour; its damage compounds silently until spoken."},{"name":"Scorchword","desc":"A single spoken bolt that ignores fire resistance in proportion to how long you have gone without speaking."},{"name":"Fulminant Vowel","desc":"One vowel of lightning that arcs from the burning target to whoever stands nearest in its defense."},{"name":"Vitrify","desc":"Fuse the ground beneath a burned enemy into glass, rooting them inside a mirror of the blast."}],"progressionSteps":["Reach level 25 and hold a word of fire behind your teeth from dusk to dawn without swallowing.","Duel a Convoker of higher rank; win with one syllable, or never speak of it.","Whisper to a candle across a crowded hall and light it before anyone hears you.","Burn your apprentice notes; a Cindertongue carries every word ignited, or not at all."]},{"id":"wizard.t3b","name":"Graven Lector","tier":3,"level":25,"parent":"wizard.t2a","role":"Area controller — walls, slows, siege attrition","lore":"Graven Lectors read the quiet grammar: frost that outlasts argument, stone that never learned to hurry. Fortresses retain them as living gates. It is said a Lector reads a glacier the way clerks read ledgers — aloud, line by line, back to the first winter, and is never interrupted.","playstyle":"Deny ground rather than take it. Layer walls, chills, and graven clauses until enemies are fighting inside a shrinking room of your punctuation.","abilities":[{"name":"Rime Parenthesis","desc":"Enclose a zone in curved walls of ice; anything caught inside is parenthetical, and takes increased damage."},{"name":"Graven Clause","desc":"Carve a slowing sentence into the earth; enemies who read it — by standing on it — briefly turn to stone."},{"name":"Hoarfrost Ledger","desc":"Record every chill you inflict; at ten entries the ledger closes and all debtors freeze at once."},{"name":"Weight of Strata","desc":"Drop the memory of a mountain onto one point, crushing and half-burying whoever disagreed with you."}],"progressionSteps":["Reach level 25 and read a glacier's strata aloud, oldest line first, until you reach a winter no calendar holds.","Raise a wall of ice before a siege, and still be standing behind it when the besiegers starve.","Carve one sentence into granite with a bare fingertip, without haste and without heat.","Spend a season in silence; the quiet grammar admits no student who fidgets."]},{"id":"wizard.t3c","name":"Hourwright","tier":3,"level":25,"parent":"wizard.t2b","role":"Tempo support — haste, delay, small rewinds","lore":"Hourwrights work time the way wheelwrights work oak: measured, joined, mended. Field commanders prize them, for a battle with an Hourwright runs on their clock. They keep pocketed minutes against emergencies and pay in memories, which is why old Hourwrights ask your name twice and apologize once.","playstyle":"Bank seconds in calm moments and spend them in cr
