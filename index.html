make every enemy plan cost more than it wins.","abilities":[{"name":"Anathema","desc":"Pronounce a doom upon one enemy; it ripens each round until the fated blow lands twofold."},{"name":"Interdiction","desc":"Bar a place or object by decree; enemies who use it anyway are marked and weakened."},{"name":"The God's No","desc":"Countermand one enemy spell or miracle as it happens; its wielder is struck mute for a breath."},{"name":"Written Doom","desc":"Ink a sentence and seal it; whoever breaks the seal inherits the doom inside."}],"progressionSteps":["Reach level 40 and copy the Register of Dooms by hand, error-free, learning what each pronouncement did to its speaker.","Pronounce your first anathema before the conclave, and stand present, years later, when it completes.","Lift a curse an elder of your order laid wrongly, and survive both the curse and the elder.","Hold an anathema unspoken on the tip of your tongue for a year, and let it die there unsaid."]},{"id":"cleric.t5a","name":"Ashen Saint","tier":5,"level":60,"parent":"cleric.t4a","role":"Mythic striker — final judgment made flesh","lore":"Each generation is granted at most one. The Ashen Saint has been through the god's fire and come out with nothing left that burns: no fear, no favor, no appetite for mercy beyond the exact amount owed. The church canonizes them while they live — an honor invented to keep them supervised.","playstyle":"Walk, judge, conclude. You are slow, inevitable, and untouchable by anything with sin on it; the daily sentence decides battles before they start.","abilities":[{"name":"Judgment Entire","desc":"Pronounce final judgment on one creature each day; no armor, oath, or rival god's favor mitigates the sentence."},{"name":"Pyre Unlit","desc":"The unrepentant near you smolder without flame, and lies spoken in your presence blister the tongue."},{"name":"Canon of Ash","desc":"Where your sentence lands, the ash consecrates the ground and every witness's oath becomes binding."},{"name":"Sainted Flesh","desc":"Blows against you fall away as ash; only doubt can cut you, and yours burned long ago."}],"progressionSteps":["Reach level 60, walk unarmed into a place your church refuses to name, and judge what rules there.","Burn on a heretic's pyre and step down from it when the argument is settled.","Accept canonization while still breathing, over the objections of everyone who loves you.","Judge yourself last, aloud and in public, and carry out whatever sentence the god sets."]},{"id":"cleric.t5b","name":"Living Reliquary","tier":5,"level":60,"parent":"cleric.t4b","role":"Mythic anchor — walking sanctuary and mass ward","lore":"They stop carrying holy things and become the holy thing carried. Pilgrim roads bend toward wherever a Living Reliquary is standing; shrines assemble around their stillness without masons; seven cathedrals already hold deeds to their bones. Armies have surrendered rather than fight across ground that walks.","playstyle":"You are the sacred ground. Every ally in your shadow fights under sanctuary law; move rarely, deliberately, and let the battlefield reorganize around you.","abilities":[{"name":"Ambulatory Sanctum","desc":"You are consecrated ground; every rule of sanctuary applies within your shadow, wherever it falls."},{"name":"Pilgrim's Touch","desc":"Allies who lay a hand on you shed curses, fear, and one mortal wound per day."},{"name":"The Promised Bones","desc":"You cannot be destroyed on hallowed ground, and you are always on hallowed ground."},{"name":"Bell Beneath the Skin","desc":"When you are struck, a bell tolls across the field; the faithful rally and the profane falter."}],"progressionSteps":["Reach level 60 and accept the Enshrinement: a relic sealed into your living flesh, whose demands you must survive.","Hallow ground openly in the enemy's capital, and leave by the front gate.","Let pilgrims wear a path to your door and turn none away, whatever they carry.","Watch the shrine they build around your stillness outgrow your name, and stay anyway."]},{"id":"cleric.t5c","name":"Wellspring Incarnate","tier":5,"level":60,"parent":"cleric.t4c","role":"Mythic healer — mass restoration and return","lore":"The lens stops channeling the light and becomes it. A Wellspring Incarnate no longer prays for mercy; they seep it — plagues end in provinces they cross, and a battlefield's dead can rise breathing on a single exhalation. Histories argue whether each was one person or several; the wells named after them still heal.","playstyle":"Radiance without effort: everything near you mends, always. The discipline is choosing what not to heal, and how much of yourself each great miracle spends.","abilities":[{"name":"Overflowing","desc":"You heal everything near you, constantly; choosing who not to heal is now the discipline."},{"name":"The Great Remission","desc":"Once a season, undo a catastrophe's wounds across a mile; sleep a week for every hundred restored."},{"name":"One Exhalation","desc":"Rekindle the newly dead across the field in a single breath; each returns with your heartbeat in their chest."},{"name":"Springhead","desc":"Wherever you finally die, a healing spring will rise; you have not yet tested this."}],"progressionSteps":["Reach level 60, then empty yourself into one miracle too large to survive, and be found alive anyway, three days on.","Close your ledger: forgive every debt of breath owed to you, by name, aloud.","End a plague by walking its province end to end, sleeping only in the sick-houses.","Let the god pour through until you cannot tell which memories are yours, and keep the ones that matter anyway."]},{"id":"cleric.t5d","name":"The Final Word","tier":5,"level":60,"parent":"cleric.t4d","role":"Mythic controller — fate pronounced and enforced","lore":"At the end of prophecy, speech stops predicting and starts deciding. The Final Word talks rarely — some not for years — because everything said comes due. Treaties hold if one merely attended the signing. Chroniclers record their sentences the way they record eclipses: exactly, and from a distance.","playstyle":"An economy of absolute utterances. Hold your silence like a drawn weapon, position for the perfect sentence, and spend words the way others spend lives.","abilities":[{"name":"Pronouncement","desc":"Speak a fate aloud once per battle; reality complies within the hour by the shortest road it finds."},{"name":"The Kept Silence","desc":"While you have not spoken, allies act as though forewarned and enemies as though accused."},{"name":"Unwriting","desc":"Declare one recent event untrue; the world keeps the scar but not the wound."},{"name":"Witnessed","desc":"Anything sworn in your hearing binds; oathbreakers learn what your attention costs."}],"progressionSteps":["Reach level 60 and keep a decade's vow of silence, breaking it once, for a sentence the histories still argue over.","Speak your own ending aloud — date, place, and manner — and live toward it without flinching.","Refuse the god a word once: keep your mouth shut when it wants opening, and bear the cost.","Attend a war's last parley, end it with one sentence, and walk home unescorted."]}]},{"id":"druid","name":"Druid","archetype":"Spirit","icon":"🌿","tagline":"Speak for the green; wear what it lends you.","description":"Before the first wall there was an accord: the people would take only what the green could spare, and the green would remember them. Druids keep that fading contract. They speak for root and beast in the courts of men, and when words fail they borrow the forest's shapes and seasons — a bear's back, a winter's patience — and settle the account themselves.","nodes":[{"id":"druid.t1","name":"Druid","tier":1,"level":1,"parent":null,"role":"Hybrid adept — spells, shapes, and support","lore":"Druids are found, not recruited. A child who wanders home late with sap in her hair and a fox's patience in her eyes; a woodcutter who set the axe down mid-swing and never picked it up. The old accord chooses its keepers, and the circles teach the chosen only what they already half know.","playstyle":"Versatile beginner: lash with thorns, mend with growth, and slip into small borrowed shapes. Weak at everything, present everywhere, learning which half of the accord calls loudest.","abilities":[{"name":"Thornlash","desc":"A whip of living briar strikes the target and roots them in place for two seconds."},{"name":"Second Skin","desc":"Take a lean wolf-shape for ten seconds, trading spells for speed and a worrying bite."},{"name":"Green Whisper","desc":"Coax a wound closed with hastened growth, healing an ally over six seconds."},{"name":"Read the Loam","desc":"Learn everything that crossed this ground in the last day: numbers, weight, and wounds."}],"progressionSteps":["Answer the summons only you heard: leave the road at dusk and walk until the trees stop being scenery.","Sleep a full winter night against an elder oak and wake knowing one word of its slow language.","Keep a dying thing company until it finishes — no mercy stroke, no prayer — and understand why the circle watched you do it.","Swear the accord at the moot of three groves: take only what is spared, and answer when the green calls."]},{"id":"druid.t2a","name":"Skinshifter","tier":2,"level":10,"parent":"druid.t1","role":"Frontline shapeshifter — adaptive melee brawler","lore":"The circle grants the second gift only to those who can come back from it. Skinshifters wear bear and wolf first, honest shapes with honest appetites, and learn the discipline of returning. Villages hire them against raiders and worse; the wise pay promptly, having seen what a patient person with a bear's arms can do.","playstyle":"Adaptive frontline: open in bear to hold the line, break to wolf to run down the fleeing, and return to your own skin only when the work is done.","abilities":[{"name":"Ursa Mantle","desc":"Assume bear-shape: doubled health, sweeping claws, and a taunt-roar that dares everything nearby to try."},{"name":"Loping Shape","desc":"Assume wolf-shape: gain sprint speed, and each bite leaves a bleed that stacks three times."},{"name":"Marrow Memory","desc":"Shifting shapes mends you; the body forgets a portion of its wounds with each change."},{"name":"Hackles","desc":"Sense hostile intent within thirty paces before it moves, even while wearing your own skin."}],"progressionSteps":["Reach level 10 and run three nights with a wild pack, taking no kill and no shelter, until they stop watching you.","Wear the wolf until your own name sounds strange, then set it down and answer to that name anyway.","Let the circle sew your first pelt-cord and wear it always: a promise that the skin comes off.","Kill in a borrowed shape only once this year, for food, and eat all of it."]},{"id":"druid.t2b","name":"Grovespeaker","tier":2,"level":10,"parent":"druid.t1","role":"Zone controller — terrain, sustain, slow attrition","lore":"When a forest needs a voice at a treaty table, it grows one. Grovespeakers spend seasons in the moot-glades, learning the twin vocabularies of growth and rot, and emerge speaking for constituencies that measure debate in centuries. Loggers and land-hungry barons have learned that an ignored Grovespeaker's silence costs more than their words.","playstyle":"Patient control: raise bracken walls, root the reckless, and let slow rot make your argument. You win fights the way forests do — by still being there.","abilities":[{"name":"Raise the Bracken","desc":"Grow a wall of interwoven fern and thorn along a chosen line; it burns slowly and regrows quickly."},{"name":"Root Verdict","desc":"Roots erupt to bind up to three enemies for four seconds or until each is struck twice."},{"name":"Sap Surge","desc":"Flood an ally with rising sap: strong regeneration, and their next wound closes on its own."},{"name":"First Rot","desc":"Mark a foe for decay: armor softens and wounds fester, worsening over ten seconds."}],"progressionSteps":["Reach level 10 and sit a full session of the grove-moot without speaking; be the first human it does not adjourn for.","Plead a condemned grove's case before the men who hold the axes, and leave with the grove standing.","Tend one tree from seed through its first winter, and grieve honestly if you fail.","Learn the second vocabulary: find what the rot is saying beneath the loveliest glade, and repeat it without flinching."]},{"id":"druid.t3a","name":"Clawsworn","tier":3,"level":25,"parent":"druid.t2a","role":"Melee striker — bleeds and sustained pressure","lore":"Clawsworn take a vow written in nothing but scars: the shape is a covenant, not a costume. They fight in fur more than skin, keep territories like wolves, and serve as their circles' answer to armored men. The vow's price is plain — kill only what you would eat, and mourn everything you kill.","playstyle":"Committed melee: stalk, open with a hamstring, and stack bleeds until the target's options are kneeling or falling. Leaving beast-shape mid-fight feels like retreat.","abilities":[{"name":"Half-Pelt","desc":"Take a hybrid war-shape for twenty seconds: clawed hands, human cunning, and neither form's weaknesses."},{"name":"Hamstring Rite","desc":"A low, precise tear slows the target and deepens the bleeding of every later wound."},{"name":"Scent of Openings","desc":"Attacks against bleeding enemies gain critical chance for each bleed they carry."},{"name":"Kill-Memory","desc":"Executing a bleeding foe below one-quarter health refunds Half-Pelt and heals you for the remainder."}],"progressionSteps":["Reach level 25 and bring down a stag in wolf-shape using no magic but the shape itself.","Take a territory of your own and hold it one full season against everything that contests it, in fur, alone.","Fight a rival predator to submission and let it live, so the wild learns you kill only to eat.","Swear the claw-vow over your own spilled blood: the shape is covenant, not costume."]},{"id":"druid.t3b","name":"Elderform","tier":3,"level":25,"parent":"druid.t2a","role":"Flex combatant — form-cycling answers to everything","lore":"The earth keeps records in bone-seams and amber, and the Elderform learn to read them aloud. They petition extinct shapes out of deep time — river-things with too many jaws, horn-backed grazers like moving hills — and pay in years of their own. Scholars call the practice necromancy's cousin. Druids call it remembering on the land's behalf.","playstyle":"Form-cycling flexibility: answer each threat with a shape the world forgot, spending remembered years as your resource. Never the same beast twice in one fight.","abilities":[{"name":"Fossil Recall","desc":"Assume an extinct form from your bone-ledger; each grants a body no living beast can match."},{"name":"Antediluvian Hide","desc":"While in an elder shape, ignore the first three blows from every new attacker; old skin has learned."},{"name":"Shape Debt","desc":"Swapping elder forms mid-combat refunds half the cost and staggers enemies who witness it."},{"name":"Unwalked Gait","desc":"Briefly take a shape without bones — spore-haze, eel-shadow — and pass through spaces bodies cannot."}],"progressionSteps":["Reach level 25 and descend to a bone-seam where the earth keeps its dead shapes; sleep among them until one dreams of you.","Carry a fossil a hundred leagues to where the creature last lived, and speak its extinction aloud there.","Wear an elder shape for one full day and pay its tithe of years without bargaining.","Open your bone-ledger: three shapes remembered, named, and promised they will walk again."]},{"id":"druid.t3c","name":"Thorn Shepherd","tier":3,"level":25,"parent":"druid.t2b","role":"Battlefield architect — walls, lanes, area denial","lore":"Thorn Shepherds herd bramble the way others herd sheep, driving hedge-flocks along old boundary lines that maps stopped honoring. Border villages leave them milk and iron nails; ambitious surveyors leave them alone. Where a Shepherd has walked, fields keep their old shapes, roads narrow politely, and fences grow back overnight with opinions.","playstyle":"Living-terrain control: drive briar droves across the field, pen enemies into kill-lanes, and graft armor onto allies. The battlefield's geometry is yours to rewrite.","abilities":[{"name":"Briar Drove","desc":"Drive a moving wall of thorn across the field, carrying enemies with it and shredding those who resist."},{"name":"Graft","desc":"Bind living wood over an ally's wounds: temporary armor that blooms, then heals as it sheds."},{"name":"Seed the Breach","desc":"Hurl a seed that erupts instantly into full-grown hedge, sealing a gap, gate, or doorway."},{"name":"Pollard","desc":"Prune an enemy's momentum: their next three attacks are cut back to half damage."}],"progressionSteps":["Reach level 25 and raise a hedge around a burning village faster than the fire can walk.","Drive a bramble-flock along a forgotten boundary for a month, sleeping inside it, losing not one cane.","Face a surveyor's armed crew at a marker stone and turn them back without a single death.","Learn each thorn's name for hunger, and feed your flock only what the accord allows."]},{"id":"druid.t3d","name":"Rotwright","tier":3,"level":25,"parent":"druid.t2b","role":"Attrition caster — decay, links, anti-healing","lore":"Rotwrights work the accord's unglamorous half: everything owed back to the soil, collected on schedule. They read mold like scripture and keep the mycelial ledgers that link forest to forest underground. Grain-lords hate them; healers quietly consult them. A Rotwright at a deathbed is not an omen — it is a bookkeeping.","playstyle":"Attrition and inevitability: seed decay early, thread your enemies through the ledger, and let time do its honest work while you stay patient.","abilities":[{"name":"Wet Autumn","desc":"Call a soft, spore-heavy rain over an area; everything hostile inside decays faster each second it stays."},{"name":"Mycelial Ledger","desc":"Thread enemies together underground; damage dealt to one is partly owed by all."},{"name":"Sweet Rot","desc":"Compost an active decay effect on an enemy into healing for a nearby ally."},{"name":"Rust Sermon","desc":"Preach to metal: armor, blades, and hinges within earshot begin to flake and fail."}],"progressionSteps":["Reach level 25 and sit with one felled oak from windfall to soil, keeping a ledger of everything that eats it.","Trace a mycelial thread between two forests a day's ride apart, on foot, never losing it.","Break a false embalming: give a hoarded corpse back to the ground over its family's objections, gently.","Eat only what the rot offers you for one season, and thrive."]},{"id":"druid.t4a","name":"Bloodpelt","tier":4,"level":40,"parent":"druid.t3a","role":"Apex melee — frenzy, pursuit, self-sustain","lore":"Bloodpelts are what circles send when a monster starts hunting men. The pelt-cord has been re-sewn so many times it is mostly scar, and the shape comes off slower each year — a price accounted, not hidden. Lords who joke about leashing one are corrected exactly once, usually by their own huntsmen, quietly.","playstyle":"Apex melee: enter the frenzy window, drink wounds as fuel, and refuse every disengage. Nothing you have marked escapes; little you catch survives.","abilities":[{"name":"Season of Teeth","desc":"For twelve seconds, attack speed climbs with every bleed you inflict, without ceiling."},{"name":"Wound-Drinker","desc":"Every bleed tick on every enemy you wounded returns a portion to you as health."},{"name":"Broken Chase","desc":"Nothing slows, roots, or frightens you while pursuing a marked quarry."},{"name":"Red Quiet","desc":"On a kill, terror settles over nearby foes; those who flee bleed as if bitten."}],"progressionSteps":["Reach level 40 and take the hunt no bounty could close — the beast that eats hunters — wearing the shape it fears.","Let the circle re-sew your pelt-cord with your own sinew, and do not cry out.","Spend an entire winter as beast, and return in spring answering to your name on the first call.","Refuse a king's leash in his own hall, in your own skin, politely."]},{"id":"druid.t4b","name":"Thousandskin","tier":4,"level":40,"parent":"druid.t3b","role":"Shape economy — evasion, decoys, total flexibility","lore":"The Thousandskin keep bound ledgers of shapes the way misers keep coin. They can be the crows above a gallows, the eel beneath the ferry, the grey dog at a traitor's hearth. Circles deploy them when truth must be witnessed by something nobody lies in front of. Their own faces, folded away and rarely worn, stop aging.","playstyle":"Shape economy: rotate impossible forms to answer every threat, scatter into swarms to shed damage, and bank shapes like currency for the decisive moment.","abilities":[{"name":"Murmuration","desc":"Scatter into a wheeling flock for six seconds; blows pass through, and you reform anywhere within it."},{"name":"Borrowed Centuries","desc":"Chain three elder forms in sequence without cost; the third arrives with doubled power."},{"name":"Skinfall","desc":"Step out of your current shape, leaving it fighting as a decoy for eight seconds."},{"name":"The Unlisted Shape","desc":"Once a day, become a shape you have never recorded; not even you know its limits until worn."}],"progressionSteps":["Reach level 40 and hold nine shapes through a single hour of battle, ending in your own, unbled.","Complete a page of your ledger no other druid can read, and bind it in your own shed skin.","Live a month as something small and eaten-of — mouse, minnow, moth — and come back unbitter.","Witness a crime as three creatures at once, and give testimony the judges cannot dismiss."]},{"id":"druid.t4c","name":"Heartwood Regent","tier":4,"level":40,"parent":"druid.t3c","role":"Siege controller — living-terrain warfare at scale","lore":"A Heartwood Regent holds regency over standing forests the way stewards hold castles for absent kings — except the forest is awake, and consulted. They count rings the way clerks count taxes, wake heartwood for war only when the moot consents, and have marched whole treelines to new rivers. Two kingdoms keep treaties with individual Regents by name.","playstyle":"Grand-scale control: wake the stand, give the march order, and fight from inside a moving forest. Your army was always standing there; now it agrees to walk.","abilities":[{"name":"Wake the Stand","desc":"Rouse every tree in the grove to fight; the elders swing hardest and remember grudges."},{"name":"March Order","desc":"The woken forest advances as a line, carrying allies in its canopy and grinding stonework beneath."},{"name":"Ringcount","desc":"Armor yourself in accumulated years: gain one ring of damage reduction per century of forest present."},{"name":"Crown Verdict","desc":"The canopy closes overhead: no flight, no sky-sight, and arrows lose their way in the dark."}],"progressionSteps":["Reach level 40 and persuade a first-growth forest to walk one league and back without losing a single elder.","Sit regency through a moot that lasts a human year, and cast your one vote well.","Turn back fire, axe, and royal charter from your wardship in the same season.","Bury your predecessor among the roots and carry their ring-staff until the forest stops grieving."]},{"id":"druid.t4d","name":"Carrion Gardener","tier":4,"level":40,"parent":"druid.t3d","role":"Endgame attrition — corpse-blooms and structural decay","lore":"Carrion Gardeners walk battlefields after the crows and before the historians. Their order holds a single charter: nothing wasted, no plague raised, no glory left standing long enough to fester. Generals petition to keep their dead; the Gardeners decline with terrible courtesy. Meadows across three provinces bloom where their worst arguments were won.","playstyle":"Sanctified attrition: seed the field early, let every death feed your blooms, and grow stronger as the battle lengthens. Endings are your element.","abilities":[{"name":"Field Tithe","desc":"Each corpse on the field sprouts a spore-bloom that fights for you until it is spent."},{"name":"Gentle Ruin","desc":"Touch a wall, engine, or gate; its next decades of decay arrive over ten seconds."},{"name":"Patient Cloud","desc":"Loose a drifting spore-fog: enemies inside weaken steadily and cannot regain health."},{"name":"Terrible Courtesy","desc":"Offer one enemy a painless withering; refusal makes every decay effect on them permanent."}],"progressionSteps":["Reach level 40 and turn a fresh battlefield to meadow in one season, raising no plague and keeping no trophy.","Decline a weeping general's petition for his son's body, and be gentle enough that he thanks you within the year.","Take the charter-vow over an open grave: nothing wasted, nothing raised.","Garden the ruin of a plague-town until children can be raised on what grows there."]},{"id":"druid.t5a","name":"First Predator","tier":5,"level":60,"parent":"druid.t4a","role":"Unstoppable hunter — infinite-scaling single-target pursuit","lore":"The First Predator wears the shape every prey animal remembers without being taught. Wolves lie down when it passes; nothing in the wild will meet its eye. Circles invoke it perhaps once a generation, when something has begun hunting the world itself, and afterward the histories go carefully quiet about what was seen.","playstyle":"Ultimate pursuit: mark your quarry, and geography, armies, and time stop mattering. Everything else in the fight is scenery between you and the throat.","abilities":[{"name":"Original Hunger","desc":"Your damage climbs the longer a hunt lasts, without cap, resetting only at the kill."},{"name":"The Oldest Chase","desc":"Mark one quarry; while you live it cannot become untrackable, unreachable, or unkillable by any means."},{"name":"All Fangs Answer","desc":"Every predator within a day's travel converges to hunt beside you until the quarry falls."},{"name":"Prey's Memory","desc":"Enemies who see you suffer the fear their ancestors learned; most kneel, some flee, none aim well."}],"progressionSteps":["At level 60, run the Long Hunt: pursue one quarry through three seasons without losing the trail for a single night.","Find the den where the first hunger dreams, and take its shape without waking it.","Spare something at the end of a perfect hunt, once, to prove the shape has not eaten the vow.","Let the wild rename you, and answer to nothing men call you afterward."]},{"id":"druid.t5b","name":"The Unshaped","tier":5,"level":60,"parent":"druid.t4b","role":"Omniform — any role at any moment","lore":"The Unshaped gave their birth-shape back to the earth and did not replace it. What remains prefers forms the way weather prefers valleys — habitually, not necessarily. Two circles keep an empty chair for one; whether the chair has ever actually been empty is a question druids find funnier than anyone else does.","playstyle":"Total fluidity: answer every threat by becoming its counter, flow between shapes without pause, and treat being a target as an optional condition.","abilities":[{"name":"No True Body","desc":"Between shapes you are briefly nothing; blows, curses, and prophecies pass through."},{"name":"Everything, Once","desc":"Assume the exact form of any creature you can see, including its abilities, for twenty seconds."},{"name":"Signature Absence","desc":"Effects that target a creature fail to find you unless you consent."},{"name":"Refused Finality","desc":"The first killing blow each day finds you already being something it cannot kill."}],"progressionSteps":["At level 60, give your birth-shape to the earth at the moot of three groves, and walk away as whatever comes next.","Spend a year borrowing a different shape each dawn, and want none of them back.","Pass through the eye of a needle, honestly, before witnesses.","Sit in the empty chair your circle keeps, and let them wonder ever after whether you were there."]},{"id":"druid.t5c","name":"Worldroot","tier":5,"level":60,"parent":"druid.t4c","role":"Continental controller — the forest itself fights","lore":"Histories disagree about whether the Worldroot is a person any longer. Their heart is planted in the oldest grove; their pulse comes up through taproots on three coasts. When a forest anywhere is put to the torch, somewhere the Worldroot's body burns too, and the reply arrives through the ground, patient and total.","playstyle":"Continental presence: fight from every rooted thing at once, surfacing wherever the green touches. Battles are local affairs; you have stopped being local.","abilities":[{"name":"Continental Grip","desc":"Roots answer you anywhere soil exists, seizing armies a kingdom away from where you stand."},{"name":"The Green Immensity","desc":"For one minute, all terrain in sight becomes forest, and the forest is on your side."},{"name":"Sap of Ages","desc":"Every ally touching earth regenerates as though sleeping safe in high summer."},{"name":"One Long Ring","desc":"Your death is deferred to the end of the current century; damage is recorded, not suffered."}],"progressionSteps":["At level 60, plant your living heart beneath the oldest grove and learn to wake in every tree it touches.","Answer a burning on a coast you have never seen, through the ground, within a day.","Feed a famine from your own rings and let no one learn whom to thank.","Outgrow your name: when the histories argue whether you were ever one person, decline to settle it."]},{"id":"druid.t5d","name":"The Last Autumn","tier":5,"level":60,"parent":"druid.t4d","role":"Inevitability aura — the fight ages around you","lore":"Every few centuries the accord requires a final instrument, and a Rotwright's line produces one. The Last Autumn carries the year's fourth season with them; where they linger, harvests hurry, iron blushes, and empires feel their age. The histories record three. Each is remembered less as a person than as a very reasonable ending.","playstyle":"Inevitability incarnate: your presence is the mechanic. Everything in the fight ripens toward its end; you decide only the order, and the mercy.","abilities":[{"name":"Everything Ripens","desc":"Aura: all cooldowns, wounds, poisons, and lifespans within sight run measurably faster."},{"name":"Kingdom Compost","desc":"Declare a structure finished: it settles into fertile loam over one minute, regardless of stone or ward."},{"name":"The Long Fall","desc":"Leaves fall out of season across a chosen army; morale, armor, and certainty fall with them."},{"name":"Mercy of Mulch","desc":"A fallen ally is taken into the soil and returned at dusk, alive, smelling of rain."}],"progressionSteps":["At level 60, ask the turning year for its last season and carry it ever afterward, so autumn arrives wherever you stand.","End something beloved that outlived its kindness — an orchard, an order, a king's long peace — and be right.","Walk unarmed through the empire that burned the moot-glades, and leave it a legend of gentle, total subsidence.","Refuse the winter: prove three times that you are the ending before the ending, and nothing further."]}]},{"id":"monk","name":"Monk","archetype":"Spirit","icon":"🧘","tagline":"The body is the temple; the fist is the bell.","description":"The Monk surrendered every possession at the cloister door and kept only breath, bone, and discipline. Years of fasting, stillness, and ten thousand repetitions forged the body into an instrument that needs no blade and fears no siege. Some temper the flesh until steel means nothing; others learn the breath beneath the flesh and strike what armor cannot cover. Both roads end in the same silence.","nodes":[{"id":"monk.t1","name":"Monk","tier":1,"level":1,"parent":null,"role":"Melee striker — unarmed, fast, self-reliant","lore":"Every mountain cloister keeps a novice-roll of those who arrived with nothing and asked to be less. Village orphans, deserters, disgraced scholars — the gate does not ask. They sweep, fast, and repeat the First Form ten thousand times, learning that the body, properly instructed, is the only possession that cannot be taken.","playstyle":"Chain short unarmed strikes into rhythm, weaving between blows; you have no gear to break and no weapon to lose, only tempo.","abilities":[{"name":"First Form: Falling Water","desc":"A three-hit open-hand sequence; each strike lands faster than the last and refunds a sliver of stamina."},{"name":"Measured Breath","desc":"Spend a still moment to steady the lungs, cleansing one minor ailment and restoring focus."},{"name":"Open Guard","desc":"Deflect the next weapon strike with a bare forearm, taking reduced damage and no stagger."},{"name":"Beggar's Footing","desc":"Move at full speed across rubble, ice, and rooftops; poverty taught you every surface."}],"progressionSteps":["Arrive at a cloister gate carrying nothing; whatever you still own will be burned on the threshold.","Kneel outside for three days without asking entry; the door opens for patience, never for knocking.","Surrender your name to the novice-roll and answer only to the work you are given.","Repeat the First Form until your hands finish it in your sleep, then begin learning it properly."]},{"id":"monk.t2a","name":"Iron Vessel","tier":2,"level":10,"parent":"monk.t1","role":"Frontline bruiser — armorless endurance","lore":"At the tenth year some novices are led to the cold hall, where the outer discipline begins. Iron Vessels stand beneath winter falls, take the staff without flinching, and cure their skin like bell-bronze. Soldiers mock the bare chest exactly once. The cloister sends them where the fighting will be worst and longest.","playstyle":"Wade in unarmored and stay there; convert punishment into steadiness, trading flourish for the certainty that you will still be standing.","abilities":[{"name":"Bellbronze Skin","desc":"Years of tempering grant flat damage reduction against all physical harm; you wear no armor and need none."},{"name":"Root Below Root","desc":"Plant your stance; you cannot be knocked down, dragged, or thrown while your feet hold the earth."},{"name":"Swallowed Thunder","desc":"Absorb a blow's force into the breath and release it through your next strike as added weight."}],"progressionSteps":["Reach level 10 and stand the Trial of the Ford: remain in the winter river until the ice accepts you.","Take one hundred staff-blows from your teachers without stepping back, counting each aloud so the count never wavers.","Sleep a full season on bare stone without fire, and rise each morning without complaint.","Shatter the cured oak striking-post with your forearm, then stand where it stood for a day."]},{"id":"monk.t2b","name":"Breathbinder","tier":2,"level":10,"parent":"monk.t1","role":"Mobile skirmisher — ki bursts, closing distance","lore":"Others are led inward, to the breathing hall where nothing moves but air. Breathbinders learn that breath is the hinge between body and spirit, and a hinge can be swung. They snuff candles at nine paces, cross rooms in a stride too short to see, and speak rarely, hoarding the breath.","playstyle":"Dart in, spend stored breath on sudden force, and be gone before the counterswing; your resource is patience made explosive.","abilities":[{"name":"Bound Breath","desc":"Hold and compress a breath over several heartbeats, storing force you may release through any later strike."},{"name":"The Shortened Road","desc":"Step once and arrive several paces away, crossing pits, flames, and spears as if they were rumor."},{"name":"Exhaled Edge","desc":"Release a focused breath as a cutting lash of force, striking a target beyond arm's reach."},{"name":"Reed in Current","desc":"Bend around an incoming blow without moving your feet, letting it pass through where you almost were."}],"progressionSteps":["Reach level 10 and hold a single breath through the whole of the Night Litany, from first bell to last.","Extinguish nine candles from nine paces with one exhalation, disturbing none of the smoke.","Cross the gorge bridge blindfolded, placing each foot where your breath says the rope will be."]},{"id":"monk.t3a","name":"Unmoved Pillar","tier":3,"level":25,"parent":"monk.t2a","role":"Anchor tank — zone denial, punishing patience","lore":"Garrisons petition the cloister for an Unmoved Pillar the way they petition for grain. One stands where the line must not break — a gate, a ford, a stair — and the line does not break there. They do not pursue. Whatever comes to move them becomes, briefly, an education in why nothing does.","playstyle":"Claim a piece of ground and make it law; enemies who test you are held, slowed, and returned their own violence with interest.","abilities":[{"name":"Stance of the Last Door","desc":"While stationary, enemies cannot pass through your reach; the first each round that tries is stopped cold."},{"name":"Weight of Stillness","desc":"Your calm presses outward; enemies within reach strike slower, as if moving through deep water."},{"name":"Returned With Interest","desc":"Store a portion of damage taken while rooted and deliver it back through your next palm strike."},{"name":"Patience of Stone","desc":"Each round you do not move, gain stacking damage reduction, kept until you take a step."}],"progressionSteps":["Reach level 25 and hold a single doorway against all comers from dusk-bell to dawn-bell, yielding not one step.","Sit the Long Vigil: forty days at the cloister gate, moving only for breath, while pilgrims mistake you for statuary.","Stand in the path of a charge of horse and be the reason it becomes a halt."]},{"id":"monk.t3b","name":"Idolbreaker","tier":3,"level":25,"parent":"monk.t2a","role":"Armor-breaker striker — demolition of the fortified","lore":"When a false god's shrine must come down and no army can be spared, the cloister sends one Idolbreaker with empty hands. They study a thing until they find where it lies about its own strength, then strike there once. Stone idols, warded doors, champions in proofed plate — everything has a fault.","playstyle":"Read the target, wait for the opening, then commit everything to a single decisive strike that ignores what the enemy trusted most.","abilities":[{"name":"Sutra of Breaking","desc":"Your strikes treat armor, shields, and stone as if they were unfired clay, ignoring physical hardness."},{"name":"Fault-Finding Eye","desc":"Study a target briefly to reveal its structural flaw; your next strike against that flaw cannot be mitigated."},{"name":"Third Knuckle","desc":"Land a blow that seems gentle; the true force arrives three heartbeats later, deep inside the target."}],"progressionSteps":["Reach level 25 and split a millstone with one bare palm, on the first and only strike you are allowed.","Enter a shrine of a devouring god and leave nothing standing above knee height, taking no relic for yourself.","Break a champion's shield, then his sword, then his nerve, and let him walk away to say so."]},{"id":"monk.t3c","name":"Pilgrim of Nowhere","tier":3,"level":25,"parent":"monk.t2b","role":"Hit-and-fade skirmisher — impossible mobility","lore":"Some Breathbinders notice that the road is a suggestion. Pilgrims of Nowhere walk paths that appear on no map and close behind them, arriving before the messenger who announced them. Border lords post rewards; the desperate leave rice at crossroads. Neither has any measurable effect on where a Pilgrim goes.","playstyle":"Never be where the answer lands; step through walls of spears, strike from the flank that did not exist, and leave.","abilities":[{"name":"Step Between","desc":"Cross several paces instantly, passing through obstacles, foes, and closed doors as though the world briefly forgot them."},{"name":"Crossroads Memory","desc":"Mark a place you have stood; once per battle, return to it from anywhere in sight."},{"name":"Arrive Unannounced","desc":"Your first strike after a step lands as a critical against any foe that has not yet seen you."}],"progressionSteps":["Reach level 25 and walk from the cloister to the sea in three days, though the road takes seven.","Cross a sealed border without touching gate, wall, or river, and bring back something only the far side grows.","Stand at a crossroads at midnight until you can no longer say which road brought you there, then choose none of them."]},{"id":"monk.t3d","name":"Hollow Hand","tier":3,"level":25,"parent":"monk.t2b","role":"Spirit-striker — bypasses flesh and armor","lore":"The deepest breathing teaches that flesh is a curtain, and a curtain can be reached past. Hollow Hands leave no bruise and stop hearts; they quiet possessing spirits and lay restless dead with a touch. Clergy request them in unsigned letters. No one who has watched them work requests them twice lightly.","playstyle":"Slip past every defense the enemy built and strike the occupant directly; armor, wards, and even flesh are someone else's problem.","abilities":[{"name":"Curtain Strike","desc":"Your palm passes force through armor, shield, and skin untouched, wounding only what lives underneath."},{"name":"Quieting Touch","desc":"Press two fingers to a caster's sternum; their voice and their magic go silent for a time."},{"name":"Strike the Tenant","desc":"Deal grievous harm to spirits, possessors, and the undead by hitting the ghost rather than the housing."}],"progressionSteps":["Reach level 25 and snuff a candle from a full pace away without disturbing its smoke.","Strike the demonstration bell so it sounds inside each listener's chest and not at all in the air.","Lay a restless ghost with one touch, and take nothing from the grieving but your leave."]},{"id":"monk.t4a","name":"Stillgate","tier":4,"level":40,"parent":"monk.t3a","role":"Living fortification — absolute ground control","lore":"There are never more than a dozen Stillgates alive, and the war-colleges of three empires chart their whereabouts like weather. When a Stillgate accepts a post, the post holds; that is the order's whole doctrine, and no siege in written memory has amended it. Armies reroute rather than test the record.","playstyle":"Become the terrain; while you hold your ground nothing crosses, nothing moves you, and every plan that assumed otherwise dies expensively.","abilities":[{"name":"The Post Is Held","desc":"While you remain at your chosen ground, gain immense damage reduction and force all foes in reach to face you."},{"name":"Threshold Law","desc":"Once each round, an enemy attempting to pass you is simply stopped, its momentum returned as staggering force."},{"name":"Doctrine of Remaining","desc":"Once per battle, an attack that would fell you leaves you at one breath instead, provided you have not moved."}],"progressionSteps":["Reach level 40 and hold a breach alone against a named army until relief arrives, or does not.","Be offered honorable retreat by heralds three times in one night, and decline three times, courteously.","Learn that enemy maps now ink your standing-place as a fortification, and let this change nothing in you."]},{"id":"monk.t4b","name":"Palm of Ruin","tier":4,"level":40,"parent":"monk.t3b","role":"Siegebreaker — single blows that end architecture","lore":"Cities have paid the cloister handsomely for the assurance that no Palm of Ruin is currently traveling toward them. These few study a fortress the way physicians study a dying man, then conclude it with one strike. They demolish tyrannies by removing the walls tyranny requires, and they charge nothing for it.","playstyle":"Spend long moments reading, then release a single strike that settles the question; everything about you is preparation for one instant.","abilities":[{"name":"One-Palm Demolition","desc":"After a full round of stillness, deliver a blow that collapses gates, walls, and constructs outright."},{"name":"Ruin Reads the Wall","desc":"Perceive the fault-lines in any structure or armored foe at a glance, through stone if need be."},{"name":"Aftershock Sutra","desc":"Your great strikes echo; the target and everything touching it take a second, lesser toll one heartbeat later."}],"progressionSteps":["Reach level 40 and bring down a warded citadel gate with a single strike, after nine days of silent study.","Accept a tyrant's payment to raze a village, return the coin, and perform the demolition on his hall instead.","Leave one wall of the razed fortress standing, so the survivors have shade to grieve in."]},{"id":"monk.t4c","name":"Roadless Saint","tier":4,"level":40,"parent":"monk.t3c","role":"Phantom skirmisher — battlefield-wide presence","lore":"A Roadless Saint no longer finds the hidden roads; the roads find them. Witnesses swear one stood in two doorways in the same breath, and both doorways agree. Generals pay for the rumor of a Saint's favor, since the reality cannot be bought, followed, borrowed, or confirmed until it has already happened.","playstyle":"Treat the whole battlefield as adjacent; appear where you are needed, strike where you are not expected, and be counted twice.","abilities":[{"name":"Two Doorways","desc":"Briefly stand in two places at once; both may strike, and only one was ever really there."},{"name":"The Unwalked Way","desc":"Open a hidden path a short distance; allies may follow before it closes and forgets itself."},{"name":"Absent Step","desc":"Once per round, an attack that should have hit you finds you were never in that place."}],"progressionSteps":["Reach level 40 and attend your own funeral rites in a distant province, leaving without correcting anyone.","Guide a hundred refugees through a mountain pass that the pursuing soldiers swear on their lives does not exist.","Walk out of a sealed oubliette, and never mention it, even when asked by the one who sealed it."]},{"id":"monk.t4d","name":"Heart-Stiller","tier":4,"level":40,"parent":"monk.t3d","role":"Executioner — clean, woundless single-target death","lore":"Heart-Stillers are named in treaties. Certain wars have ended on the rumor that one had taken an interest; certain kings sleep in rooms without doors because of them. They kill without wound and without appetite, and what is more feared, they sometimes decline, and no offer improves the answer.","playstyle":"Choose the one death that ends the battle and administer it precisely; everything else on the field is a distraction to be endured.","abilities":[{"name":"Stilling Palm","desc":"Against a weakened foe, stop the heart outright; the body shows no wound and no violence."},{"name":"Held Verdict","desc":"Touch a foe and defer the blow; the stored death lands whenever you speak the word, hours later if you wish."},{"name":"Unstrung Knees","desc":"Strike the resolve rather than the body; enemies around you falter, slow, and lose the will to press."}],"progressionSteps":["Reach level 40 and stop a bull's heart with two fingers, restart it with two more, and master the trembling afterward.","Be listed by name in a peace treaty as a weapon, and attend the signing unarmed and unintroduced.","Refuse a king's execution order to his face, and let the silence escort you out."]},{"id":"monk.t5a","name":"Seated Mountain","tier":5,"level":60,"parent":"monk.t4a","role":"Immovable colossus — battlefield-defining bulwark","lore":"The histories admit to three. A Seated Mountain sits down and becomes geography: empires reroute roads, storms divide, and sieges starve around a figure that has stopped distinguishing itself from the hill it occupies. Pilgrims cannot always tell which weathered shape on the ridge is the one still breathing.","playstyle":"Sit where the world will break and refuse to let it; you are less a combatant than a fixed fact enemies must survive.","abilities":[{"name":"Geography","desc":"While seated, allies behind you cannot be targeted, and weather, spells, and charges divide around your stillness."},{"name":"The Refusal","desc":"Once per battle, decline a catastrophe; one cataclysmic attack, collapse, or working simply does not occur within your reach."},{"name":"Erosion's Pace","desc":"All damage you take is deferred and drained away slowly, as weathering, over hours you can afford."}],"progressionSteps":["Reach level 60 and seat yourself where the coming war will be worst, before anyone else knows a war is coming.","Outlast a siege in which you are the objective; let the army starve around your stillness and go home.","Refuse a god's direct command to move, and be found still seated when the shrine is rebuilt around you."]},{"id":"monk.t5b","name":"Iron Knell","tier":5,"level":60,"parent":"monk.t4b","role":"Cataclysmic striker — one blow, one ending","lore":"The falling temple bell, made flesh. When an Iron Knell strikes with intent, the sound arrives in neighboring provinces as a single toll with no bell to blame. Their blows are recorded in the annals as dates, and what stood before each date is described in the past tense.","playstyle":"Everything is wind-up for the one strike; when it lands, the battle reorganizes itself around what is suddenly no longer there.","abilities":[{"name":"The Toll","desc":"Your strike sounds through everything nearby; all who hear it are staggered, deafened, and briefly unable to act."},{"name":"One Date in the Annals","desc":"Once per day, deliver a blow that permanently sunders what it hits; what breaks does not mend."},{"name":"Resonant Marrow","desc":"Your bones ring under impact; whoever strikes you takes the echo of their own blow returned."},{"name":"The Silence After","desc":"For a breath after your great strike, nothing within earshot may move, cast, or cry out."}],"progressionSteps":["Reach level 60 and strike the cracked great bell of a fallen temple so it rings true once more, then never again.","Unmake with one blow a fortress that took a generation to raise, and stay a season to bury its dead.","Let the historians ask what engine did it, and let no answer survive you."]},{"id":"monk.t5c","name":"Tenth Step","tier":5,"level":60,"parent":"monk.t4c","role":"Omnipresent phantom — arrives before the need","lore":"Doctrine holds that nine steps cross the world and a tenth leaves it. Those who take the tenth return rarely and out of order, arriving in some accounts before their own departures. Crossroads shrines address them directly. It is considered unwise to be certain a Tenth Step is absent.","playstyle":"Be everywhere the fight needs you, occasionally before it needs you; distance, walls, and sequence have stopped applying to your movement.","abilities":[{"name":"Nine Steps","desc":"Cross any battlefield in nine strides, ignoring walls, wards, chasms, and everything else the world put in the way."},{"name":"The Tenth","desc":"Step outside the world entirely for a breath; return anywhere you can imagine, untouchable while gone."},{"name":"Already There","desc":"Once per battle, be retroactively where an ally needed you; the blow that struck them struck you instead, and you were ready."}],"progressionSteps":["Reach level 60 and take the step your doctrine forbids, and tell no one what waited on the far side.","Arrive before your own departure, and greet yourself without flinching or asking questions.","Hear yourself prayed to at a midnight crossroads, and answer exactly once."]},{"id":"monk.t5d","name":"Empty Heaven","tier":5,"level":60,"parent":"monk.t4d","role":"Transcendent executioner — ends what cannot die","lore":"The last teaching of the inner path is administered by no one: climb the final stair, strike at heaven, and stand in whatever answers. Those it leaves standing walk back down owning nothing, needing nothing, and able to touch anything — gods included, who are lately difficult to find at home.","playstyle":"Nothing is beyond arm's reach anymore; fight spirits, gods, and abstractions with the same open hand, and end fights by ending the will behind them.","abilities":[{"name":"Knocking at Heaven","desc":"Your strikes land on anything with a spirit — ghosts, gods, possessions, curses — regardless of form, ward, or immortality."},{"name":"Nothing to Take","desc":"Owning nothing, you cannot be disarmed, cursed, possessed, or beguiled; hostile magic finds no purchase and slides off."},{"name":"The Hollow Answer","desc":"Still every spirit in reach; summons unravel, blessings fall mute, and the possessed wake as themselves."},{"name":"Unclenched Fist","desc":"End a battle without a death by striking the will to fight from every foe who can still yield."}],"progressionSteps":["Reach level 60, climb the mountain's last stair alone, strike once at heaven, and stand in the silence that follows.","Still the spirit of something that has never died, and keep its name to yourself forever.","Give away your final possession, the self, and walk back down the stairs anyway."]}]},{"id":"necromancer","name":"Necromancer","archetype":"Esoteric","icon":"💀","tagline":"Death is a resource. Spend it wisely.","description":"Every library keeps one shelf chained, and the Necromancer has read it twice. They begin as scholars of the body's last hour and end as auditors of mortality itself — raising the fallen as labor and infantry, rendering souls into fuel and testimony, and filing their own death under pending. Feared not for cruelty, but for bookkeeping: nothing they love stays buried, and nothing they need stays dead.","nodes":[{"id":"necromancer.t1","name":"Necromancer","tier":1,"level":1,"parent":null,"role":"Summoner — attrition caster with expendable minions","lore":"Most necromancers begin as failed physicians, grave clerks, or students who asked the anatomy lecturer one question too many. Universities expel them; cemeteries employ them. The rank means little more than survival — a scholar who has raised one servant, buried one mistake, and learned that the dead answer politely if the question is precise.","playstyle":"Fight through a single raised servant while draining life from range; trade the minion for time, rebuild it from whatever the battle leaves behind.","abilities":[{"name":"Exhume","desc":"Raise one corpse as a shambling servant that fights until destroyed or dawn, whichever comes first."},{"name":"Last Breath","desc":"Siphon vitality from a wounded enemy; the drain doubles against targets below a quarter of their health."},{"name":"Chill of the Slab","desc":"Numb a target with mortuary cold, slowing their attacks and dulling their pain into hesitation."},{"name":"Grave-Speech","desc":"Ask one question of a corpse dead less than a day; it must answer, though not kindly."}],"progressionSteps":["Read the chained book to its last page, and let no librarian catch you weeping at the margins.","Sit a night's vigil with an unclaimed corpse and learn its name without being told.","Raise your first servant from a pauper's grave, and pay the grave back with honest coin.","Be expelled, disowned, or declared dead — whichever your city requires — and keep studying anyway."]},{"id":"necromancer.t2a","name":"Corpsebinder","tier":2,"level":10,"parent":"necromancer.t1","role":"Minion commander — sustained frontline pressure","lore":"Corpsebinders are the trade's first honest rank: practitioners who keep three or more dead in working order through a full campaign season. Mercenary companies hire them quietly to reduce burial costs and double as reinforcements. The binding is craft, not terror — knots of sinew, verses of ownership, and a ledger of every body owed.","playstyle":"Command a small squad of durable undead from the second rank; repair them mid-fight, rotate the freshest forward, and let attrition do the arguing.","abilities":[{"name":"Muster of the Fallen","desc":"Raise up to three corpses at once; each bound minion persists until destroyed rather than expiring at dawn."},{"name":"Splint and Sinew","desc":"Mend a damaged minion with grave-thread, restoring it to fighting order over six seconds."},{"name":"Dead March","desc":"Your minions advance in lockstep, gaining speed and immunity to fear while moving toward your marked target."},{"name":"Tithe of Teeth","desc":"Harvest a destroyed minion's remains to reduce the cost of your next raising."}],"progressionSteps":["Reach level 10 and keep three risen servants standing through a full turning of the moon.","March your dead twenty leagues without losing one to rot, rivers, or wandering priests.","Bind a soldier who died mid-order, and see that the order is carried out.","Present your ledger of bodies to a Gravemarshal and have no entry questioned."]},{"id":"necromancer.t2b","name":"Pale Scholar","tier":2,"level":10,"parent":"necromancer.t1","role":"Control caster — soul-siphon and denial","lore":"Pale Scholars have stopped studying death in bodies and started studying it in themselves. They fast until the pulse slows, copy forbidden folios by lantern-light, and learn to hold a departing soul the way other scholars hold a quotation. The pallor is not illness. It is the first negotiation with mortality, opened politely.","playstyle":"Control the fight's tempo from range: slow hearts, sever escapes, and bank every kill as stored soul-light to fuel the next incantation.","abilities":[{"name":"Soul-Lantern","desc":"Catch a soul at the moment of death in a glass vessel; spend it later as spell fuel."},{"name":"Sever the Silver","desc":"Cut the cord between body and soul on a target below one-fifth health, ending them instantly."},{"name":"Deadman's Ledger","desc":"Inscribe an enemy's name; if they die within the hour, you learn everything their soul carried."},{"name":"Pallor","desc":"Still your own heart for ten seconds; the dead ignore you and death-magic passes through."}],"progressionSteps":["Reach level 10 and copy the Sallow Concordance in your own hand without once misspelling a true name.","Distill your first soul into glass, and label the vessel honestly.","Let a physician pronounce you dead, and correct the record yourself the next morning.","Sleep one night in your own prepared grave, and rise before you are missed."]},{"id":"necromancer.t3a","name":"Ossuary Captain","tier":3,"level":25,"parent":"necromancer.t2a","role":"Elite-minion commander — durable frontline core","lore":"Ossuary Captains reject the shambling horde as sloppy work. They raise soldiers who remember soldiering — veterans exhumed with their drill intact — and train them in silent yards until a company of bone stands parade-straight. Border lords hire them and pretend not to. A Captain's dozen outfights a warm hundred, and never breaks.","playstyle":"Field a small elite of drilled undead veterans; hold formations, call disciplined maneuvers, and win by refusing to lose a single piece.","abilities":[{"name":"Veteran's Memory","desc":"Corpses of trained soldiers rise with one skill from life intact — shieldwork, archery, or siegecraft."},{"name":"Bone Phalanx","desc":"Your minions lock into a shield line, sharing damage between them and blocking passage entirely."},{"name":"Sergeant's Knell","desc":"Promote one undead to sergeant; nearby minions gain its discipline and strike in unison."},{"name":"Silent Yard","desc":"Drill your company between battles; each drilled minion enters the next fight with hardened bone and faster hands."}],"progressionSteps":["Reach level 25 and raise a soldier of the old wars with every drill-command still in his marrow.","Drill your company a full winter in a yard where no living voice is permitted.","Defeat a living company in open field, then offer its fallen a place in your ranks.","Recover a banner the living abandoned, and let your dead carry it home."]},{"id":"necromancer.t3b","name":"Gravetide Caller","tier":3,"level":25,"parent":"necromancer.t2a","role":"Swarm summoner — overwhelming expendable numbers","lore":"Gravetide Callers follow wars the way gulls follow ploughs. They work the mass graves, the plague pits, the drowned levies — raising the cheap and countless dead in waves that need no drill, only direction. Fastidious colleagues call the work crude. The Callers reply that no wall was ever crude enough to stop the tide.","playstyle":"Flood the field with short-lived shamblers, spend them as ammunition and cover, and replace losses from whatever the enemy was foolish enough to kill.","abilities":[{"name":"Carrion Surge","desc":"Every corpse within forty paces rises at once as a shambler that lasts one minute."},{"name":"Feed the Tide","desc":"Enemies slain by your swarm rise immediately and join it."},{"name":"Chaff of Bone","desc":"Sacrifice nearby shamblers; each one absorbs a blow meant for you."},{"name":"Grave Bloom","desc":"Sow a patch of ground; anything that dies upon it stands back up under your call."}],"progressionSteps":["Reach level 25 and raise a hundred dead in a single hour from a field you did not seed.","Walk the plague-cart circuit of three towns and leave no pit unworked.","Break a walled camp using no weapon but the bodies its defenders made for you.","Stand in the tide's center while it moves, and be the only stillness."]},{"id":"necromancer.t3c","name":"Vesselwright","tier":3,"level":25,"parent":"necromancer.t2b","role":"Immortality engineer — self-sustaining attrition caster","lore":"Vesselwrights turn the scholar's pallor into craft. They fire phylactery-porcelain from bone ash, cut soul-anchors into gemstone, and apportion fragments of themselves into objects that cannot bleed. Each vessel is a masterwork and a hostage. Colleagues judge a Vesselwright's skill by how calmly they discuss their own murder.","playstyle":"Fight like someone with nothing at stake: soak lethal blows into stored vessels, spend fragments of self for power, and rebuild between engagements.","abilities":[{"name":"First Vessel","desc":"On death, your soul retreats to a hidden phylactery and rebuilds your body over three days."},{"name":"Apportioned Self","desc":"Store a fifth of your soul in a carried vessel; soul-targeting magic finds only the remainder."},{"name":"Kiln of Hours","desc":"Transfer a wound's true cost to a prepared vessel, which cracks so you do not."},{"name":"Hairline Death","desc":"Once per battle, a killing blow leaves you at the edge of life and your newest vessel fractured."}],"progressionSteps":["Reach level 25 and fire your first phylactery from bone-ash porcelain, glazed with a year of your own life.","Die once, deliberately, under controlled conditions, and take notes throughout.","Recover a colleague's shattered vessel and return what leaked out, asking nothing.","Hide your first vessel so well that you must trust it rather than check on it."]},{"id":"necromancer.t3d","name":"Soulchandler","tier":3,"level":25,"parent":"necromancer.t2b","role":"Resource caster — soul economy and control","lore":"Soulchandlers render the departing into light. Their lanterns hold souls in cold custody — some as fuel, some as witnesses, some as debts awaiting terms. Magistrates buy their testimony-candles; assassins buy their silence-wicks; the trade regulates itself through professional dread. A good chandler never lies about what a lantern holds.","playstyle":"Fight over an economy of souls: bottle what dies, spend stored light for bursts of power, and threaten the one currency every enemy carries.","abilities":[{"name":"Render the Passing","desc":"Bottle any soul that dies within thirty paces; each stored soul fuels one empowered casting."},{"name":"Witness Light","desc":"Burn a bottled soul as a lantern that replays its final hour for all to see."},{"name":"Wick of Names","desc":"Spend three stored souls at once to double a spell's effect and silence its casting."},{"name":"Cold Custody","desc":"Briefly pull a living enemy's soul into your lantern; the body stands vacant and defenseless."}],"progressionSteps":["Reach level 25 and bottle a soul mid-battle without spilling a single hour of it.","Keep a murdered witness lit until the trial ends, and let the verdict be theirs.","Refuse a fortune for a soul you promised to release, and release it.","Craft a lantern that burns for a year on one honest confession."]},{"id":"necromancer.t4a","name":"Gravemarshal","tier":4,"level":40,"parent":"necromancer.t3a","role":"Legion commander — battlefield-scale undead warfare","lore":"Gravemarshals command the standing legions of the dead — thousands strong, provisioned on nothing, deserting never. Perhaps six hold the rank in any age. Kingdoms map their borders around a Gravemarshal's silence, and generals study their battles with the lights on. Each carries a muster-roll of every soldier raised, owed, and honorably released.","playstyle":"Direct whole formations rather than minions: raise fallen enemies mid-battle, promote undead officers on the field, and grind sieges without supply lines.","abilities":[{"name":"Standard of the Risen","desc":"Plant a bone standard; enemies who die within its shadow rise mid-battle, already sworn to your banner."},{"name":"Field Promotion","desc":"Raise a slain enemy officer as a bound commander whose former troops must resist the urge to flee."},{"name":"Unbroken Line","desc":"Your legions cannot rout, feel no attrition at night, and hold ground while a single bone remains."},{"name":"Terms of Surrender","desc":"Offer a besieged garrison honest terms; those who refuse join your muster-roll in advance."}],"progressionSteps":["Reach level 40 and win a declared siege commanding no living soldier but yourself.","Take the surrender of a dead general on the field where he first fell.","Release a thousand veterans from your service in a single ceremony, and have them thank you.","Have a kingdom cede territory at the rumor of your march, before a single grave is opened."]},{"id":"necromancer.t4b","name":"Charnel Shepherd","tier":4,"level":40,"parent":"necromancer.t3b","role":"Attrition engine — self-replenishing swarm control","lore":"Charnel Shepherds tend the tide as a living thing — pasturing it on old battlefields, culling it, breeding its strongest strains of walking dead. The order is small and pastoral in its horrible way; shepherds trade shamblers at grave-markets and speak of good years. Villages empty at the sound of their bells, unhurriedly.","playstyle":"Sustain a swarm that feeds itself: seed killing grounds, cull the weak for power, and outlast anything that cannot destroy bodies faster than you make them.","abilities":[{"name":"Shepherd's Bell","desc":"Ring once; every unbound corpse within earshot rises and falls in behind you."},{"name":"Cull and Keep","desc":"Destroy your weakest shamblers to imbue the strongest, breeding a hardier strain each battle."},{"name":"Rot Pasture","desc":"Blight the ground; whatever dies upon it rises at once and at full strength."},{"name":"Endless Fold","desc":"Your swarm has no fixed size; each dawn it regrows to yesterday's count from local graves."}],"progressionSteps":["Reach level 40 and keep one swarm whole across three campaigns without returning to a city for bodies.","Breed a strain of shambler that other necromancers travel to buy, and set your own price.","Ring your bell in a fallen kingdom's capital and walk out with its garrison.","Lose the entire fold to holy fire, and rebuild it by the next full moon."]},{"id":"necromancer.t4c","name":"Lich Ascendant","tier":4,"level":40,"parent":"necromancer.t3c","role":"Deathless duelist — attrition you cannot win","lore":"A Lich Ascendant has died the first true death and filed the event away as procedure. The heartbeat is ceremonial now, maintained for company. They are feared less for power than for jurisdiction: killing one is a clerical error, promptly corrected. Most spend the rank in study, since time has stopped charging them for it.","playstyle":"Treat every fight as a negotiation you cannot lose: absorb deaths as cooldowns, ignore mortal pressure entirely, and spend centuries-deep spellcraft with total patience.","abilities":[{"name":"Filed Under Dead","desc":"Dying is a ninety-second interruption; you reassemble at your anchor with full knowledge of your killer."},{"name":"Cold Authority","desc":"Lesser undead obey you without binding, recognizing something further along the road than themselves."},{"name":"Anchor Chain","desc":"Your soul is tethered across many vessels; banishment, possession, and severing simply fail."},{"name":"A Century's Patience","desc":"Channel a spell over minutes rather than seconds, its power scaling far beyond mortal limits."}],"progressionSteps":["Reach level 40 and die your first true death with the ritual complete and your notes legible.","Return in time to attend your own funeral, and leave before you are recognized.","Destroy the record of your birth in every archive that holds it, replacing nothing.","Outstudy a mortal lifetime: read every book you were dying too fast to finish."]},{"id":"necromancer.t4d","name":"Usurer of Souls","tier":4,"level":40,"parent":"necromancer.t3d","role":"Soul broker — execution, denial, and leverage","lore":"Usurers of Souls hold the dead in escrow and the living in terms. Their vaults lend soul-light against collateral no bank can seize back, and their foreclosures are attended by clergy hoping to learn something. The order is tiny, solvent, and untouched — everyone powerful enough to rob one owes one.","playstyle":"Leverage the battlefield like a balance sheet: mark debts on enemies, hold allies' souls in safekeeping, and foreclose on anyone who cannot pay.","abilities":[{"name":"Terms of Collection","desc":"Mark an enemy; if they fall within the hour, their soul routes to your vault, bypassing any afterlife."},{"name":"Compound Interest","desc":"Each strike against a marked debtor drains a little more than the last, without ceiling."},{"name":"Foreclosure","desc":"Sever the soul of a marked enemy below one-quarter health; no resurrection honors the contract they broke."},{"name":"Escrow","desc":"Hold a willing ally's soul in your vault; their body cannot die while the deposit stands."}],"progressionSteps":["Reach level 40 and hold one hundred souls in escrow with every contract witnessed and none disputed.","Foreclose on a tyrant in open court, and read the terms aloud first.","Forgive one debt entirely, and record why in a ledger no one will read.","Survive an audit by the courts of the dead, and be found exact."]},{"id":"necromancer.t5a","name":"Sovereign of the Risen","tier":5,"level":60,"parent":"necromancer.t4a","role":"Mythic commander — nation-scale deathless armies","lore":"Histories record perhaps three Sovereigns of the Risen, and dispute all of them. Each commanded every willing dead soldier of an era — armies that grew by exactly what they defeated. Nations now bury their dead in lead and salt, a custom whose origin children are not taught. The last Sovereign was never defeated, only asked, politely, to stop.","playstyle":"Wage war at the scale of maps: every battle won enlarges the host, every enemy casualty is a recruitment, and retreat merely relocates the muster.","abilities":[{"name":"Grave Levy","desc":"Call the willing dead of an entire province; they rise, form ranks, and await orders."},{"name":"The Standing Muster","desc":"All who fall in any battle you command rise at its end, offered a place rather than compelled."},{"name":"One Order, Ten Thousand Hands","desc":"Issue a single command that every soldier in your host executes simultaneously and without relay."},{"name":"Peace of the Sovereign","desc":"Declare a field at rest; no dead may be raised there by any hand, including yours."}],"progressionSteps":["Reach level 60 and break a crusade raised by seven kingdoms for the sole purpose of ending you.","Muster the dead of an entire forgotten war, and learn each name on the roll.","Refuse a crown offered by the living, and accept the one offered by the dead.","March your host past a city gate and leave it untouched, so the histories must call you something other than monster."]},{"id":"necromancer.t5b","name":"The Unnumbered","tier":5,"level":60,"parent":"necromancer.t4b","role":"Mythic swarm — inexhaustible tide of dead","lore":"Chroniclers stopped estimating the host of the Unnumbered after three censuses returned different figures and one returned no surveyors at all. Whether the title names a necromancer or the tide itself is a scholarly quarrel; the tide does not clarify. It has never been defeated, only outlasted, and never for long.","playstyle":"Play as a weather system: the swarm arrives before you, regrows behind you, and victory means the enemy runs out of world before you run out of dead.","abilities":[{"name":"No Count Holds","desc":"Your host cannot be reduced below half; destroyed shamblers reappear at the swarm's edge each minute."},{"name":"The Graves Answer","desc":"Every burial ground within a day's ride opens at your word, regardless of ward or consecration."},{"name":"Undertow","desc":"The swarm drags one enemy under; they emerge a minute later on your side of the line."},{"name":"Season of the Tide","desc":"For a day and a night, everything that dies in the region rises without being called."}],"progressionSteps":["Reach level 60 and lift a siege by raising the besiegers' own casualties inside their camp each night.","Let three censuses of your host fail, and return one surveyor to tell of it.","Erase your name so thoroughly that scholars argue whether you exist, and attend the debate.","Become the reason a language has a word for the sound graves make when they open."]},{"id":"necromancer.t5c","name":"Archlich","tier":5,"level":60,"parent":"necromancer.t4c","role":"Mythic immortal — inevitability made arcane","lore":"Histories disagree on which century produced the Archlich, and it declines to correct them. It has outlived its enemies, its allies, its language, and at least one calendar. Kingdoms no longer plot its destruction; they plot around its patience. Scholars note that everything it ever wanted has simply, eventually, happened.","playstyle":"Win by being inevitable: no clock, no fear, no attrition applies to you, and every exchange trades the enemy's finite life against your surplus.","abilities":[{"name":"Rescind","desc":"Undo your own death the instant it occurs, anywhere, without travel to an anchor."},{"name":"The Optional Grave","desc":"Grant or revoke death itself for one creature in your presence, once a season."},{"name":"Deep Time","desc":"Your enchantments and curses do not expire; centuries-old workings answer when you call them due."},{"name":"Terminal Lesson","desc":"Show one enemy their complete death in advance; they fight the rest of the battle already grieving."}],"progressionSteps":["Reach level 60 and let a kingdom execute you publicly, then resume your correspondence the same week.","Outlive every person who ever heard your living name, and keep the name anyway.","Complete the work: make your death not defeated, but optional, a formality you may yet schedule.","Be cited by historians in three eras, each certain you belonged to another."]},{"id":"necromancer.t5d","name":"The Wakelight","tier":5,"level":60,"parent":"necromancer.t4d","role":"Mythic arbiter — final passage of souls","lore":"When every other light fails — gods distracted, ferries sunk, heavens shut — the dead walk toward the Wakelight. Histories place it at the end of every great war, unaffiliated, collecting. Whether it guides souls onward or simply keeps them is a theological crisis three churches have declined to investigate closely.","playstyle":"Control where death leads: reroute every dying soul through your flame, extinguish the irredeemable permanently, and return the kept as the rarest mercy.","abilities":[{"name":"All Roads End Here","desc":"Every soul that dies in the region passes through your lantern first, and some are asked to stay."},{"name":"Snuff","desc":"Extinguish one soul utterly; no god, spell, or clause can retrieve it."},{"name":"The Kept Flame","desc":"Return a stored soul to its body whole — a true resurrection, granted rarely and priced honestly."},{"name":"Hour of Moths","desc":"Release a stormcloud of kept souls that swarm your enemies, each whispering its own death."}],"progressionSteps":["Reach level 60 and stand at the end of a war so vast the heavens close their doors against the crowd.","Take custody of every soul the gods misplaced, and lose not one.","Turn away a god who comes to claim a soul in your keeping, and be obeyed.","Become the light the dying see, in every land, in every language."]}]},{"id":"artificer","name":"Artificer","archetype":"Esoteric","icon":"⚙️","tagline":"Every miracle is a prototype; every prototype has a fuse.","description":"Artificers treat magic as a material and disaster as data. Their miracles are drafted at a bench, prototyped in the field, and revised in blood, each failure logged in journals the guilds pretend not to copy. They build companions that outthink their plating and ordnance that keeps its appointments. Everything an artificer makes eventually explodes; the great ones decide precisely when.","nodes":[{"id":"artificer.t1","name":"Artificer","tier":1,"level":1,"parent":null,"role":"Hybrid utility caster — gadgets and preparation","lore":"Every artificer begins as someone who asked why and was told to stop. They are journeymen of a guild that half distrusts them, carrying tool-rolls where knights carry swords and treating spellcraft as an engineering discipline with unusually strict tolerances. Villages hire them to fix mills; wars hire them to fix outcomes.","playstyle":"Versatile toolbox play: deploy gadgets, exploit terrain, and trade raw power for preparation. Weak when caught without a plan, dangerous when given an evening to draft one.","abilities":[{"name":"Jury-Rig","desc":"Assemble a one-use device from scavenged parts; roll on your prototype table for its property, which is never quite nothing."},{"name":"Copper Coil","desc":"Hurl a charged coil that arcs lightning between the two nearest enemies, dealing shock damage to both."},{"name":"Blueprint Ledger","desc":"Once per rest, recall a spent gadget's schematic and rebuild it instantly at half cost."},{"name":"Controlled Misfire","desc":"When a device fails, choose the direction of the failure; enemies in the cone inherit the consequences."}],"progressionSteps":["Apprentice yourself to a guildless tinker who teaches that magic is a material with tolerances, and every tolerance can be exceeded once.","Build a device from scavenged parts and watch it fail. Record why in the journal you will keep until you die.","Present a working prototype to a guild examiner who expected a corpse, and collect your stamp without smiling.","Survive your first misfire. Leave the scar uncovered, so you remember what a misplaced decimal costs."]},{"id":"artificer.t2a","name":"Golemwright","tier":2,"level":10,"parent":"artificer.t1","role":"Summoner — construct companion control","lore":"Golemwrights are the artificers who grew tired of working alone. They animate servitors, teach armor to think, and drag traveling forges through mud to the front lines. Soldiers mock the clanking retinue until it pulls them from under a dead horse; after that, they learn the constructs' names.","playstyle":"Companion-driven midline play: position your servitor, repair between exchanges, and let thinking armor absorb what you cannot dodge. Your action economy is the weapon.","abilities":[{"name":"First Assembly","desc":"Animate a clockwork servitor that fights, carries, and mends; it retains one learned behavior permanently between battles."},{"name":"Thinking Plate","desc":"Your armor studies each attacker, gaining stacking resistance to any damage type it has already survived this combat."},{"name":"Traveling Forge","desc":"Deploy your workshop as a field station that repairs constructs and reloads devices for allies within its glow."},{"name":"Overwound Mainspring","desc":"Wind your servitor past tolerance: it acts twice this round, then seizes for one."}],"progressionSteps":["Reach level 10 and animate a servitor from your own schematics, borrowing no one's blueprint and blaming no one's math.","Teach it one word. When it obeys the third time without being watched, give it a name.","Carry your forge across a battlefield and reb
