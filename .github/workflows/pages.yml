name: Publish to GitHub Pages

# Keeps the gh-pages branch (the published site) in sync with the
# development branch. Pages serves the gh-pages branch root.

on:
  push:
    branches:
      - claude/rpg-class-progression-ui-qzv7i6
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p /tmp/site
          cp index.html screenshot.png /tmp/site/
          cp -r docs data /tmp/site/
          touch /tmp/site/.nojekyll

      - name: Push to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
